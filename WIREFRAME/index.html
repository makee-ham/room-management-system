<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317314a'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial' font-size='24' font-weight='700' fill='white'%3ECA%3C/text%3E%3C/svg%3E">
  <title>CASTLE THE ART 객실관리 · 데모 와이어프레임</title>
  <style>
    :root {
      --canvas: #f4f7fa;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --ink: #142437;
      --muted: #607085;
      --subtle: #7d8998;
      --line: #dbe3eb;
      --line-strong: #c7d2de;
      --navy: #17314a;
      --navy-2: #244965;
      --green: #167a5a;
      --green-soft: #e9f7f1;
      --amber: #a95f00;
      --amber-soft: #fff5e4;
      --red: #cf3340;
      --red-soft: #fff0f1;
      --blue: #286ca8;
      --blue-soft: #edf6ff;
      --shadow: 0 12px 30px rgba(20, 36, 55, .08);
      --radius: 14px;
      --sidebar: 228px;
      --topbar: 72px;
      --bottom-nav: 74px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--canvas); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--canvas);
      font-family: Pretendard, Inter, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, select, input[type="checkbox"], input[type="radio"] { cursor: pointer; }
    button:disabled, select:disabled, input:disabled { cursor: not-allowed; opacity: .52; }
    a { color: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: clamp(1.45rem, 2.2vw, 1.85rem); line-height: 1.22; letter-spacing: -.03em; }
    h2 { margin-bottom: 12px; font-size: 1.12rem; line-height: 1.35; letter-spacing: -.015em; }
    h3 { margin-bottom: 8px; font-size: .98rem; line-height: 1.4; }
    svg { display: block; }
    .sr-only {
      position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important;
      margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important; border: 0 !important;
    }
    .skip-link { position: fixed; left: 12px; top: -120px; z-index: 1000; min-height:44px; padding: 10px 14px; display:flex; align-items:center; background: var(--navy); color: #fff; border-radius: 8px; white-space: nowrap; }
    .skip-link:focus { top: 12px; }
    :focus-visible { outline: 3px solid #60a5fa; outline-offset: 2px; }
    #main-content:focus-visible { outline: none; }

    .icon { width: 20px; height: 20px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 16px; height: 16px; }
    .icon-lg { width: 24px; height: 24px; }
    .btn, .icon-btn, .nav-btn, .bottom-nav button, .segmented button {
      border: 1px solid transparent;
      background: transparent;
      min-height: 44px;
      border-radius: 10px;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
    }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; font-size: 14px; font-weight: 750; white-space: nowrap; }
    .btn:hover:not(:disabled), .icon-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-primary { color: #fff; background: var(--navy); border-color: var(--navy); }
    .btn-primary:hover:not(:disabled) { background: var(--navy-2); }
    .btn-success { color: #fff; background: var(--green); border-color: var(--green); }
    .btn-danger { color: #fff; background: var(--red); border-color: var(--red); }
    .btn-outline { color: var(--navy); background: #fff; border-color: var(--line-strong); }
    .btn-ghost { color: var(--muted); background: transparent; border-color: transparent; }
    .btn-soft { color: var(--navy); background: #eef3f7; border-color: #eef3f7; }
    .btn-block { width: 100%; }
    .icon-btn { position: relative; display: inline-grid; place-items: center; width: 44px; min-width: 44px; padding: 0; color: var(--navy); background: #fff; border-color: var(--line); }
    .count-dot { position: absolute; top: -4px; right: -3px; display: grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border: 2px solid #fff; border-radius: 999px; color: #fff; background: var(--red); font-size: 10px; font-weight: 800; }

    .demo-strip { position: sticky; top: 0; z-index: 70; color: #fff; background: #10283d; box-shadow: 0 1px 0 rgba(255,255,255,.1); }
    .demo-strip-inner { display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 6px clamp(12px, 2vw, 28px); }
    .demo-label { display: flex; align-items: center; gap: 8px; min-width: max-content; font-size: 13px; font-weight: 800; letter-spacing: .01em; }
    .demo-label .signal { width: 8px; height: 8px; border-radius: 50%; background: #f5bc54; box-shadow: 0 0 0 4px rgba(245,188,84,.15); }
    .demo-toggle { display: none; margin-left: auto; color: #fff; border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.08); }
    .demo-controls { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .demo-field { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .demo-field label { color: #afbfcd; font-size: 12px; white-space: nowrap; }
    .demo-field select { height: 44px; max-width: 190px; min-width: 96px; padding: 0 30px 0 10px; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; color: #fff; background: #19364f; }
    .demo-field.scenario { flex: 1; }
    .demo-field.scenario select { width: 100%; max-width: 360px; }
    .demo-reset { margin-left: auto; color: #fff; border-color: rgba(255,255,255,.25); }

    .app-shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: calc(100vh - 50px); }
    .sidebar { position: sticky; top: 50px; align-self: start; height: calc(100vh - 50px); padding: 22px 16px; background: #fff; border-right: 1px solid var(--line); overflow-y: auto; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 2px 6px 24px; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; color: #fff; background: linear-gradient(145deg, #9d7224, #c79b45); font-family: Georgia, serif; font-weight: 800; }
    .brand-name { font-size: 12px; font-weight: 900; letter-spacing: .11em; line-height: 1.2; }
    .brand-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .identity { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-soft); }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; background: var(--navy); font-weight: 800; }
    .identity strong { display: block; font-size: 13px; }
    .identity span { display: block; color: var(--muted); font-size: 12px; }
    .side-nav { display: grid; gap: 5px; }
    .nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; color: var(--muted); font-size: 14px; font-weight: 750; text-align: left; }
    .nav-btn:hover { color: var(--navy); background: #f2f6f9; }
    .nav-btn[aria-current="page"] { color: #fff; background: var(--navy); box-shadow: 0 8px 18px rgba(23,49,74,.15); }
    .side-foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }

    .workspace { min-width: 0; }
    .topbar { position: sticky; top: 50px; z-index: 50; display: flex; align-items: center; gap: 16px; min-height: var(--topbar); padding: 12px clamp(16px, 2.4vw, 32px); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); backdrop-filter: blur(12px); }
    .topbar-title { min-width: 0; flex: 1; }
    .topbar-title p { margin: 0; color: var(--muted); font-size: 12px; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    main { width: 100%; max-width: 1600px; margin: 0 auto; padding: clamp(16px, 2vw, 30px); }
    .bottom-nav { display: none; }

    .scenario-coach { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; padding: 13px 15px; border: 1px solid #cfe0ef; border-radius: 12px; background: #f0f7fd; }
    .scenario-coach .step { display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; color: #fff; background: var(--blue); font-size: 12px; font-weight: 900; }
    .scenario-coach strong { display: block; margin-bottom: 2px; font-size: 13px; }
    .scenario-coach p { margin: 0; color: #47627a; font-size: 13px; }
    .scenario-coach .btn { margin-left: auto; }

    .notice { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--muted); font-size: 13px; }
    .notice strong { color: var(--ink); }
    .notice-danger { border-color: #f1b7bc; background: var(--red-soft); color: #8c2730; }
    .notice-warning { border-color: #efd5a8; background: var(--amber-soft); color: #775021; }
    .notice-success { border-color: #b9dfcf; background: var(--green-soft); color: #17644d; }
    .notice-info { border-color: #c9ddec; background: var(--blue-soft); color: #345f80; }

    .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; }
    .section-head .meta { color: var(--muted); font-size: 12px; }
    .section-head .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: 0 1px 1px rgba(20,36,55,.02); }
    .card-pad { padding: 16px; }
    .queue-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
    .queue-card { position: relative; display: flex; flex-direction: column; min-height: 176px; padding: 15px; overflow: hidden; }
    .queue-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--line-strong); }
    .queue-card.danger::before { background: var(--red); }
    .queue-card.warning::before { background: var(--amber); }
    .queue-card.success::before { background: var(--green); }
    .queue-card h3 { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
    .queue-card .count { margin-bottom: 8px; font-size: 1.45rem; line-height: 1; font-weight: 900; letter-spacing: -.03em; }
    .queue-card p { margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    .queue-card .btn { margin-top: auto; }
    .badge { display: inline-flex; align-items: center; gap: 5px; width: max-content; max-width: 100%; min-height: 26px; padding: 3px 8px; border-radius: 7px; font-size: 12px; font-weight: 800; line-height: 1.2; }
    .badge-red { color: #a3212d; background: var(--red-soft); border: 1px solid #f5c2c6; }
    .badge-amber { color: #8b5107; background: var(--amber-soft); border: 1px solid #f0d4a8; }
    .badge-green { color: #17674e; background: var(--green-soft); border: 1px solid #bfe1d2; }
    .badge-blue { color: #245f91; background: var(--blue-soft); border: 1px solid #c9e1f4; }
    .badge-neutral { color: #526174; background: #f1f4f7; border: 1px solid #dce3ea; }

    .dashboard-layout { display: grid; grid-template-columns: minmax(0, 1fr) 286px; gap: 16px; align-items: start; }
    .rail { display: grid; gap: 12px; }
    .rail .card { padding: 14px; }
    .rail-list { display: grid; gap: 8px; margin: 10px 0 12px; }
    .rail-row { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 7px 8px; border-radius: 8px; background: var(--surface-soft); font-size: 12px; }
    .rail-row strong { margin-right: auto; }
    .rail-row input { width: 18px; height: 18px; }

    .date-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .date-current { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); font-weight: 800; }
    .select-control, .input-control, textarea.input-control { min-height: 44px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; }
    .select-control { padding-right: 32px; }
    .date-tools .filter-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .room-table { overflow: hidden; }
    .room-head, .room-row { display: grid; grid-template-columns: 56px minmax(145px, 1.35fr) 118px minmax(150px, 1.2fr) 128px 118px; gap: 8px; align-items: center; }
    .room-head { padding: 10px 14px; color: var(--muted); background: var(--surface-soft); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .room-row { min-height: 74px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .room-row:last-child { border-bottom: 0; }
    .room-row:hover { background: #fbfdff; }
    .room-no { font-size: 16px; font-weight: 900; }
    .room-type { min-width: 0; }
    .room-type strong { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 13px; }
    .room-type span, .cell-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .status-cell { min-width: 0; }
    .status-cell p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .row-action .btn { width: 100%; }

    .job-list { display: grid; gap: 13px; }
    .job-card { padding: 16px; }
    .job-card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .job-card-top .availability { margin-left: auto; }
    .job-title { min-width: 0; flex: 1; }
    .job-title h3 { margin: 0 0 2px; font-size: 1.07rem; }
    .job-title p { display: -webkit-box; margin: 0; overflow: hidden; color: var(--muted); font-size: 14px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .job-meta { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin: 12px 0; }
    .job-meta > div { padding: 10px; border-radius: 9px; background: var(--surface-soft); }
    .job-meta span { display: block; color: var(--muted); font-size: 12px; }
    .job-meta strong { display: block; margin-top: 2px; font-size: 14px; }
    .schedule-line { display: flex; gap: 8px; margin-bottom: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; color: #34485e; background: #fff; font-size: 13px; }
    .job-actions { display: flex; gap: 8px; }
    .job-actions > .btn { min-width: 0; flex: 1 1 0; }
    .summary-strip { display: flex; gap: 16px; margin-bottom: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .summary-strip span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
    .summary-strip strong { color: var(--ink); }

    .detail-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .detail-head .btn { flex: 0 0 auto; }
    .detail-title { min-width: 0; flex: 1; }
    .detail-title h2 { margin: 0 0 4px; font-size: 1.35rem; }
    .detail-title p { margin: 0; color: var(--muted); font-size: 13px; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); gap: 16px; align-items: start; }
    .detail-stack { display: grid; gap: 14px; }
    .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .info-item { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); }
    .info-item span { display: block; color: var(--muted); font-size: 12px; }
    .info-item strong { display: block; margin-top: 3px; font-size: 14px; }
    .timeline { position: relative; display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .timeline li { position: relative; padding: 0 0 18px 28px; }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline li::before { content: ""; position: absolute; left: 7px; top: 7px; bottom: -7px; width: 2px; background: var(--line); }
    .timeline li:last-child::before { display: none; }
    .timeline li::after { content: ""; position: absolute; left: 2px; top: 4px; width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 2px #bfdbef; }
    .timeline strong { display: block; font-size: 13px; }
    .timeline span { display: block; color: var(--muted); font-size: 12px; }
    .check-list { display: grid; gap: 8px; }
    .check-row { display: flex; align-items: flex-start; gap: 10px; min-height: 48px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; }
    .check-row input { width: 20px; height: 20px; margin-top: 1px; flex: 0 0 auto; }
    .check-row strong { display: block; font-size: 14px; }
    .check-row span { display: block; color: var(--muted); font-size: 12px; }
    .upload-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .upload-tile { min-height: 92px; padding: 12px; border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--surface-soft); }
    .upload-tile.failed { border-color: #ee9ba2; background: var(--red-soft); }
    .upload-tile.done { border-style: solid; border-color: #a7d6c3; background: var(--green-soft); }
    .upload-tile strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .upload-tile span { color: var(--muted); font-size: 12px; }
    .upload-tile .btn { margin-top: 8px; }
    .pin-box { display: flex; align-items: center; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface-soft); }
    .pin-value { margin-right: auto; font-size: 1.25rem; font-weight: 900; letter-spacing: .18em; }

    .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 11px; background: #eaf0f5; overflow-x: auto; }
    .tabs button { min-height: 44px; padding: 8px 13px; border: 0; border-radius: 8px; color: var(--muted); background: transparent; font-weight: 750; white-space: nowrap; }
    .tabs button[aria-selected="true"] { color: var(--navy); background: #fff; box-shadow: 0 1px 5px rgba(20,36,55,.08); }
    .settings-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .setting-card { display: flex; align-items: flex-start; gap: 12px; min-height: 126px; padding: 16px; }
    .setting-icon { display: grid; place-items: center; flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; color: var(--navy); background: #edf3f7; }
    .setting-card p { margin-bottom: 12px; color: var(--muted); font-size: 13px; }

    .state-panel { padding: 28px 18px; text-align: center; }
    .state-panel .state-icon { display: grid; place-items: center; width: 50px; height: 50px; margin: 0 auto 12px; border-radius: 50%; color: var(--muted); background: #eef2f6; }
    .state-panel p { max-width: 420px; margin: 0 auto 14px; color: var(--muted); font-size: 13px; }
    .skeleton-list { display: grid; gap: 9px; padding: 14px; }
    .skeleton { height: 68px; border-radius: 10px; background: linear-gradient(90deg,#edf1f5 20%,#f7f9fb 50%,#edf1f5 80%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .modal-backdrop { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 18px; background: rgba(10, 25, 39, .58); }
    .modal { width: min(560px, 100%); max-height: min(760px, calc(100vh - 36px)); overflow: auto; border-radius: 16px; background: #fff; box-shadow: 0 30px 90px rgba(0,0,0,.25); }
    .modal-lg { width: min(760px, 100%); }
    .modal-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); background: #fff; }
    .modal-head h2 { margin: 0; font-size: 1.18rem; }
    .modal-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .modal-head .icon-btn { margin-left: auto; }
    .modal-body { padding: 18px 20px; }
    .modal-foot { position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: #fff; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field-full { grid-column: 1 / -1; }
    .field label, .field .label { font-size: 13px; font-weight: 750; }
    .field small { color: var(--muted); font-size: 12px; }
    .choice-list { display: grid; gap: 8px; }
    .choice { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
    .choice input { width: 20px; height: 20px; margin-top: 1px; flex: 0 0 auto; }
    .choice strong { display: block; font-size: 14px; }
    .choice span { display: block; color: var(--muted); font-size: 12px; }
    .toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 300; display: grid; gap: 8px; width: min(380px, calc(100vw - 36px)); pointer-events: none; }
    .toast { padding: 13px 15px; border-radius: 11px; color: #fff; background: #183149; box-shadow: var(--shadow); font-size: 13px; font-weight: 700; animation: toast-in .2s ease-out; }
    .toast.error { background: #982f38; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

      function showModal(options) {
        const {trigger=document.activeElement,historyKind='generic',historyPayload=null}=options;
        modalTrigger=trigger;
        const root=document.getElementById('modal-root');
        root.innerHTML=standardModalMarkup(options);
        setModalBackgroundLocked(true);document.body.classList.add('modal-open');
        registerModalHistory({kind:historyKind,payload:historyPayload});

        requestAnimationFrame(()=>root.querySelector('button, input, select, textarea')?.focus());

      function setModalBackgroundLocked(locked){const app=document.getElementById('app');if(!app)return;app.inert=locked;if(locked)app.setAttribute('aria-hidden','true');else app.removeAttribute('aria-hidden');}
      function closeModal() {
        const root=document.getElementById('modal-root'),hadModal=!!root?.hasChildNodes(),entry=history.state,modalEntryId=entry?.modalEntryId,triggerFocus=historyFocusDescriptor(modalTrigger);
        historyReturnFocus=historyReturnFocus||triggerFocus;
        rawCloseModal();
        if(!hadModal||!isWireframeHistory(entry)||entry.layer!=='modal'||historyTraversalPending)return;
        queueMicrotask(()=>{
          if(historyTraversalPending||history.state?.modalEntryId!==modalEntryId)return;
          const route=historyRouteSnapshot(),depth=Math.max(1,Number(entry.modalDepth)||1);
          if(!completedModalSessions.some(session=>session.modalSessionId===entry.modalSessionId))completedModalSessions.push({modalSessionId:entry.modalSessionId,route});
          if(isPinHistoryKind(entry.modalKind))clearPinModalSecret(entry.modalSessionId);
          historyTraversalOverride=route;historyTraversalPending=true;history.go(-depth);
        });
      }

      function dateObject(value=state.selectedDate) {
        const [y,m,d]=value.split('-').map(Number);
        return new Date(y,m-1,d);
      }
      function dateIso(date) {
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      }
      function dateLabel(value=state.selectedDate) {
        const d=dateObject(value), day=['일','월','화','수','목','금','토'][d.getDay()];
        return `${d.getMonth()+1}월 ${d.getDate()}일 (${day})`;
      }
      function weekStartIso(value) {
        const d=dateObject(value), offset=(d.getDay()+6)%7;
        d.setDate(d.getDate()-offset);
        return dateIso(d);
      }
      function normalizePayWeek(value) {
        if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return null;
        const date=dateObject(value);
        if(dateIso(date)!==value)return null;
        const start=weekStartIso(value);
        return start<='2026-08-10'?start:null;
      }
      function weekRangeLabel(start,withYear=false) {
        const from=dateObject(start),to=new Date(from);to.setDate(from.getDate()+6);
        const prefix=withYear?`${from.getFullYear()}년 `:'';
        const fromText=`${from.getMonth()+1}월 ${from.getDate()}일(월)`;
        const toText=from.getMonth()===to.getMonth()?`${to.getDate()}일(일)`:`${to.getMonth()+1}월 ${to.getDate()}일(일)`;
        return `${prefix}${fromText}–${toText}`;
      }
      function renderDateTools(showFilters=false) {

        </div>`;
      }

      function calendarMarkup() {
        const [year,month]=state.calendarMonth.split('-').map(Number);
        const payMode=state.calendarContext==='admin-pay'||state.calendarContext==='maid-pay';
        const paySelected=state.calendarContext==='admin-pay'?state.adminPayWeek:(state.maidPaySelectedWeek||state.maidPayOpenWeek||'2026-08-03');
        const first=new Date(year,month-1,1), offset=payMode?(first.getDay()+6)%7:first.getDay(), start=new Date(year,month-1,1-offset);
        const days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
        return `<div class="calendar-backdrop" data-action="calendar-backdrop"><section class="calendar-dialog" role="dialog" aria-modal="true" aria-labelledby="calendar-title">
          <div class="calendar-head"><button class="icon-btn" type="button" data-action="calendar-month" data-offset="-1" aria-label="이전 달">${icon('chevronLeft')}</button><strong id="calendar-title">${year}년 ${month}월</strong><button class="icon-btn" type="button" data-action="calendar-month" data-offset="1" aria-label="다음 달">${icon('chevronRight')}</button></div>
          ${payMode?`<p class="pay-week-calendar-note">날짜를 누르면 그 날짜가 포함된 월요일–일요일 주차를 선택합니다.</p>`:''}
          <div class="calendar-week" aria-hidden="true">${(payMode?['월','화','수','목','금','토','일']:['일','월','화','수','목','금','토']).map(v=>`<span>${v}</span>`).join('')}</div>
          <div class="calendar-grid">${days.map(d=>{const iso=dateIso(d), other=d.getMonth()!==month-1, today=iso==='2026-08-15', weekSelected=payMode&&weekStartIso(iso)===paySelected, selected=payMode?iso===paySelected:iso===state.selectedDate, future=payMode&&weekStartIso(iso)>'2026-08-10';return `<button type="button" class="calendar-day ${other?'other':''} ${today?'today':''} ${weekSelected?'week-selected':''} ${selected?'selected':''}" data-action="calendar-select" data-date="${iso}" ${payMode?`aria-pressed="${weekSelected}"`:`aria-current="${selected?'date':'false'}"`} aria-label="${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일${today?' 오늘':''}${weekSelected?' 선택 주차':''}" ${future?'disabled':''}>${d.getDate()}</button>`;}).join('')}</div>

      function renderAccordion(key,title,count,body,open=false) {

      function roomPresentation(no) {
        const room=ROOMS.find(r=>r.no===no), job=state.jobs[no], candle=state.candles[no]||0, special=roomReservationStatus(room);
        if (!room) return {tone:'neutral',status:'상세 확인',reason:'데모 객실'};
        if (state.roomStopped[no]) { const stop=state.roomMoves[no]||{}, reason=state.roomStopReasons[no]||stop.reason||'사유 확인 필요'; return {tone:'red',status:'운영 중지',reason:`${reason}${stop.to?` · 대체 ${stop.to}호`:''}`,available:false,cleaning:false}; }
        if (room.occupancy==='occupied') return {tone:'neutral',status:'예약상 투숙 중',reason:special.late?`${reservationStatusText(special,'checkout')} · 촛불 적용 안 함`:room.stayover?'장기투숙 · 연박 청소 요청':'현재 점유 중',available:false,cleaning:!!room.stayover};
        if (no==='201') {
          if (job==='approved'&&candle===0) return {tone:'green',status:'입실 준비 완료',reason:'검수 승인 · 촛불 0개 · 운영 정상',available:true,cleaning:false,early:special.early};

        }
        if (job==='cleaning') return {tone:'amber',status:'청소 중',reason:`담당 ${room.assignee} · 완료 후 검수 필요`,available:false,cleaning:true};
        if (job==='upload') return {tone:'amber',status:'현장 완료 · 업로드 대기',reason:'필수 사진 미전송 재시도 필요',available:false,cleaning:true};
        if (job==='inspection') return {tone:'amber',status:'검수 대기',reason:'청소 전체 제출 · 관리자 확인 필요',available:false,cleaning:true};
        if (job==='reclean') return {tone:'amber',status:'재청소 필요',reason:`전체 반려 · 기존 담당 ${room.assignee} 재청소`,available:false,cleaning:true};
        if (job==='hold') return {tone:'amber',status:'관리자 조치 대기',reason:'담당 취소 승인 · 관리자 재배정 필요',available:false,cleaning:true};
        if (job==='approved'&&candle===0) return {tone:'green',status:'고객 배정 가능',reason:'청소·검수 완료 · 촛불 0개',available:true,cleaning:false};
        if (job==='public'||job==='unassigned'||job==='claimed'||job==='scheduled'||job==='draft'||job==='future'||job==='stayover-requested') return {tone:job==='future'?'neutral':'amber',status:job==='future'?'미래 예약':'청소 필요',reason:job==='public'||job==='unassigned'?'관리자 배정 대기':job==='claimed'?'관리자 배정 확정 · 시작 대기':job==='draft'?'배정 준비 청소 작업':job==='future'?'예약 등록 가능 · 현재 입실 불가':job==='stayover-requested'?'연박 청소 요청':'청소 일정 확인',available:false,cleaning:true};

      function renderPinRow(no,{editable=true,maid=false}={}) {

      function maidPinAllowed(no) {

      }

      function roomCard(no) {
        const room=ROOMS.find(r=>r.no===no), type=ROOM_TYPES[room.type], p=roomPresentation(no), candle=state.candles[no]||0, special=roomReservationStatus(room), issueCount=roomIssueRecords(no).length;
        const earlyTime=special.checkin||DEFAULT_CHECKIN_TIME, lateTime=special.checkout||DEFAULT_CHECKOUT_TIME;
        const checkoutDisplay=special.late?lateTime:room.checkout,checkinDisplay=special.early?earlyTime:room.checkin;
        const tag1=room.occupancy==='occupied'?(special.late?'오늘 퇴실':'투숙 중'):special.early?'오늘 입실':room.checkout.includes('완료')?'퇴실 완료':room.occupancy==='future'?'미래 예약':'공실';
        const displayStatus=room.occupancy==='occupied'?'현재 투숙 중':special.early&&!p.available?'얼리 체크인 준비 중':p.status;

        const cleaningAction=['public','draft','future','scheduled'].includes(state.jobs[no])?'direct-assign':'cleaning-detail';
        const panelTone=special.early&&!p.available?'amber':p.available?'green':p.tone==='red'?'red':'';

          ${renderPinRow(no)}<button class="room-work-line concept-cleaning-row" type="button" data-action="${cleaningAction}" data-id="${no}"><span class="concept-cleaning-icon">${icon('briefcase')}</span><div><strong>${cleaningLabel(state.jobs[no])}</strong><span>${state.jobs[no]==='scheduled'?`${startTimeFor(no)} 이후 시작 · 담당 ${room.assignee}`:cleaningReason(no)}</span></div>${icon('chevronRight')}</button></div>
          <div class="room-quick-actions"><button class="btn btn-ghost" type="button" data-action="reservation-edit" data-id="${no}">${icon('calendar')}예약 상세</button><button class="btn btn-ghost" type="button" data-action="operation-status" data-id="${no}">${icon('shield')}운영 상태</button><button class="btn btn-ghost" type="button" data-action="direct-assign" data-id="${no}" ${['cleaning','upload','inspection','approved','reclean'].includes(state.jobs[no])?'disabled':''}>${icon('user')}청소 담당</button><button class="btn btn-ghost" type="button" data-action="room-detail" data-id="${no}">${icon('list')}전체 상세</button></div></article>`;
      }
      function cleaningLabel(job) { return ({scheduled:'퇴실 청소 · 시작 예정',inspection:'퇴실 청소 · 검수 대기',cleaning:'퇴실 청소 · 청소 중',upload:'퇴실 청소 · 업로드 대기',approved:'현재 청소 작업 없음',reclean:'재청소 · 시작 예정',public:'청소 · 관리자 배정 대기',unassigned:'청소 · 관리자 배정 대기',claimed:'퇴실 청소 · 관리자 배정 확정',hold:'관리자 조치 대기',draft:'배정 준비 청소 작업',future:'미래 퇴실 청소 예정','stayover-requested':'연박 청소 요청'})[job]||'현재 청소 작업 없음'; }

      function renderAdminToday() {
        const roomStates=ROOMS.map(room=>({room,presentation:roomPresentation(room.no)}));
        const availableCount=roomStates.filter(item=>item.presentation.available===true).length;
        const cleaningCount=roomStates.filter(item=>item.presentation.cleaning===true).length;

candle?`${candle}개`:'없음',candle?'amber':'green')}</div><p class="audit-note">투숙 중이 아닌 객실은 운영 상황에 맞게 관리자가 유연하게 변경할 수 있습니다.</p><div class="candle-stepper" role="group" aria-label="${no}호 관리자 촛불 수량"><button class="btn btn-outline" type="button" data-action="candle-change" data-id="${no}" data-delta="-1" aria-label="촛불 1개 줄이기" ${candle<1?'disabled':''}>−</button><div class="candle-stepper-value" aria-live="polite"><strong>${candle}개</strong><span>현재 객실 수량</span></div><button class="btn btn-outline" type="button" data-action="candle-change" data-id="${no}" data-delta="1" aria-label="촛불 1개 늘리기">+</button></div></section>`}<section class="card card-pad"><div class="section-head"><h3>청소 작업</h3>${statusBadge(statusLabel(state.jobs[no]),['cleaning','upload','inspection'].includes(state.jobs[no])?'amber':'neutral')}</div><div class="info-grid"><div class="info-item"><span>작업</span><strong>${cleaningLabel(state.jobs[no])}</strong></div><div class="info-item"><span>담당</span><strong>${esc(room.assignee)}</strong></div><div class="info-item"><span>고정 단가 · 데모</span><strong>${money(type.rate)}</strong></div><div class="info-item"><span>예상시간 · 데모</span><strong>${type.minutes}분</strong></div></div>${['public','draft','future','scheduled'].includes(state.jobs[no])?`<div style="margin-top:12px">${button('청소 담당 직접 배정','direct-assign','primary',`data-id="${no}"`)}</div>`:''}</section></div><aside class="detail-stack"><section class="card card-pad"><div class="section-head"><h3>운영 상태</h3>${statusBadge(state.roomStopped[no]?'운영 중지':'정상',state.roomStopped[no]?'red':'green')}</div>${state.roomStopped[no]?`<div class="notice notice-danger">고객 배정이 중지됐습니다.${state.roomMoves[no]?` 대체 객실 ${state.roomMoves[no].to}호를 배정했고 원 이력은 보존됩니다.`:''}</div>${button('운영 재개','resume-operation','success',`data-id="${no}"`)}`:`<p class="audit-note">모든 객실 상태에서 운영 중지할 수 있으며, 다른 객실 배정은 이 흐름 안에서만 진행합니다.</p>${button('운영 중지·대체 객실','operation-status','danger',`data-id="${no}"`)}`}</section><section class="card card-pad"><h3>객실 사건 타임라인</h3>${renderTimeline(no)}</section></aside></div><div class="sticky-command"><button class="btn btn-${primary[2]}" type="button" data-action="${primary[1]}" data-id="${no}">${primary[0]}</button></div>`;
      }

      function renderRoomConflict202() {

/strong></div></div></section>`;
        return renderCoach()+renderNetworkNotice()+detailHeader('202호',`${type.name} · 레이트 체크아웃 예외`)+`<div class="detail-grid"><div class="detail-stack">${statePanel}<section class="card card-pad"><div class="room-card-head"><div><h3>202호 현재 상태</h3><p>자동 체크아웃 삭제 없이 점유 재개 보정을 반영합니다.</p></div><div class="badge-row">${statusBadge(active?'출입 충돌':'점유 재개·재계획 완료',active?'red':'green')}${statusBadge('투숙 중','neutral')}</div></div><div class="time-band"><span>퇴실 <strong>${record.afterCheckout}</strong></span><span>→</span><span>입실 <strong>${esc(room.checkin)}</strong></span><span class="special">${esc(reservationStatusText(special,'checkout'))}</span></div><div class="status-band ${active?'red':'green'}"><div><strong>${active?'현재 입실·청소 출입 차단':'13:00까지 점유 유지'}</strong><span>${active?'충돌 종결 전 일정·lease 재검증 필요':'청소는 13:00으로 재계획됨'}</span></div>${statusBadge('현재 입실 불가','neutral')}</div>${renderPinRow('202')}</section><section class="card card-pad"><div class="section-head"><h3>예약·청소 영향</h3>${statusBadge(active?'보정 대기':'보정 완료',active?'red':'green')}</div><div class="info-grid"><div class="info-item"><span>예약 체크아웃</span><strong>${record.afterCheckout}</strong></div><div class="info-item"><span>자동 상태 · 11:00 기준</span><strong>${esc(reservationStatusText(special,'checkout'))}</strong></div><div class="info-item"><span>현재 점유</span><strong>투숙 중</strong></div><div class="info-item"><span>청소 담당</span><strong>${record.assignee}</strong></div><div class="info-item"><span>청소 단계</span><strong>${active?'기존 회차 일시 정지':'13:00 새 회차 예정'}</strong></div></div></section></div><aside class="detail-stack"><section class="card card-pad"><div class="section-head"><h3>운영 상태</h3>${statusBadge(active?'충돌 잠금':'정상 보정','green')}</div><p class="audit-note">예약·작업·PIN lease 이벤트를 삭제하지 않고 순서대로 보존합니다.</p></section><section class="card card-pad"><h3>객실 사건 타임라인</h3>${renderTimeline('202')}</section></aside></div><div class="sticky-command"><button class="btn btn-${active?'danger':'primary'}" type="button" data-action="${active?'resolve-conflict-v2':'cleaning-detail'}" data-id="202" ${active&&isLocked()?'disabled':''}>${active?'영향 확인·충돌 해결':'재계획된 청소 보기'}</button></div>`;
      }

      function renderRoomOperationDetailPanel(no) {
        if(state.roomStopped[no]){
          const move=state.roomMoves[no]||{}, reason=state.roomStopReasons[no]||move.reason||'사유 확인 필요';
          return `<section class="card card-pad" style="border-color:#e4a5aa;background:var(--red-soft)"><div class="section-head"><h3>운영 상태</h3>${statusBadge('운영 중지','red')}</div><div class="info-grid"><div class="info-item"><span>중지 사유</span><strong>${esc(reason)}</strong></div><div class="info-item"><span>대체 객실</span><strong>${move.to?`${esc(move.to)}호`:'배정 없음'}</strong></div></div><p class="audit-note" style="margin:10px 0">예약·청소·충돌 이력은 삭제하지 않고 운영 재개 뒤에도 감사 이력에 보존됩니다.</p>${button('운영 재개','resume-operation','success',`data-id="${no}"`)}</section>`;
        }
        const conflictLocked=no==='202'&&state.conflict==='active';
        return `<section class="card card-pad"><div class="section-head"><h3>운영 상태</h3>${statusBadge(conflictLocked?'충돌 잠금':'정상',conflictLocked?'amber':'green')}</div><p class="audit-note">${conflictLocked?'출입 충돌 해결 전에도 별도 운영 중지는 가능하며 예약·작업 이력은 삭제하지 않습니다.':'모든 객실 상태에서 운영 중지할 수 있으며, 다른 객실 배정은 이 흐름 안에서만 진행합니다.'}</p>${button('운영 중지·대체 객실','operation-status','danger',`data-id="${no}"`)}</section>`;
      }

      function mergeRoomOperationPanel(html,no) {
        const replacement=renderRoomOperationDetailPanel(no);
        const startMarker='<section class="card card-pad"><div class="section-head"><h3>운영 상태</h3>', timelineMarker='</section><section class="card card-pad"><h3>객실 사건 타임라인';
        const start=html.lastIndexOf(startMarker), end=start<0?-1:html.indexOf(timelineMarker,start);
        if(start<0||end<0)return html;
        return html.slice(0,start)+replacement+html.slice(end+'</section>'.length);
      }
      function mergeRoomIssuesPanel(html,no) {
        const markers=['<section class="card card-pad"><div class="section-head"><h3>청소 작업</h3>','<section class="card card-pad"><div class="section-head"><h3>예약·청소 영향</h3>'];
        const indexes=markers.map(marker=>html.indexOf(marker)).filter(index=>index>=0),insertAt=indexes.length?Math.min(...indexes):-1;
        if(insertAt<0)return html;
        return html.slice(0,insertAt)+renderRoomIssuesSection(no)+html.slice(insertAt);
      }

      function renderRoomDetail(no) {
        if(no==='202'&&['active','resolved'].includes(state.conflict)) {
          return mergeRoomIssuesPanel(mergeRoomOperationPanel(renderRoomConflict202(),no),no);
        }
        return mergeRoomIssuesPanel(mergeRoomOperationPanel(renderRoomDetailStandard(no),no),no);
      }

        return {task,checked,requiredDone,failed};
      }

-body"><p class="audit-note" style="margin:12px 0 0">청소 결과를 입력하는 동안만 객실의 최종 촛불 수량을 조정할 수 있습니다.</p><div class="candle-stepper" role="group" aria-label="${no}호 청소 결과 촛불 수량"><button class="btn btn-outline" type="button" data-action="task-candle-change" data-room="${no}" data-delta="-1" aria-label="촛불 1개 줄이기" ${!editable||task.candle<1?'disabled':''}>−</button><div class="candle-stepper-value" aria-live="polite"><strong>${task.candle||0}개</strong><span>청소 완료 후 객실 수량</span></div><button class="btn btn-outline" type="button" data-action="task-candle-change" data-room="${no}" data-delta="1" aria-label="촛불 1개 늘리기" ${!editable||task.candle>=9?'disabled':''}>+</button></div></div></details>`}</div>`;
      }

      function selectedDraftBatch(ids=state.selectedDrafts) {
        const raw=Array.isArray(ids)?ids:[], unique=[...new Set(raw)];
        const selected=unique.map(draftId=>state.drafts.find(d=>d.id===draftId));
        const rooms=selected.filter(Boolean).map(d=>d.room);
        let reason='';
        if(!unique.length) reason='전날 배정에서 처리할 준비 작업을 먼저 선택하세요.';
        else if(unique.length!==raw.length||selected.some(d=>!d)) reason='선택 목록이 최신 초안과 일치하지 않습니다.';
        else if(new Set(rooms).size!==rooms.length) reason='같은 객실의 중복 준비 작업은 함께 처리할 수 없습니다.';
        else if(selected.some(d=>!ROOMS.some(room=>room.no===d.room)||!String(d.kind||'').trim()||!String(d.created||'').trim())) reason='객실·청소 유형·생성 시각이 완전한 준비 작업만 처리할 수 있습니다.';
        else if(selected.some(d=>state.publications?.[d.id])) reason='이미 처리된 작업이 선택 목록에 포함되어 있습니다.';
        return {valid:!reason,reason,ids:unique,selected:selected.filter(Boolean),rooms};
      }

        else if(a==='cancel-review'){if(isLocked())toast('최신 상태를 확인하기 전에는 담당 취소 요청을 처리할 수 없습니다.','error');else state.cancelRequest==='requested'?openCancelReview():toast('담당 취소 요청은 이미 처리됐습니다.');}
        else if(a==='confirm-cancel'){
          if(isLocked()){closeModal();render();toast('동기화 상태가 바뀌어 담당 취소 결정을 저장하지 않았습니다.','error');return;}
          const chosen=document.querySelector('input[name="cancel-decision"]:checked')?.value||'deny', no=state.cancelRequestRoom||Object.keys(state.cancelRequests||{})[0]||'202', request=state.cancelRequests?.[no], room=ROOMS.find(item=>item.no===no), maid=request?.maid||room?.assignee||'김민지1';
          state.cancelDecision=chosen;state.cancelRequest='resolved';if(request){request.status=chosen==='deny'?'denied':'approved';request.decision=chosen;request.decidedAt=`${state.selectedDate} ${state.time}`;}
          if(chosen==='republish'){state.jobs[no]='unassigned';if(room)room.assignee='미정';if(state.activeCleaning===no)state.activeCleaning=null;}
          if(chosen==='direct'){state.jobs[no]='claimed';if(room)room.assignee='김민지2';if(state.activeCleaning===no)state.activeCleaning=null;}
          if(chosen==='hold'){state.jobs[no]='hold';if(state.activeCleaning===no)state.activeCleaning=null;}
          appendEvent(`${maid} 담당 취소 요청 처리`,chosen==='deny'?`거절 · ${no}호 담당 유지`:`승인 · ${no}호 ${chosen}`);closeModal();render();focusAfterRender('[data-key="cancel"]');toast('결정과 카드·타임라인을 함께 갱신했습니다.');
        }
        else if(a==='go-today'){state.detail=null;state.adminView='today';render();}
        else if(a==='deactivate-maid')openDeactivate();
        else if(a==='confirm-deactivate'){const choice=document.querySelector('input[name="maid-handling"]:checked')?.value||'finish';state.maidStatus='업로드 전용 · 24시간';state.handoff=choice;appendEvent('김민지1 비활성 처리 시작',choice==='finish'?'현재 작업 마무리 허용':'즉시 중단 · 인계');closeModal();render();toast('신규 업무·새 PIN을 차단하고 인계 상태를 반영했습니다.');}
        else if(a==='start-payment'){if(state.role!=='admin'){toast('지급 상태 변경은 관리자만 할 수 있습니다.','error');return;}showModal({title:'지난주 전액 지급 진행을 선점할까요?',subtitle:'실제 송금은 앱 밖에서 진행합니다.',body:`<div class="info-grid"><div class="info-item"><span>메이드</span><strong>김민지1</strong></div><div class="info-item"><span>전액</span><strong>132,000원 · 데모</strong></div></div><div class="notice notice-warning" style="margin:14px 0 0">PAYING 전환 시 금액·수익 ID·관리자를 잠그고 다른 관리자의 재지급을 막습니다.</div>`,confirmLabel:'지급 진행',confirmAction:'confirm-payment'});}
        else if(a==='confirm-payment'){if(state.role!=='admin'){closeModal();render();toast('지급 상태 변경은 관리자만 할 수 있습니다.','error');return;}state.payment='PAYING';appendEvent('지난주 지급 PAYING 선점','관리자 데모 · 132,000원 잠금');closeModal();render();toast('지급 진행 상태를 선점했습니다.');}
        else if(a==='finish-payment'){if(state.role!=='admin'){toast('지급 상태 변경은 관리자만 할 수 있습니다.','error');return;}state.payment='PAID';appendEvent('외부 송금 완료 기록','삭제 대신 이후 정정·상계 사용');render();toast('PAID 완료 기록을 남겼습니다.');}
        else if(a==='payment-check'){if(state.role!=='admin'){toast('지급 상태 변경은 관리자만 할 수 있습니다.','error');return;}state.payment='CHECK';render();toast('정산 확인 필요 상태를 유지합니다.','error');}
        else if(a==='payment-open'){if(state.role!=='admin'){toast('지급 상태 변경은 관리자만 할 수 있습니다.','error');return;}state.payment='OPEN';appendEvent('지급 OPEN 복귀','외부 송금하지 않음 확인 · 필수 사유 데모');render();toast('송금하지 않음을 확인하고 OPEN으로 복귀했습니다.');}
        else if(a==='rule-complaint')showModal({title:'컴플레인 관리자 판정',subtitle:'반려와 별개인 평가 참고 기록이며 주급을 자동 차감하지 않습니다.',body:`<div class="choice-list"><label class="choice"><input type="radio" name="ruling" checked><span><strong>확인됨</strong><span>선택 벌점 1점 · 평가 참고</span></span></label><label class="choice"><input type="radio" name="ruling"><span><strong>확인 불가</strong><span>근거 부족 기록</span></span></label><label class="choice"><input type="radio" name="ruling"><span><strong>사실 아님</strong><span>판정 근거 기록</span></span></label></div>`,confirmLabel:'판정 알림',confirmAction:'confirm-ruling'});
        else if(a==='confirm-ruling'){state.complaint='ruled';appendEvent('컴플레인 판정','확인됨 · 메이드 응답 대기');closeModal();render();toast('메이드 판정 확인 대기로 전환했습니다.');}
        else if(a==='ack-complaint'){state.complaint='acknowledged';appendEvent('메이드 내용 확인','판정 변경 없음');render();toast('내용 확인을 기록했습니다.');}
        else if(a==='object-complaint')showModal({title:'판정 이의 메모',subtitle:'메이드는 판정·벌점·재청소를 직접 바꿀 수 없습니다.',body:`<div class="field"><label for="objection">이의 메모 · 데모</label><textarea id="objection" class="input-control" rows="4">작업 종료 당시 사진을 다시 확인해 주세요.</textarea></div>`,confirmLabel:'이의 제출',confirmAction:'confirm-objection'});
        else if(a==='confirm-objection'){state.complaint='objected';appendEvent('메이드 이의 제출','관리자 재검토 필요');closeModal();render();toast('관리자 재검토 상태로 전환했습니다.');}
        else if(a==='close-complaint'||a==='correct-complaint'){state.complaint='closed';appendEvent('컴플레인 종결',a==='correct-complaint'?'판정 정정 이벤트 추가':'판정 유지');render();toast('원본을 보존한 채 종결했습니다.');}
        else if(a==='alert-link'){closeModal();openDetail(el.dataset.type,el.dataset.id,el);}
        else if(a==='date-prev'||a==='date-next'){state.selectedDate=a==='date-prev'?'2026-08-13':'2026-08-15';render();toast(`${state.selectedDate} 객실판을 표시합니다.`);}
        else if(a==='date-today'){state.selectedDate='2026-08-14';render();}
        else if(a==='clear-filter'){state.roomFilter='all';state.listMode='data';render();focusAfterRender('[data-control="list-mode"]');}
        else if(a==='retry-network'){state.network='online';state.listMode='loading';render();focusAfterRender();setTimeout(()=>{state.listMode='data';render();focusAfterRender();toast('최신 상태와 권한을 다시 검증했습니다.');},500);}
        else if(a==='view-open-jobs'){state.role='maid';state.maidView='open';render();focusAfterRender();}
        else if(a==='logout'){state.loggedIn=false;state.detail=null;render();requestAnimationFrame(()=>document.querySelector('#login-id')?.focus());}
        else if(a==='login-mode'){const mode=el.dataset.mode;state.loginMode=mode;render();requestAnimationFrame(()=>document.querySelector(`[data-action="login-mode"][data-mode="${mode}"]`)?.focus());}
        else if(a==='notification-permission'){state.notificationsEnabled=true;render();toast('알림 권한 허용 상태를 데모로 전환했습니다.');}
        else if(a==='rates')showModal({title:'객실 타입 단가·예상시간 · 데모',subtitle:'실제 운영값 확정 전 교체 가능한 데이터 상수입니다.',large:true,body:`<div class="rail-list">${Object.values(ROOM_TYPES).map(t=>`<div class="rail-row"><strong>${t.name}</strong><span>${money(t.rate)} · ${t.minutes}분 · 데모</span></div>`).join('')}</div>`});
        else if(a==='template')showModal({title:'청소 템플릿 · 데모',subtitle:'객실 타입 × 퇴실·연박·재청소 조합',body:`<div class="notice notice-info">현재 초안 v4 · 미리보기와 필수 항목 검증 전에는 신규 작업에 사용되지 않습니다.</div><div class="check-list"><div class="check-row">${icon('check')}<span><strong>침대·욕실·바닥·문 잠금</strong><span>체크 4개 · 필수 사진 3개 · 선택 사진 1개</span></span></div></div>`,confirmLabel:state.template==='draft'?'미리보기·게시':'확인',confirmAction:'publish-template'});
        else if(a==='publish-template'){state.template='published v4';appendEvent('청소 템플릿 v4 게시','새 작업부터 적용 · 기존 작업 불변');closeModal();render();toast('새 버전을 게시했습니다.');}
        else if(a==='audit-log')showModal({title:'최근 감사 이력 · 데모',subtitle:'PIN 원문·로그인 비밀번호·휴대폰 원문은 기록하지 않습니다.',large:true,body:`<ol class="timeline">${state.events.map(e=>`<li><strong>${esc(e.title)}</strong><span>${esc(e.time)} · ${esc(e.detail)}</span></li>`).join('')}</ol>`});
        else if(a==='demo-info')toast('실제 서버 기능이 아닌 화면 구조 데모입니다.');
        else if(a==='request-cancel')toast('담당 취소 요청을 모든 관리자 오늘 큐에 등록했습니다.');
      });

      document.addEventListener('change', e => {
        const c=e.target.dataset.control; if(!c) return;
        if(c==='role'){state.role=e.target.value;state.detail=null;render();requestAnimationFrame(()=>document.querySelector('[data-control="role"]')?.focus());}
        else if(c==='time'){state.time=e.target.value;render();requestAnimationFrame(()=>document.querySelector('[data-control="time"]')?.focus());toast(`${state.time} 한국시간으로 시뮬레이션합니다.`);}
        else if(c==='network'){state.network=e.target.value;if(state.network!=='online')state.listMode='stale';else if(state.listMode==='stale')state.listMode='data';render();requestAnimationFrame(()=>document.querySelector('[data-control="network"]')?.focus());}
        else if(c==='scenario'){state=makeScenario(Number(e.target.value));render();requestAnimationFrame(()=>document.querySelector('[data-control="scenario"]')?.focus());toast(`${state.scenario}번 시나리오를 불러왔습니다.`);}
        else if(c==='room-filter'){state.roomFilter=e.target.value;render();requestAnimationFrame(()=>document.querySelector('[data-control="room-filter"]')?.focus());}
        else if(c==='draft'){const value=e.target.value;state.selectedDrafts=e.target.checked?[...state.selectedDrafts,value]:state.selectedDrafts.filter(v=>v!==value);render();requestAnimationFrame(()=>document.querySelector(`[data-control="draft"][value="${value}"]`)?.focus());}
        else if(c==='checklist'){const value=e.target.value;state.checklist[value]=e.target.checked;render();requestAnimationFrame(()=>document.querySelector(`[data-control="checklist"][value="${value}"]`)?.focus());}
        else if(c==='conflict-step'){state.conflictSteps[e.target.value]=e.target.checked;}
        else if(c==='list-mode'){state.listMode=e.target.value;if(state.listMode==='stale')state.network='stale';else if(state.network==='stale')state.network='online';render();requestAnimationFrame(()=>document.querySelector('[data-control="list-mode"]')?.focus());}
      });

      document.addEventListener('submit', e => {
        if(e.target.id==='login-form'){e.preventDefault();state.loggedIn=true;state.loginMode='normal';render();toast('데모 역할 화면으로 로그인했습니다.');}
      });

      document.addEventListener('keydown', e => {
        const modal=document.querySelector('.modal');
        if(!modal) return;
        if(e.key==='Escape'){e.preventDefault();dismissModal();return;}
        if(e.key==='Tab'){
          const focusable=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')];
          if(!focusable.length)return;
          const first=focusable[0],last=focusable[focusable.length-1];
          if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
          else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
        }
      });

      function applyHashParameters(params) {
        if(!params.has('scenario'))return false;
        state=makeScenario(Number(params.get('scenario'))||0);
        if(['admin','maid'].includes(params.get('role')))state.role=params.get('role');
        if(state.detail&&!detailAllowedForRole(state.detail.type,state.role))state.detail=null;
        if(state.role==='admin'&&adminNav.some(n=>n.id===params.get('view')))state.adminView=params.get('view');
        if(state.role==='maid'&&maidNav.some(n=>n.id===params.get('view')))state.maidView=params.get('view');
        if(/^2026-08-(0[1-9]|[12]\d|3[01])$/.test(params.get('date')||'')){state.selectedDate=params.get('date');state.calendarMonth=state.selectedDate.slice(0,7);}
        if(['all','available','blocked','cleaning','occupied','candle','early','late'].includes(params.get('filter')))state.roomFilter=params.get('filter');
        if(['all',...Object.keys(ROOM_TYPES)].includes(params.get('type')))state.roomTypeFilter=params.get('type');
        if(['all',...Object.keys(ROOM_TYPES)].includes(params.get('assignmentType')))state.assignmentTypeFilter=params.get('assignmentType');
        if(/^\d{0,6}$/.test(params.get('q')||''))state.roomSearch=params.get('q')||'';
        const detailValue=params.get('detail');
        if(detailValue){state.detail=null;const separator=detailValue.indexOf(':'),type=separator>0?detailValue.slice(0,separator):'',id=separator>0?detailValue.slice(separator+1):'';if(detailAllowedForRole(type,state.role)&&id)state.detail={type,id,...(params.get('mode')?{mode:params.get('mode')}:{})};}
        return true;
      }
      const initialParams=new URLSearchParams(location.hash.slice(1));applyHashParameters(initialParams);
      const initialHistoryEntry=isWireframeHistory(history.state)?history.state:null;
      if(initialHistoryEntry)applyHistoryRoute(initialHistoryEntry.route);
      if(Array.isArray(history.state?.completedModalSessions))completedModalSessions.push(...history.state.completedModalSessions.filter(session=>typeof session?.modalSessionId==='string'&&session.route));
      window.addEventListener('pagehide',()=>clearAllPinModalSecrets());
      document.addEventListener('visibilitychange',()=>{if(document.hidden)maskPin();});
      window.addEventListener('popstate',handleHistoryNavigation);
      window.addEventListener('hashchange',()=>{
        if(isWireframeHistory(history.state))return;
        const params=new URLSearchParams(location.hash.slice(1));if(!applyHashParameters(params))return;
        rawCloseModal();restoringHistory=true;render();restoringHistory=false;writePageHistory(historyRouteSnapshot(),'replace');
      });
      if(initialHistoryEntry){restoringHistory=true;render();restoringHistory=false;if(initialHistoryEntry.layer==='modal')restoreModalHistory(initialHistoryEntry);}
      else render();
    })();
  </script>
</body>
</html>
