<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317314a'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial' font-size='24' font-weight='700' fill='white'%3ECA%3C/text%3E%3C/svg%3E">
  <title>CASTLE THE ART 객실관리 · 데모 와이어프레임</title>
  <style>
    :root {
      --canvas: #f4f7fa;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --ink: #142437;
      --muted: #607085;
      --subtle: #7d8998;
      --line: #dbe3eb;
      --line-strong: #c7d2de;
      --navy: #17314a;
      --navy-2: #244965;
      --green: #167a5a;
      --green-soft: #e9f7f1;
      --amber: #a95f00;
      --amber-soft: #fff5e4;
      --red: #cf3340;
      --red-soft: #fff0f1;
      --blue: #286ca8;
      --blue-soft: #edf6ff;
      --shadow: 0 12px 30px rgba(20, 36, 55, .08);
      --radius: 14px;
      --sidebar: 228px;
      --topbar: 72px;
      --bottom-nav: 74px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--canvas); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--canvas);
      font-family: Pretendard, Inter, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, select, input[type="checkbox"], input[type="radio"] { cursor: pointer; }
    button:disabled, select:disabled, input:disabled { cursor: not-allowed; opacity: .52; }
    a { color: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 4px; font-size: clamp(1.45rem, 2.2vw, 1.85rem); line-height: 1.22; letter-spacing: -.03em; }
    h2 { margin-bottom: 12px; font-size: 1.12rem; line-height: 1.35; letter-spacing: -.015em; }
    h3 { margin-bottom: 8px; font-size: .98rem; line-height: 1.4; }
    svg { display: block; }
    .sr-only {
      position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important;
      margin: -1px !important; overflow: hidden !important; clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important; border: 0 !important;
    }
    .skip-link { position: fixed; left: 12px; top: -120px; z-index: 1000; min-height:44px; padding: 10px 14px; display:flex; align-items:center; background: var(--navy); color: #fff; border-radius: 8px; white-space: nowrap; }
    .skip-link:focus { top: 12px; }
    :focus-visible { outline: 3px solid #60a5fa; outline-offset: 2px; }
    #main-content:focus-visible { outline: none; }

    .icon { width: 20px; height: 20px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 16px; height: 16px; }
    .icon-lg { width: 24px; height: 24px; }
    .btn, .icon-btn, .nav-btn, .bottom-nav button, .segmented button {
      border: 1px solid transparent;
      background: transparent;
      min-height: 44px;
      border-radius: 10px;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
    }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; font-size: 14px; font-weight: 750; white-space: nowrap; }
    .btn:hover:not(:disabled), .icon-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn-primary { color: #fff; background: var(--navy); border-color: var(--navy); }
    .btn-primary:hover:not(:disabled) { background: var(--navy-2); }
    .btn-success { color: #fff; background: var(--green); border-color: var(--green); }
    .btn-danger { color: #fff; background: var(--red); border-color: var(--red); }
    .btn-outline { color: var(--navy); background: #fff; border-color: var(--line-strong); }
    .btn-ghost { color: var(--muted); background: transparent; border-color: transparent; }
    .btn-soft { color: var(--navy); background: #eef3f7; border-color: #eef3f7; }
    .btn-block { width: 100%; }
    .icon-btn { position: relative; display: inline-grid; place-items: center; width: 44px; min-width: 44px; padding: 0; color: var(--navy); background: #fff; border-color: var(--line); }
    .count-dot { position: absolute; top: -4px; right: -3px; display: grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border: 2px solid #fff; border-radius: 999px; color: #fff; background: var(--red); font-size: 10px; font-weight: 800; }

    .demo-strip { position: sticky; top: 0; z-index: 70; color: #fff; background: #10283d; box-shadow: 0 1px 0 rgba(255,255,255,.1); }
    .demo-strip-inner { display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 6px clamp(12px, 2vw, 28px); }
    .demo-label { display: flex; align-items: center; gap: 8px; min-width: max-content; font-size: 13px; font-weight: 800; letter-spacing: .01em; }
    .demo-label .signal { width: 8px; height: 8px; border-radius: 50%; background: #f5bc54; box-shadow: 0 0 0 4px rgba(245,188,84,.15); }
    .demo-toggle { display: inline-grid; place-items: center; margin-left: auto; color: #fff; border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.08); }
    .demo-controls { display: none; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .demo-strip.open .demo-controls { display: flex; }
    .demo-field { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .demo-field label { color: #afbfcd; font-size: 12px; white-space: nowrap; }
    .demo-field select { height: 44px; max-width: 190px; min-width: 96px; padding: 0 30px 0 10px; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; color: #fff; background: #19364f; }
    .demo-field.scenario { flex: 1; }
    .demo-field.scenario select { width: 100%; max-width: 360px; }
    .demo-reset { margin-left: auto; color: #fff; border-color: rgba(255,255,255,.25); }

    .app-shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: calc(100vh - 50px); }
    .sidebar { position: sticky; top: 50px; align-self: start; height: calc(100vh - 50px); padding: 22px 16px; background: #fff; border-right: 1px solid var(--line); overflow-y: auto; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 2px 6px 24px; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; color: #fff; background: linear-gradient(145deg, #9d7224, #c79b45); font-family: Georgia, serif; font-weight: 800; }
    .brand-name { font-size: 12px; font-weight: 900; letter-spacing: .11em; line-height: 1.2; }
    .brand-sub { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .identity { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-soft); }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #fff; background: var(--navy); font-weight: 800; }
    .identity strong { display: block; font-size: 13px; }
    .identity span { display: block; color: var(--muted); font-size: 12px; }
    .side-nav { display: grid; gap: 5px; }
    .nav-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; color: var(--muted); font-size: 14px; font-weight: 750; text-align: left; }
    .nav-btn:hover { color: var(--navy); background: #f2f6f9; }
    .nav-btn[aria-current="page"] { color: #fff; background: var(--navy); box-shadow: 0 8px 18px rgba(23,49,74,.15); }
    .side-foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }

    .workspace { min-width: 0; }
    .topbar { position: sticky; top: 50px; z-index: 50; display: flex; align-items: center; gap: 16px; min-height: var(--topbar); padding: 12px clamp(16px, 2.4vw, 32px); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); backdrop-filter: blur(12px); }
    .topbar-title { min-width: 0; flex: 1; }
    .topbar-title p { margin: 0; color: var(--muted); font-size: 12px; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    main { width: 100%; max-width: 1600px; margin: 0 auto; padding: clamp(16px, 2vw, 30px); }
    .bottom-nav { display: none; }

    .scenario-coach { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; padding: 13px 15px; border: 1px solid #cfe0ef; border-radius: 12px; background: #f0f7fd; }
    .scenario-coach .step { display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; color: #fff; background: var(--blue); font-size: 12px; font-weight: 900; }
    .scenario-coach strong { display: block; margin-bottom: 2px; font-size: 13px; }
    .scenario-coach p { margin: 0; color: #47627a; font-size: 13px; }
    .scenario-coach .btn { margin-left: auto; }

    .notice { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--muted); font-size: 13px; }
    .notice strong { color: var(--ink); }
    .notice-danger { border-color: #f1b7bc; background: var(--red-soft); color: #8c2730; }
    .notice-warning { border-color: #efd5a8; background: var(--amber-soft); color: #775021; }
    .notice-success { border-color: #b9dfcf; background: var(--green-soft); color: #17644d; }
    .notice-info { border-color: #c9ddec; background: var(--blue-soft); color: #345f80; }

    .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { margin: 0; }
    .section-head .meta { color: var(--muted); font-size: 12px; }
    .section-head .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: 0 1px 1px rgba(20,36,55,.02); }
    .card-pad { padding: 16px; }
    .queue-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
    .queue-card { position: relative; display: flex; flex-direction: column; min-height: 176px; padding: 15px; overflow: hidden; }
    .queue-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--line-strong); }
    .queue-card.danger::before { background: var(--red); }
    .queue-card.warning::before { background: var(--amber); }
    .queue-card.success::before { background: var(--green); }
    .queue-card h3 { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
    .queue-card .count { margin-bottom: 8px; font-size: 1.45rem; line-height: 1; font-weight: 900; letter-spacing: -.03em; }
    .queue-card p { margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    .queue-card .btn { margin-top: auto; }
    .badge { display: inline-flex; align-items: center; gap: 5px; width: max-content; max-width: 100%; min-height: 26px; padding: 3px 8px; border-radius: 7px; font-size: 12px; font-weight: 800; line-height: 1.2; }
    .badge-red { color: #a3212d; background: var(--red-soft); border: 1px solid #f5c2c6; }
    .badge-amber { color: #8b5107; background: var(--amber-soft); border: 1px solid #f0d4a8; }
    .badge-green { color: #17674e; background: var(--green-soft); border: 1px solid #bfe1d2; }
    .badge-blue { color: #245f91; background: var(--blue-soft); border: 1px solid #c9e1f4; }
    .badge-neutral { color: #526174; background: #f1f4f7; border: 1px solid #dce3ea; }

    .dashboard-layout { display: grid; grid-template-columns: minmax(0, 1fr) 286px; gap: 16px; align-items: start; }
    .rail { display: grid; gap: 12px; }
    .rail .card { padding: 14px; }
    .rail-list { display: grid; gap: 8px; margin: 10px 0 12px; }
    .rail-row { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 7px 8px; border-radius: 8px; background: var(--surface-soft); font-size: 12px; }
    .rail-row strong { margin-right: auto; }
    .rail-row input { width: 18px; height: 18px; }
    .reservation-schedule { display:grid; gap:10px; }
    .reservation-schedule-window { overflow:hidden; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .reservation-week-nav { display:grid; grid-template-columns:44px minmax(0,1fr) 44px; align-items:center; gap:8px; padding:10px; border-bottom:1px solid var(--line); background:#f7f9fb; }
    .reservation-week-nav .icon-btn { width:44px; min-width:44px; height:44px; }
    .reservation-week-range { display:flex; align-items:center; justify-content:center; gap:8px; min-width:0; min-height:44px; padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-size:14px; font-weight:850; text-align:center; }
    .reservation-week-range span { color:var(--muted); font-size:12px; white-space:nowrap; }
    .reservation-week-note { display:flex; align-items:center; gap:7px; margin:0; padding:10px 12px; border-bottom:1px solid var(--line); color:#6d5425; background:var(--amber-soft); font-size:12px; font-weight:750; }
    .reservation-schedule .rail-list { gap:7px; margin:0; padding:10px; }
    .reservation-schedule .rail-row { min-height:56px; padding:10px 12px; border:1px solid #d9e1e8; background:var(--surface-soft); font-size:14px; text-align:left; }
    .reservation-schedule .rail-row[aria-current="true"] { border-color:#69a2d0; box-shadow:0 0 0 2px rgba(44,119,174,.12); background:#f1f7fc; }
    .reservation-schedule .rail-row > span { display:inline-flex; align-items:center; gap:5px; margin-left:auto; color:var(--muted); font-size:12px; }
    .reservation-schedule .reservation-history-row { cursor:default; }
    .reservation-schedule-empty { margin:0; padding:14px 12px; color:var(--muted); font-size:13px; }

    .date-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .date-current { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); font-weight: 800; }
    .select-control, .input-control, textarea.input-control { min-height: 44px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; }
    .select-control { padding-right: 32px; }
    .date-tools .filter-wrap { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .room-table { overflow: hidden; }
    .room-head, .room-row { display: grid; grid-template-columns: 56px minmax(145px, 1.35fr) 118px minmax(150px, 1.2fr) 128px 118px; gap: 8px; align-items: center; }
    .room-head { padding: 10px 14px; color: var(--muted); background: var(--surface-soft); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .room-row { min-height: 74px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .room-row:last-child { border-bottom: 0; }
    .room-row:hover { background: #fbfdff; }
    .room-no { font-size: 16px; font-weight: 900; }
    .room-type { min-width: 0; }
    .room-type strong { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 13px; }
    .room-type span, .cell-sub { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .status-cell { min-width: 0; }
    .status-cell p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .row-action .btn { width: 100%; }

    .job-list { display: grid; gap: 13px; }
    .job-card { padding: 16px; }
    .job-card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .job-card-top .availability { margin-left: auto; }
    .job-title { min-width: 0; flex: 1; }
    .job-title h3 { margin: 0 0 2px; font-size: 1.07rem; }
    .job-title p { display: -webkit-box; margin: 0; overflow: hidden; color: var(--muted); font-size: 14px; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .job-meta { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin: 12px 0; }
    .job-meta > div { padding: 10px; border-radius: 9px; background: var(--surface-soft); }
    .job-meta span { display: block; color: var(--muted); font-size: 12px; }
    .job-meta strong { display: block; margin-top: 2px; font-size: 14px; }
    .schedule-line { display: flex; gap: 8px; margin-bottom: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; color: #34485e; background: #fff; font-size: 13px; }
    .job-actions { display: flex; gap: 8px; }
    .job-actions > .btn { min-width: 0; flex: 1 1 0; }
    .summary-strip { display: flex; gap: 16px; margin-bottom: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .summary-strip span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
    .summary-strip strong { color: var(--ink); }

    .detail-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .detail-head .btn { flex: 0 0 auto; }
    .detail-title { min-width: 0; flex: 1; }
    .detail-title h2 { margin: 0 0 4px; font-size: 1.35rem; }
    .detail-title p { margin: 0; color: var(--muted); font-size: 13px; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); gap: 16px; align-items: start; }
    .detail-stack { display: grid; min-width: 0; gap: 14px; }
    .detail-stack > * { min-width: 0; }
    .info-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .info-item { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-soft); }
    .info-item span { display: block; color: var(--muted); font-size: 12px; }
    .info-item strong { display: block; margin-top: 3px; overflow-wrap: anywhere; font-size: 14px; }
    .timeline { position: relative; display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .timeline li { position: relative; padding: 0 0 18px 28px; }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline li::before { content: ""; position: absolute; left: 7px; top: 7px; bottom: -7px; width: 2px; background: var(--line); }
    .timeline li:last-child::before { display: none; }
    .timeline li::after { content: ""; position: absolute; left: 2px; top: 4px; width: 10px; height: 10px; border: 2px solid #fff; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 2px #bfdbef; }
    .timeline strong { display: block; font-size: 13px; }
    .timeline span { display: block; color: var(--muted); font-size: 12px; }
    .check-list { display: grid; gap: 8px; }
    .check-row { display: flex; align-items: flex-start; gap: 10px; min-height: 48px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; }
    .check-row input { width: 20px; height: 20px; margin-top: 1px; flex: 0 0 auto; }
    .check-row strong { display: block; font-size: 14px; }
    .check-row span { display: block; color: var(--muted); font-size: 12px; }
    .upload-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .upload-tile { min-height: 92px; padding: 12px; border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--surface-soft); }
    .upload-tile.failed { border-color: #ee9ba2; background: var(--red-soft); }
    .upload-tile.done { border-style: solid; border-color: #a7d6c3; background: var(--green-soft); }
    .upload-tile strong { display: block; margin-bottom: 3px; font-size: 13px; }
    .upload-tile span { color: var(--muted); font-size: 12px; }
    .upload-tile .btn { margin-top: 8px; }
    .photo-template-banner { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:start; margin:12px 0; padding:12px; border:1px solid #bfd7e7; border-radius:11px; background:#f2f8fc; }
    .photo-template-banner strong { display:block; color:var(--navy); font-size:14px; }
    .photo-template-banner span { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    .photo-template-banner .badge-row { justify-content:flex-end; }
    .photo-slot-zone { display:inline-flex; align-items:center; min-height:24px; margin-bottom:7px; padding:2px 7px; border-radius:999px; color:#315d83; background:#e4f0f7; font-size:11px; font-weight:850; }
    .photo-slot-description { display:block; min-height:32px; margin-top:5px; line-height:1.4; }
    .photo-slot-guide { display:block; margin-top:7px; color:#7a5a2d !important; font-size:11px !important; }
    .task-zone-progress { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:12px 0; }
    .task-zone-progress > div { min-width:0; min-height:66px; padding:10px 12px; border:1px solid #c7dceb; border-radius:11px; background:#f4f9fc; }
    .task-zone-progress span { display:block; color:var(--muted); font-size:11px; font-weight:750; }
    .task-zone-progress strong { display:block; margin-top:4px; color:var(--navy); font-size:16px; font-variant-numeric:tabular-nums; }
    .task-zone-safety { display:flex; align-items:flex-start; gap:9px; margin:0 0 12px; padding:11px 12px; border:1px solid #ead6ad; border-radius:11px; color:#765018; background:#fff9ec; font-size:12px; line-height:1.45; }
    .task-zone-safety .icon { margin-top:1px; flex:0 0 auto; }
    .task-zone-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .task-zone-card { min-width:0; padding:12px; border:1px solid var(--line); border-radius:13px; background:#fff; box-shadow:0 2px 7px rgba(26,52,78,.04); }

          if (state.adminView==='rooms') return renderRooms();
          if (state.adminView==='maids') return renderMaids();
          return renderAdminMore();
        }
        if (state.maidView==='schedule') return renderMaidSchedule();
        if (state.maidView==='my') return renderMaidMy();
        if (state.maidView==='done') return renderMaidDone();
        if (state.maidView==='pay') return renderMaidPay();
        return renderMaidMore();
      }

      function renderCoach() {
        if (state.role==='admin'||state.scenario===0) return '';
        const cfg=SCENARIOS[state.scenario];
        return `<aside class="scenario-coach"><span class="step">${state.scenario}</span><div><strong>${esc(cfg.title)}</strong><p>${esc(cfg.next)}</p></div>${button('시나리오 재설정','reset','outline')}</aside>`;
      }

      function renderNetworkNotice() {
        if (state.network==='online' && state.listMode!=='stale') return '';
        return `<div class="notice notice-danger">${icon('sync')}<div><strong>${state.network==='offline'?'오프라인 · 읽기 전용':'오래된 데이터 · 변경할 수 없음'}</strong><br>마지막 연결 09:48. 인터넷에 연결한 뒤 다시 시도하세요.</div>${button('다시 시도','retry-network','outline')}</div>`;
      }

      function renderListState(content, kind='queue') {
        if (state.listMode==='loading') return `<section class="card" aria-busy="true" aria-label="불러오는 중"><div class="skeleton-list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section>`;
        if (state.listMode==='empty') return `<section class="card state-panel"><div class="state-icon">${icon('check','icon-lg')}</div><h2>표시할 항목이 없습니다</h2><p>현재 선택한 날짜에 실제 운영 항목이 0건입니다.</p></section>`;
        if (state.listMode==='filterEmpty') return `<section class="card state-panel"><div class="state-icon">${icon('filter','icon-lg')}</div><h2>필터 결과가 없습니다</h2><p>데이터는 있지만 현재 필터와 일치하는 항목이 없습니다.</p>${button('필터 초기화','clear-filter','outline')}</section>`;
        return content;
      }

      function legacyRoomPresentation(no) {
        const job=state.jobs[no], candles=state.candles[no]||0;
        if (no==='350') {
          if (state.jobs['350']==='approved' && candles===0) {
            if (timeMinutes(state.time)>=timeMinutes('16:00')) return {tone:'neutral',status:'예약상 투숙 중',reason:'입실 시각 후 차단 해소 · 전이 1회 기록',action:'상세 보기',act:'room-detail'};
            return {tone:'green',status:'입실 준비 완료',reason:'검수 승인 · 촛불 0 · 차단 없음',action:'상세 보기',act:'room-detail'};
          }
          return {tone:'red',status:'입실 차단',reason:`${state.jobs['350']==='approved'?'검수 승인':'미검수'} · 촛불 ${candles}개`,action:'입실 차단 해결',act:'room-detail'};
        }
        if (no==='332') return state.conflict==='active'?{tone:'red',status:'출입 충돌',reason:'레이트 체크아웃 · PIN 조회 후 일정 변경',action:'영향 확인',act:'room-detail'}:{tone:'amber',status:'청소 중',reason:'김민지1 수행 중',action:'상세 보기',act:'cleaning-detail'};
        if (no==='528') return {tone:'amber',status:job==='inspection'?'검수 대기':'업로드 대기',reason:job==='inspection'?'전체 제출 완료':'현장 완료 · 사진 1건 미전송',action:job==='inspection'?'검수':'미전송 보기',act:'cleaning-detail'};
        if (no==='536') return {tone:'green',status:'입실 준비 완료',reason:'검수 승인 · 촛불 0 · 차단 없음',action:'상세 보기',act:'room-detail'};
        if (no==='639') return state.inspection.status==='approved'?{tone:'green',status:'입실 준비 완료',reason:'전체 승인 · 촛불 0',action:'결과 보기',act:'cleaning-detail'}:{tone:'amber',status:state.inspection.status==='rejected'?'재청소 배정':'검수 대기',reason:state.inspection.status==='rejected'?'기존 메이드 기본 담당':'전체 제출 v2',action:state.inspection.status==='rejected'?'재청소 보기':'검수',act:'cleaning-detail'};
        if (no==='142') return {tone:'neutral',status:'예약상 투숙 중',reason:state.stayoverCreated?'연박 청소 배정 준비 작업 생성':'연박 청소 요청',action:state.stayoverCreated?'작업 보기':'연박 청소 생성',act:'room-detail'};
        return {tone:'neutral',status:state.reservationSaved?'미래 예약 · 초안 생성':'미래 예약',reason:'내일 16:00 입실 예정',action:'상세 보기',act:'room-detail'};
      }

      function renderRoomRows() {
        const rows=ROOMS.filter(r => state.roomFilter==='all' || (state.roomFilter==='inspection' && ['528','639'].includes(r.no)) || (state.roomFilter==='blocked' && ['350','332'].includes(r.no)));
        return rows.map(r=>{
          const p=legacyRoomPresentation(r.no), type=ROOM_TYPES[r.type];
          return `<article class="room-row" data-room="${r.no}">
            <div class="room-no">${r.no}</div>
            <div class="room-type"><strong>${esc(type.name)}</strong><span>${money(type.rate)} · 8월 시트 · 예상 ${type.minutes}분(데모)</span></div>
            <div class="status-cell">${statusBadge(p.status,p.tone,p.tone==='red'?'alert':p.tone==='green'?'check':'clock')}<p>${esc(p.reason)}</p></div>
            <div class="schedule-cell"><strong>체크인 ${esc(r.checkin)} → 체크아웃 ${esc(r.checkout)}</strong><span class="cell-sub">한 고객 예약 · 담당 ${esc(r.assignee)}</span></div>
            <div><strong>${r.no==='142'?'연박 요청':r.no==='211'?'예정':'준비 마감 '+(r.no==='350'?'15:30':'14:30')}</strong><span class="cell-sub">${state.selectedDate} · KST</span></div>
            <div class="row-action"><button class="btn ${p.tone==='red'?'btn-danger':'btn-outline'}" type="button" data-action="${p.act}" data-id="${r.no}" ${isLocked()&&p.act!=='room-detail'?'disabled':''}>${esc(p.action)}</button></div>
          </article>`;
        }).join('');
      }

      function renderRoomTable() {
        return `<section class="card room-table" aria-label="객실 일별 현황">
          <div class="room-head"><div>객실</div><div>객실 유형</div><div>상태</div><div>일정·담당</div><div>마감</div><div>주 행동</div></div>
          ${renderRoomRows()}
        </section>`;
      }

      function renderDateTools() {
        return `<div class="date-tools">
          <button class="icon-btn" type="button" data-action="date-prev" aria-label="이전 날짜">${icon('chevronLeft')}</button>
          <div class="date-current">${icon('calendar','icon-sm')}<span>${state.selectedDate==='2026-08-14'?'2026.08.14 · 오늘':state.selectedDate.replaceAll('-','.')} </span></div>
          <button class="icon-btn" type="button" data-action="date-next" aria-label="다음 날짜">${icon('chevronRight')}</button>
          ${button('오늘','date-today','outline')}
          <div class="filter-wrap"><label for="room-filter">필터</label><select id="room-filter" class="select-control" data-control="room-filter"><option value="all" ${state.roomFilter==='all'?'selected':''}>전체 객실</option><option value="blocked" ${state.roomFilter==='blocked'?'selected':''}>입실 차단·충돌</option><option value="inspection" ${state.roomFilter==='inspection'?'selected':''}>검수·업로드</option></select></div>
        </div>`;
      }

      function queueCard(tone,badge,title,count,desc,action,label,id='') {
        return `<article class="card queue-card ${tone}">${statusBadge(badge,tone==='danger'?'red':tone==='warning'?'amber':tone==='success'?'green':'neutral')}<h3>${title}</h3><div class="count">${count}</div><p>${desc}</p><button class="btn ${tone==='danger'?'btn-danger':'btn-outline'}" type="button" data-action="${action}" ${id?`data-id="${id}"`:''} ${isLocked()&&action!=='room-detail'?'disabled':''}>${label}</button></article>`;
      }

      function renderAdminToday() {
        const content=`
          <section class="section-head"><h2>즉시 조치 큐</h2><span class="meta">색상은 원본 상태에서 파생 · 우선순위는 마감 여유로 계산</span></section>
          <div class="queue-grid">
            ${queueCard('danger','긴급','350호 입실 미준비','1건','미검수 · 촛불 1개','room-detail','입실 차단 해결','350')}
            ${queueCard('warning','대기','관리자 미배정 작업','3건','시작 가능 시각이 지나 재배정이 필요한 작업','view-open-jobs','목록 보기')}
            ${queueCard('warning','주의','마감 위험','2건','예상 소요시간 반영 시 여유 부족','view-open-jobs','목록 보기')}
            ${queueCard('success','대기','검수 대기','4건','전체 제출 검수가 필요합니다','cleaning-detail','639호 검수','639')}
            ${queueCard('neutral','요청','담당 취소 요청','1건',state.cancelRequest==='requested'?'15분 이내 관리자 결정 필요':'처리 완료 · 타임라인 보존','cancel-review',state.cancelRequest==='requested'?'요청 처리':'결과 보기')}
            ${queueCard('neutral','동기화','동기화·PIN·정산','2건','충돌 또는 확인 필요 사건','alerts','알림 보기')}
          </div>
          <div class="dashboard-layout">
            <div><div class="section-head"><h2>객실 일별 현황</h2><span class="meta">총 7개 · 한국시간</span></div>${renderDateTools()}${renderRoomTable()}</div>
            <aside class="rail" aria-label="보조 운영 큐">${renderDraftRail()}${renderInspectionRail()}${renderPayRail()}</aside>
          </div>`;
        return renderCoach()+renderNetworkNotice()+renderScenario13Controls()+renderListState(content);
      }

      function renderScenario13Controls() {
        if (state.scenario!==13) return '';
        return `<section class="notice notice-info"><div style="flex:1"><strong>목록 상태 계약 데모</strong><br>상태를 바꾸면 정상 데이터·위험 행동 잠금 여부가 함께 변합니다.</div><label for="list-mode" class="sr-only">목록 상태</label><select id="list-mode" class="select-control" data-control="list-mode"><option value="loading" ${state.listMode==='loading'?'selected':''}>불러오는 중</option><option value="empty" ${state.listMode==='empty'?'selected':''}>진짜 0건</option><option value="filterEmpty" ${state.listMode==='filterEmpty'?'selected':''}>필터 결과 없음</option><option value="data" ${state.listMode==='data'?'selected':''}>데이터 있음</option><option value="stale" ${state.listMode==='stale'?'selected':''}>오래된 데이터·오류</option></select></section>`;
      }

      function renderDraftRail() {
        return `<section class="card"><div class="section-head"><h3>배정 준비 청소 작업</h3><span class="meta">${state.drafts.length}건</span></div><p class="cell-sub">근무일 전날 관리자 담당 배정을 기다립니다.</p><div class="rail-list">${state.drafts.length?state.drafts.map(d=>`<label class="rail-row"><input type="checkbox" data-control="draft" value="${d.id}" ${state.selectedDrafts.includes(d.id)?'checked':''} ${isLocked()?'disabled':''}><strong>${d.room}호 · ${d.kind}</strong><span>${d.created}</span></label>`).join(''):'<div class="state-panel" style="padding:12px"><p>배정 준비 작업 0건</p></div>'}</div>${button('전날 배정에서 보기','publish-selected','success',`${isLocked()?'disabled':''}`)}</section>`;
      }
      function renderInspectionRail() { return `<section class="card"><div class="section-head"><h3>검수 대기</h3><span class="meta">4건</span></div><div class="rail-list"><div class="rail-row"><strong>639호 · 전체 제출 v2</strong><span>10:18</span></div><div class="rail-row"><strong>528호 · 업로드 완료</strong><span>10:14</span></div></div>${button('검수 목록 보기','cleaning-detail','outline','data-id="639"')}</section>`; }
      function renderPayRail() { const summary=paymentWeekSummaryFor();return `<section class="card"><div class="section-head"><h3>지난주 지급</h3>${statusBadge(summary.label,summary.tone)}</div><p class="cell-sub">메이드별 외부 전액 송금 완료를 각각 기록합니다. 앱은 송금하지 않습니다.</p>${button('지급 주차 상세','pay-detail','outline')}</section>`; }

      function renderRooms() {
        return renderCoach()+renderNetworkNotice()+`<div class="section-head"><div><h2>객실 일별 현황</h2><span class="meta">과거는 읽기 전용, 미래는 확정 계획만 표시</span></div><div class="actions">${button('예약 등록','new-reservation','primary',isLocked()?'disabled':'')}</div></div>${renderDateTools()}${renderListState(renderRoomTable())}`;
      }

      function renderMaids() {
        const cards=MAIDS.map(m=>`<article class="card setting-card"><div class="avatar">${m.name[0]}</div><div style="min-width:0;flex:1"><h3>${m.name} · 데모</h3><p>${m.phone} · 관리자 배정 ${m.assigned}건<br>${m.id==='m1'&&state.maidStatus!=='active'?state.maidStatus:m.active}</p>${button('상세 보기','maid-detail','outline',`data-id="${m.id}"`)}</div></article>`).join('');
        return renderCoach()+renderNetworkNotice()+`<div class="section-head"><div><h2>메이드 계정·업무 현황</h2><span class="meta">담당·실제 수행·제출·수익 귀속을 분리해 보존</span></div><div class="actions">${button('계정 추가','demo-info','primary')}</div></div><div class="settings-grid">${cards}</div>`;
      }

      function renderAdminMore() {
        return renderCoach()+renderNetworkNotice()+`<div class="settings-grid">
          ${settingCard('wallet','주급·지급',`지난주 상태 ${paymentWeekSummaryFor().label} · 메이드별 외부 송금 기록`,button('지급 상세','pay-detail','outline'))}
          ${settingCard('settings','객실 타입 청소요금·예상시간','청소요금은 8월 시트 정본 · 예상시간은 데모',button('청소요금 보기','rates','outline'))}
          ${settingCard('list','청소 템플릿',`초안·미리보기·게시 버전 · 현재 ${state.template}`,button('템플릿 관리','template','outline'))}
          ${settingCard('bell','알림 상태',state.notificationsEnabled?'이 기기 알림 허용 데모':'권한 요청 전 · 앱 내부 알림 사용',button(state.notificationsEnabled?'상태 보기':'알림 켜기','notification-permission','outline'))}
          ${settingCard('shield','감사 이력','PIN 조회 사실·검수·단가·지급 수행자 기록',button('최근 이력 보기','audit-log','outline'))}
          ${settingCard('lock','로그인·보안 상태','최초 변경·5회 실패·15분 잠금 데모',button('로그인 상태 보기','logout','outline'))}
        </div>`;
      }

      function settingCard(iconName,title,desc,action) { return `<article class="card setting-card"><div class="setting-icon">${icon(iconName)}</div><div style="min-width:0;flex:1"><h3>${title}</h3><p>${desc}</p>${action}</div></article>`; }

      function publicJobs() {
        return [
          {room:'350',type:'standard',kind:'퇴실 청소',date:'8월 14일',tone:'red',priority:'마감 위험',available:'지금 가능',schedule:'이전 예약 체크아웃 11:00 → 15:30 준비 마감 → 다음 예약 체크인 16:00'},
          {room:'142',type:'oceanFamily',kind:'연박 청소',date:'8월 14일',tone:'blue',priority:'연박',available:'13:00부터 시작',schedule:'13:00–15:00 출입 가능 → 14:30 요청 완료'},
          {room:'211',type:'oceanFamily',kind:'퇴실 청소',date:'8월 15일',tone:'neutral',priority:'미래 일정',available:'내일 11:00부터',schedule:'이전 예약 체크아웃 11:00 → 15:30 준비 마감 → 다음 예약 체크인 16:00'}
        ];
      }

      function renderJobCard(j, claimed=false) {
        const type=ROOM_TYPES[j.type];
        return `<article class="card job-card"><div class="job-card-top"><div class="job-title">${statusBadge(j.priority,j.tone)}<h3 style="margin-top:10px">${j.room}호 · 데모</h3><p>${type.name}</p></div><div class="availability">${statusBadge(j.available,j.available.includes('지금')?'green':'neutral')}</div></div><div class="job-meta"><div><span>청소요금</span><strong>${money(type.rate)} · 8월 시트</strong></div><div><span>예상 소요시간</span><strong>${type.minutes}분 · 데모</strong></div></div><div class="schedule-line">${icon('clock','icon-sm')}<span>${j.schedule}</span></div><div class="job-actions">${button(claimed?'내 업무 보기':'선택',claimed?'go-my':'claim-job',claimed?'outline':'primary',`data-id="${j.room}" ${isLocked()?'disabled':''}`)}</div></article>`;
      }

      function renderMaidOpen() {
        const jobs=publicJobs().filter(j=>state.jobs[j.room]==='public'||j.room==='142'||j.room==='211');
        return renderCoach()+renderNetworkNotice()+`<div class="summary-strip"><span>${icon('list','icon-sm')}선택한 일감 <strong>2건</strong></span><span>${icon('clock','icon-sm')}예상 <strong>135분</strong></span><span>${icon('alert','icon-sm')}가장 가까운 마감 <strong>15:30</strong></span></div>${renderListState(`<section class="job-list">${jobs.map(j=>renderJobCard(j,false)).join('')}</section>`)}`;
      }

      function renderMaidMy() {
        const myJobs=[
          {room:'350',type:'standard',kind:'퇴실 청소',status:state.jobs['350'],schedule:'11:00부터 시작 · 15:30 준비 마감'},
          {room:'528',type:'premium',kind:'퇴실 청소',status:state.jobs['528'],schedule:'10:00 시작 가능 · 14:00 다음 입실'}
        ];
        return renderCoach()+renderNetworkNotice()+`<div class="notice notice-info">${icon('briefcase')}<div><strong>동시에 청소 중은 한 건만</strong><br>현장 완료·업로드 대기는 물리적 진행 슬롯을 해제하지만 다음 작업은 온라인 재검증 뒤 시작합니다.</div></div><section class="job-list">${myJobs.map(j=>renderMyJob(j)).join('')}</section>`;
      }

      function renderMyJob(j) {
        const type=ROOM_TYPES[j.type], canStart=timeMinutes(state.time)>=timeMinutes(j.room==='350'?'11:00':'10:00'), status=j.status;
        let label='상세 보기',action='cleaning-detail',tone='neutral';
        if (status==='claimed') { label=canStart?'시작':'출입 대기'; action='cleaning-detail'; tone=canStart?'green':'neutral'; }
        if (status==='cleaning') { label='계속 청소'; tone='amber'; }
        if (status==='upload') { label='미전송 재시도'; tone='red'; }
        if (status==='inspection') { label='제출 결과 보기'; tone='amber'; }

      }
      function calendarDayMeta(iso) {
        const value=dateObject(iso),weekday=value.getDay(),holiday=KR_HOLIDAY_FIXTURE.dates[iso]||null,isSunday=weekday===0,isSaturday=weekday===6;
        return {
          weekday,weekdayLabel:CALENDAR_WEEKDAYS[weekday],holiday,isSunday,isSaturday,
          tone:holiday?'holiday':isSunday?'sunday':isSaturday?'saturday':'weekday',

      function calendarDateAriaLabel(iso,{today=false,weekSelected=false}={}) {

      function weekStartIso(value) {

      function normalizePayWeek(value) {

      function selectedDraftBatch(ids=state.selectedDrafts) {
        const raw=Array.isArray(ids)?ids:[], unique=[...new Set(raw)];
        const selected=unique.map(draftId=>state.drafts.find(d=>d.id===draftId));
        const rooms=selected.filter(Boolean).map(d=>d.room);
        let reason='';
        if(!unique.length) reason='전날 배정에서 처리할 준비 작업을 먼저 선택하세요.';
        else if(unique.length!==raw.length||selected.some(d=>!d)) reason='선택 목록이 최신 초안과 일치하지 않습니다.';
        else if(new Set(rooms).size!==rooms.length) reason='같은 객실의 중복 준비 작업은 함께 처리할 수 없습니다.';
        else if(selected.some(d=>!ROOMS.some(room=>room.no===d.room)||!String(d.kind||'').trim()||!String(d.created||'').trim())) reason='객실·청소 유형·생성 시각이 완전한 준비 작업만 처리할 수 있습니다.';
        else if(selected.some(d=>state.publications?.[d.id])) reason='이미 처리된 작업이 선택 목록에 포함되어 있습니다.';
        return {valid:!reason,reason,ids:unique,selected:selected.filter(Boolean),rooms};
      }

        else if(a==='rule-complaint')showModal({title:'컴플레인 관리자 판정',subtitle:'반려와 별개인 평가 참고 기록이며 주급을 자동 차감하지 않습니다.',body:`<div class="choice-list"><label class="choice"><input type="radio" name="ruling" checked><span><strong>확인됨</strong><span>선택 벌점 1점 · 평가 참고</span></span></label><label class="choice"><input type="radio" name="ruling"><span><strong>확인 불가</strong><span>근거 부족 기록</span></span></label><label class="choice"><input type="radio" name="ruling"><span><strong>사실 아님</strong><span>판정 근거 기록</span></span></label></div>`,confirmLabel:'판정 알림',confirmAction:'confirm-ruling'});
        else if(a==='confirm-ruling'){state.complaint='ruled';appendEvent('컴플레인 판정','확인됨 · 메이드 응답 대기');closeModal();render();toast('메이드 판정 확인 대기로 전환했습니다.');}
        else if(a==='ack-complaint'){state.complaint='acknowledged';appendEvent('메이드 내용 확인','판정 변경 없음');render();toast('내용 확인을 기록했습니다.');}
        else if(a==='object-complaint')showModal({title:'판정 이의 메모',subtitle:'메이드는 판정·벌점·재청소를 직접 바꿀 수 없습니다.',body:`<div class="field"><label for="objection">이의 메모 · 데모</label><textarea id="objection" class="input-control" rows="4">작업 종료 당시 사진을 다시 확인해 주세요.</textarea></div>`,confirmLabel:'이의 제출',confirmAction:'confirm-objection'});
        else if(a==='confirm-objection'){state.complaint='objected';appendEvent('메이드 이의 제출','관리자 재검토 필요');closeModal();render();toast('관리자 재검토 상태로 전환했습니다.');}
        else if(a==='close-complaint'||a==='correct-complaint'){state.complaint='closed';appendEvent('컴플레인 종결',a==='correct-complaint'?'판정 정정 이벤트 추가':'판정 유지');render();toast('원본을 보존한 채 종결했습니다.');}
        else if(a==='alert-link'){closeModal();openDetail(el.dataset.type,el.dataset.id,el);}
        else if(a==='date-prev'||a==='date-next'){state.selectedDate=a==='date-prev'?'2026-08-13':'2026-08-15';render();toast(`${state.selectedDate} 객실판을 표시합니다.`);}
        else if(a==='date-today'){state.selectedDate='2026-08-14';render();}
        else if(a==='clear-filter'){state.roomFilter='all';state.listMode='data';render();focusAfterRender('[data-control="list-mode"]');}
        else if(a==='retry-network'){state.network='online';state.listMode='loading';render();focusAfterRender();setTimeout(()=>{state.listMode='data';render();focusAfterRender();toast('최신 상태와 권한을 다시 검증했습니다.');},500);}
        else if(a==='view-open-jobs'){state.role='maid';state.maidView='open';render();focusAfterRender();}
        else if(a==='logout'){state.loggedIn=false;state.detail=null;render();requestAnimationFrame(()=>document.querySelector('#login-id')?.focus());}
        else if(a==='login-mode'){const mode=el.dataset.mode;state.loginMode=mode;render();requestAnimationFrame(()=>document.querySelector(`[data-action="login-mode"][data-mode="${mode}"]`)?.focus());}
        else if(a==='notification-permission'){state.notificationsEnabled=true;render();toast('알림 권한 허용 상태를 데모로 전환했습니다.');}
        else if(a==='rates')showModal({title:'객실 타입 청소요금·예상시간',subtitle:'청소요금은 객실현황(26.08) 8월 시트 정본이며 예상시간만 데모입니다.',large:true,body:`<div class="rail-list">${Object.values(ROOM_TYPES).map(t=>`<div class="rail-row"><strong>${t.name}</strong><span>${money(t.rate)} · 8월 시트 · 예상 ${t.minutes}분(데모)</span></div>`).join('')}</div>`});
        else if(a==='template')showModal({title:'청소 템플릿 · 데모',subtitle:'객실 타입 × 퇴실·연박·재청소 조합',body:`<div class="notice notice-info">현재 초안 v4 · 미리보기와 필수 항목 검증 전에는 신규 작업에 사용되지 않습니다.</div><div class="check-list"><div class="check-row">${icon('check')}<span><strong>침대·욕실·바닥·문 잠금</strong><span>체크 4개 · 필수 사진 3개 · 선택 사진 1개</span></span></div></div>`,confirmLabel:state.template==='draft'?'미리보기·게시':'확인',confirmAction:'publish-template'});
        else if(a==='publish-template'){state.template='published v4';appendEvent('청소 템플릿 v4 게시','새 작업부터 적용 · 기존 작업 불변');closeModal();render();toast('새 버전을 게시했습니다.');}
        else if(a==='audit-log')showModal({title:'최근 변경 이력',subtitle:'PIN 원문·로그인 비밀번호·휴대폰 원문은 기록하지 않습니다.',large:true,body:`<ol class="timeline">${state.events.map(e=>`<li><strong>${esc(adminAuditTitle(e.title))}</strong><span>${esc(e.time)} · ${esc(adminAuditSummary(e.detail))}</span></li>`).join('')}</ol>`});
        else if(a==='demo-info')toast('객실번호·타입·엘리베이터·청소요금은 8월 시트 정본이며, 인명·예약·상태·예상시간은 화면 구조 데모입니다.');
        else if(a==='request-cancel')toast('담당 취소 요청을 모든 관리자 오늘 큐에 등록했습니다.');
      });

      document.addEventListener('change', e => {
        const c=e.target.dataset.control; if(!c) return;
        if(c==='role'){state.role=e.target.value;state.detail=null;render();requestAnimationFrame(()=>document.querySelector('[data-control="role"]')?.focus());}
        else if(c==='time'){state.time=e.target.value;render();requestAnimationFrame(()=>document.querySelector('[data-control="time"]')?.focus());toast(`${state.time} 한국시간으로 시뮬레이션합니다.`);}
        else if(c==='network'){state.network=e.target.value;if(state.network!=='online')state.listMode='stale';else if(state.listMode==='stale')state.listMode='data';render();requestAnimationFrame(()=>document.querySelector('[data-control="network"]')?.focus());}
        else if(c==='scenario'){state=makeScenario(Number(e.target.value));hydrateTemplateSnapshotsForState();render();requestAnimationFrame(()=>document.querySelector('[data-control="scenario"]')?.focus());toast(`${state.scenario}번 시나리오를 불러왔습니다.`);}
        else if(c==='room-filter'){state.roomFilter=e.target.value;render();requestAnimationFrame(()=>document.querySelector('[data-control="room-filter"]')?.focus());}
        else if(c==='draft'){const value=e.target.value;state.selectedDrafts=e.target.checked?[...state.selectedDrafts,value]:state.selectedDrafts.filter(v=>v!==value);render();requestAnimationFrame(()=>document.querySelector(`[data-control="draft"][value="${value}"]`)?.focus());}
        else if(c==='conflict-step'){state.conflictSteps[e.target.value]=e.target.checked;}
        else if(c==='list-mode'){state.listMode=e.target.value;if(state.listMode==='stale')state.network='stale';else if(state.network==='stale')state.network='online';render();requestAnimationFrame(()=>document.querySelector('[data-control="list-mode"]')?.focus());}
      });

      document.addEventListener('submit', e => {
        if(e.target.id==='login-form'){e.preventDefault();state.loggedIn=true;state.loginMode='normal';render();toast('데모 역할 화면으로 로그인했습니다.');}
      });

      document.addEventListener('keydown', e => {
        const modal=document.querySelector('.modal');
        if(!modal) return;
        if(e.key==='Escape'){e.preventDefault();dismissModal();return;}
        if(e.key==='Tab'){
          const focusable=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')];
          if(!focusable.length)return;
          const first=focusable[0],last=focusable[focusable.length-1];
          if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
          else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
        }
      });

      function applyHashParameters(params) {
        if(!params.has('scenario'))return false;
        state=makeScenario(Number(params.get('scenario'))||0);hydrateTemplateSnapshotsForState();
        if(['admin','maid'].includes(params.get('role')))state.role=params.get('role');
        if(state.detail&&!detailAllowedForRole(state.detail.type,state.role))state.detail=null;
        if(state.role==='admin'&&adminNav.some(n=>n.id===params.get('view')))state.adminView=params.get('view');
        if(state.role==='maid'&&maidNav.some(n=>n.id===params.get('view')))state.maidView=params.get('view');
        if(/^2026-08-(0[1-9]|[12]\d|3[01])$/.test(params.get('date')||'')){state.selectedDate=params.get('date');state.calendarMonth=state.selectedDate.slice(0,7);}
        const requestedRoomFilter=['catalog','default'].includes(params.get('filter'))?'vacant':params.get('filter');
        if(['all','vacant','available','blocked','cleaning','occupied','candle','issues','early','late'].includes(requestedRoomFilter))state.roomFilter=requestedRoomFilter;
        if(['all',...Object.keys(ROOM_TYPES)].includes(params.get('type')))state.roomTypeFilter=params.get('type');
        if(['all',...Object.keys(ROOM_TYPES)].includes(params.get('assignmentType')))state.assignmentTypeFilter=params.get('assignmentType');
        if(/^\d{0,6}$/.test(params.get('q')||''))state.roomSearch=params.get('q')||'';
        if(/^\d{4}-(0[1-9]|1[0-2])$/.test(params.get('bookingMonth')||''))state.quickReservationMonth=params.get('bookingMonth');
        if(['all',...Object.keys(ROOM_TYPES)].includes(params.get('bookingType')))state.quickReservationType=params.get('bookingType');
        if(/^\d{0,6}$/.test(params.get('bookingQ')||''))state.quickReservationSearch=params.get('bookingQ')||'';
        const detailValue=params.get('detail');
        if(detailValue){state.detail=null;const separator=detailValue.indexOf(':'),type=separator>0?detailValue.slice(0,separator):'',id=separator>0?detailValue.slice(separator+1):'';if(detailAllowedForRole(type,state.role)&&id)state.detail={type,id,...(params.get('mode')?{mode:params.get('mode')}:{})};}
        return true;
      }
      hydrateTemplateSnapshotsForState();
      const initialParams=new URLSearchParams(location.hash.slice(1));applyHashParameters(initialParams);
      const initialHistoryEntry=isWireframeHistory(history.state)?history.state:null;
      if(initialHistoryEntry)applyHistoryRoute(initialHistoryEntry.route);
      if(Array.isArray(history.state?.completedModalSessions))completedModalSessions.push(...history.state.completedModalSessions.filter(session=>typeof session?.modalSessionId==='string'&&session.route));
      window.addEventListener('pagehide',()=>clearAllPinModalSecrets());
      document.addEventListener('visibilitychange',()=>{if(document.hidden)maskPin();});
      window.addEventListener('popstate',handleHistoryNavigation);
      window.addEventListener('hashchange',()=>{
        if(isWireframeHistory(history.state))return;
        const params=new URLSearchParams(location.hash.slice(1));if(!applyHashParameters(params))return;
        rawCloseModal();restoringHistory=true;render();restoringHistory=false;writePageHistory(historyRouteSnapshot(),'replace');
      });
      if(initialHistoryEntry){restoringHistory=true;render();restoringHistory=false;if(initialHistoryEntry.layer==='modal')restoreModalHistory(initialHistoryEntry);}
      else render();
    })();
  </script>
</body>
</html>
