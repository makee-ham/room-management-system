<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f6f7" />
  <title>Castle The Art 객실관리 — 사진 검수·소프트 삭제 반영본</title>
  <style>
    :root {
      --bg: #edf0f2;
      --surface: #ffffff;
      --surface-2: #f6f7f8;
      --surface-3: #eef1f3;
      --ink: #17212a;
      --muted: #6f7880;
      --line: #dce1e5;
      --line-strong: #bfc7ce;
      --brand: #23384a;
      --brand-soft: #e9eef2;
      --red: #c9444a;
      --red-soft: #fff0f1;
      --orange: #b76a11;
      --orange-soft: #fff5e8;
      --green: #28785b;
      --green-soft: #edf8f3;
      --blue: #35638f;
      --blue-soft: #edf4fb;
      --purple: #7054a1;
      --purple-soft: #f3effa;
      --gold: #9b763c;
      --gold-soft: #f7f2e8;
      --shadow: 0 22px 65px rgba(24, 34, 43, .16);
      --radius: 18px;
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
    body { min-height: 100dvh; }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    svg { display: block; }

    .workspace {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(260px, 330px) 390px;
      justify-content: center;
      align-items: center;
      gap: 42px;
      padding: 28px;
    }

    .prototype-notes { max-width: 330px; }
    .prototype-notes h1 { margin: 0; font-size: 27px; line-height: 1.22; letter-spacing: -.04em; }
    .prototype-notes > p { margin: 12px 0 20px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .prototype-brand { margin-bottom: 8px; color: var(--gold); font-size: 11px; font-weight: 900; letter-spacing: .16em; }
    .control-group { margin-top: 12px; padding: 15px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.76); }
    .control-label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 11px; font-weight: 900; letter-spacing: .06em; }
    .control-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .preview-btn { min-height: 39px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); font-size: 12px; font-weight: 800; cursor: pointer; }
    .preview-btn.active { color: #fff; border-color: var(--brand); background: var(--brand); }
    .legend { display: grid; gap: 9px; }
    .legend-row { display: flex; align-items: center; gap: 9px; color: #4d5861; font-size: 12px; }
    .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
    .legend-dot.red { background: var(--red); }
    .legend-dot.orange { background: var(--orange); }
    .legend-dot.green { background: var(--green); }
    .legend-dot.gray { background: #9aa3ab; }
    .legend-dot.blue { background: var(--blue); }

    .phone {
      position: relative;
      width: 390px;
      height: min(844px, calc(100dvh - 28px));
      min-height: 680px;
      overflow: hidden;
      border: 1px solid #b8c0c7;
      border-radius: 38px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .phone::before {
      content: "";
      position: absolute;
      z-index: 60;
      top: 10px;
      left: 50%;
      width: 108px;
      height: 27px;
      transform: translateX(-50%);
      border-radius: 18px;
      background: #111820;
      pointer-events: none;
    }
    .app { position: relative; display: flex; flex-direction: column; height: 100%; overflow: hidden; background: var(--surface-2); }

    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 78px;
      padding: 34px 16px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.97);
    }
    .topbar.compact { min-height: 67px; padding-top: 28px; }
    .topbar-title-wrap { min-width: 0; flex: 1; }
    .brandline { color: var(--gold); font-size: 9px; font-weight: 950; letter-spacing: .17em; }
    .topbar-title { margin-top: 2px; overflow: hidden; font-size: 19px; font-weight: 900; letter-spacing: -.03em; white-space: nowrap; text-overflow: ellipsis; }
    .topbar-subtitle { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .back-btn, .icon-btn {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 0;
      background: none;
      cursor: pointer;
    }
    .back-btn { width: 38px; height: 38px; margin-left: -5px; }
    .icon-btn { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .back-btn svg, .icon-btn svg, .nav-icon svg, .inline-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .screen {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 14px 14px calc(88px + var(--safe-bottom));
      scroll-behavior: smooth;
    }
    .screen.no-nav { padding-bottom: calc(30px + var(--safe-bottom)); }
    .screen::-webkit-scrollbar { width: 0; }

    .bottom-nav {
      position: absolute;
      z-index: 30;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      min-height: calc(69px + var(--safe-bottom));
      padding: 7px 4px var(--safe-bottom);
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.98);
      backdrop-filter: blur(12px);
    }
    .nav-item { min-width: 0; border: 0; border-radius: 10px; background: none; color: #8d969e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
    .nav-item.active { color: var(--brand); }
    .nav-icon { position: relative; display: grid; place-items: center; width: 24px; height: 24px; }
    .nav-item > span:last-child { font-size: 9.5px; font-weight: 800; white-space: nowrap; }
    .nav-dot { position: absolute; top: -1px; right: 0; width: 7px; height: 7px; border: 1px solid #fff; border-radius: 50%; background: var(--red); }

    .login-screen { min-height: 100%; padding: 76px 26px 30px; background: var(--surface); }
    .login-mark { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 17px; color: #fff; background: var(--brand); font-size: 14px; font-weight: 950; letter-spacing: .08em; }
    .login-brand { margin-top: 24px; color: var(--gold); font-size: 11px; font-weight: 950; letter-spacing: .18em; }
    .login-title { margin: 7px 0 0; font-size: 31px; line-height: 1.15; letter-spacing: -.055em; }
    .login-copy { margin: 12px 0 27px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 18px; padding: 4px; border-radius: 13px; background: var(--surface-3); }
    .role-tab { min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 850; cursor: pointer; }
    .role-tab.active { color: var(--ink); background: var(--surface); box-shadow: 0 2px 8px rgba(20,30,38,.08); }
    .field { margin-top: 11px; }
    .field label { display: block; margin: 0 0 7px 2px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      color: var(--ink);
      background: var(--surface);
    }
    .input, .select { height: 47px; padding: 0 13px; font-size: 14px; }
    .input:focus, .select:focus, .textarea:focus { border-color: #91a0ac; box-shadow: 0 0 0 3px rgba(35,56,74,.08); }
    .login-actions { margin-top: 18px; }
    .login-hint { margin-top: 12px; color: var(--muted); text-align: center; font-size: 9px; line-height: 1.5; }

    .btn {
      min-height: 43px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      font-size: 12px;
      font-weight: 850;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .btn.primary { border-color: var(--brand); color: #fff; background: var(--brand); }
    .btn.green { border-color: var(--green); color: #fff; background: var(--green); }
    .btn.red { border-color: var(--red); color: #fff; background: var(--red); }
    .btn.soft { border-color: transparent; color: var(--brand); background: var(--brand-soft); }
    .btn.gold { border-color: #dcc9a9; color: #6d542b; background: var(--gold-soft); }
    .btn.small { min-height: 34px; padding: 0 10px; border-radius: 10px; font-size: 10px; }
    .btn.full { width: 100%; }
    .btn:disabled { cursor: not-allowed; opacity: .43; }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .summary-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .summary-cell { min-width: 0; padding: 11px 5px 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); text-align: center; }
    .summary-cell strong { display: block; font-size: 20px; line-height: 1; letter-spacing: -.04em; }
    .summary-cell span { display: block; margin-top: 6px; overflow: hidden; color: var(--muted); font-size: 9px; white-space: nowrap; text-overflow: ellipsis; }
    .summary-cell.red strong { color: var(--red); }
    .summary-cell.orange strong { color: var(--orange); }
    .summary-cell.green strong { color: var(--green); }
    .summary-cell.blue strong { color: var(--blue); }

    .section-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 18px 2px 10px; }
    .section-title-row.first { margin-top: 2px; }
    .section-title { margin: 0; font-size: 15px; font-weight: 900; letter-spacing: -.025em; }
    .section-meta { color: var(--muted); font-size: 10px; }
    .text-action { border: 0; padding: 4px 0; color: var(--blue); background: none; font-size: 10px; font-weight: 850; cursor: pointer; }

    .search-wrap { position: relative; margin-top: 12px; }
    .search-wrap .input { height: 43px; padding-left: 38px; }
    .search-icon { position: absolute; top: 50%; left: 12px; width: 17px; height: 17px; transform: translateY(-50%); color: #89939c; pointer-events: none; }
    .search-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .filter-rail { display: flex; gap: 7px; overflow-x: auto; padding: 10px 1px 3px; scrollbar-width: none; }
    .filter-rail::-webkit-scrollbar { display: none; }
    .chip { min-height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 10px; font-weight: 800; white-space: nowrap; cursor: pointer; }
    .chip.active { border-color: var(--brand); color: #fff; background: var(--brand); }

    .notice { display: flex; align-items: flex-start; gap: 9px; margin-top: 12px; padding: 11px 12px; border: 1px solid #ead2aa; border-radius: 13px; color: #75490f; background: var(--orange-soft); font-size: 10px; line-height: 1.5; }
    .notice-mark { display: grid; place-items: center; width: 19px; height: 19px; flex: 0 0 auto; border-radius: 50%; background: #f0ce96; font-size: 11px; font-weight: 950; }

    .room-board { display: grid; gap: 8px; }
    .room-row { position: relative; padding: 12px 12px 11px 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); overflow: hidden; }
    .room-row::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 4px; background: #9ba4ac; }
    .room-row.red::before { background: var(--red); }
    .room-row.orange::before { background: var(--orange); }
    .room-row.green::before { background: var(--green); }
    .room-row.blue::before { background: var(--blue); }
    .room-row-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .room-ident { min-width: 0; }
    .room-ident strong { font-size: 18px; line-height: 1; letter-spacing: -.04em; }
    .room-ident span { display: block; margin-top: 4px; overflow: hidden; color: var(--muted); font-size: 9.5px; white-space: nowrap; text-overflow: ellipsis; }
    .status-stack { display: flex; align-items: center; justify-content: flex-end; gap: 5px; flex-wrap: wrap; }
    .status-chip { display: inline-flex; align-items: center; min-height: 23px; padding: 0 7px; border-radius: 7px; font-size: 9px; font-weight: 850; white-space: nowrap; }
    .tone-gray { color: #5c666e; background: #eef0f2; }
    .tone-red { color: var(--red); background: var(--red-soft); }
    .tone-orange { color: var(--orange); background: var(--orange-soft); }
    .tone-green { color: var(--green); background: var(--green-soft); }
    .tone-blue { color: var(--blue); background: var(--blue-soft); }
    .tone-purple { color: var(--purple); background: var(--purple-soft); }
    .room-row-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 11px; }
    .room-data { min-width: 0; padding: 8px 8px 7px; border-radius: 10px; background: var(--surface-2); }
    .room-data label { display: block; color: var(--muted); font-size: 8.5px; }
    .room-data strong { display: block; margin-top: 4px; overflow: hidden; font-size: 11px; white-space: nowrap; text-overflow: ellipsis; }
    .room-data.password strong { color: var(--brand); font-size: 13px; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
    .room-data.candle strong { color: #7c5a25; }
    .room-row-actions { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 7px; margin-top: 9px; }
    .mini-label { color: var(--muted); font-size: 9px; }
    .open-state { font-size: 10px; font-weight: 850; }
    .open-state.on { color: var(--green); }
    .open-state.off { color: #7c858d; }

    .switch { position: relative; width: 42px; height: 25px; flex: 0 0 auto; border: 0; border-radius: 999px; background: #cbd1d6; cursor: pointer; transition: background .16s ease; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(20,30,38,.22); transition: transform .16s ease; }
    .switch.on { background: var(--green); }
    .switch.on::after { transform: translateX(17px); }
    .switch:disabled { opacity: .38; cursor: not-allowed; }

    .panel { margin-bottom: 11px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 13px 10px; border-bottom: 1px solid #edf0f2; }
    .panel-title { font-size: 12px; font-weight: 900; }
    .panel-subtitle { margin-top: 2px; color: var(--muted); font-size: 9px; }
    .panel-body { padding: 13px; }
    .info-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 9px 0; }
    .info-row + .info-row { border-top: 1px solid #edf0f2; }
    .info-label { color: var(--muted); font-size: 10px; }
    .info-value { max-width: 65%; text-align: right; font-size: 11px; font-weight: 800; line-height: 1.45; }

    .job-toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .job-list { display: grid; gap: 9px; }
    .job-row { padding: 13px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
    .job-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .job-room { font-size: 18px; font-weight: 900; letter-spacing: -.04em; }
    .job-type { margin-top: 3px; color: var(--muted); font-size: 9.5px; }
    .job-price { color: var(--brand); text-align: right; font-size: 18px; font-weight: 950; letter-spacing: -.035em; }
    .job-price span { display: block; margin-top: 2px; color: var(--muted); font-size: 8.5px; font-weight: 700; }
    .job-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 11px; }
    .job-meta > div { padding: 8px; border-radius: 10px; background: var(--surface-2); }
    .job-meta label { display: block; color: var(--muted); font-size: 8px; }
    .job-meta strong { display: block; margin-top: 4px; overflow: hidden; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .job-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #edf0f2; }
    .job-assignee { min-width: 0; color: var(--muted); font-size: 9px; }
    .job-assignee strong { color: var(--ink); font-size: 10px; }
    .candle-badge { display: inline-flex; align-items: center; gap: 4px; min-height: 23px; padding: 0 8px; border-radius: 7px; color: #755626; background: var(--gold-soft); font-size: 9px; font-weight: 850; white-space: nowrap; }
    .candle-badge svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .maid-hero { margin: -14px -14px 14px; padding: 19px 14px 17px; color: #fff; background: var(--brand); }
    .maid-greeting { color: rgba(255,255,255,.69); font-size: 10px; }
    .maid-hero h2 { margin: 5px 0 0; font-size: 23px; letter-spacing: -.04em; }
    .maid-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 15px; }
    .maid-stat { padding: 9px; border: 1px solid rgba(255,255,255,.16); border-radius: 12px; background: rgba(255,255,255,.06); }
    .maid-stat span { display: block; color: rgba(255,255,255,.63); font-size: 8px; }
    .maid-stat strong { display: block; margin-top: 4px; font-size: 14px; }

    .market-card { margin-bottom: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
    .market-card.red { border-color: #e6b2b6; box-shadow: inset 4px 0 0 var(--red); }
    .market-card.orange { border-color: #efd1a7; box-shadow: inset 4px 0 0 var(--orange); }
    .market-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .market-room { font-size: 20px; font-weight: 950; letter-spacing: -.04em; }
    .market-price { color: var(--brand); text-align: right; font-size: 22px; font-weight: 950; letter-spacing: -.045em; }
    .market-price span { display: block; margin-top: 1px; color: var(--muted); font-size: 8.5px; font-weight: 750; }
    .market-info { display: flex; gap: 7px 14px; flex-wrap: wrap; margin: 11px 0; color: var(--muted); font-size: 9.5px; }
    .market-info b { color: var(--ink); }
    .badge-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .badge { display: inline-flex; align-items: center; min-height: 23px; padding: 0 8px; border-radius: 7px; color: #5f6870; background: var(--surface-3); font-size: 9px; font-weight: 800; white-space: nowrap; }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .badge.blue { color: var(--blue); background: var(--blue-soft); }
    .badge.orange { color: var(--orange); background: var(--orange-soft); }

    .task-card { margin-bottom: 9px; padding: 13px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
    .task-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .task-number { font-size: 19px; font-weight: 950; letter-spacing: -.04em; }
    .task-deadline { color: var(--red); text-align: right; font-size: 11px; font-weight: 850; }
    .task-deadline span { display: block; margin-top: 2px; color: var(--muted); font-size: 8.5px; font-weight: 700; }
    .task-summary { display: flex; justify-content: space-between; gap: 10px; margin: 10px 0; color: var(--muted); font-size: 9px; }
    .task-summary b { color: var(--ink); }

    .detail-hero { margin: -14px -14px 13px; padding: 18px 14px 15px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .detail-room { font-size: 27px; font-weight: 950; letter-spacing: -.05em; }
    .detail-type { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .detail-price { color: var(--brand); text-align: right; font-size: 17px; font-weight: 950; }
    .detail-price span { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; font-weight: 700; }
    .detail-statuses { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }

    .password-box { display: flex; align-items: center; gap: 10px; padding: 13px; border-radius: 13px; background: var(--surface-3); }
    .password-display { min-width: 0; flex: 1; }
    .password-display small { display: block; color: var(--muted); font-size: 9px; }
    .password-display strong { display: block; margin-top: 4px; font-size: 23px; line-height: 1; letter-spacing: .17em; font-variant-numeric: tabular-nums; }
    .password-display strong.masked { letter-spacing: .21em; }
    .password-actions { display: flex; gap: 6px; }

    .candle-control { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px; border: 1px solid #e5d7bc; border-radius: 13px; background: var(--gold-soft); }
    .candle-title { display: flex; align-items: center; gap: 8px; color: #6f5327; }
    .candle-title svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .inspection-cover.more { display: grid; place-items: center; color: #fff; background: var(--brand); font-size: 11px; font-weight: 900; }

    .review-progress-head span { color: var(--muted); font-size: 9px; }
    .progress-track { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 999px; background: var(--surface-3); }
    .progress-fill { height: 100%; border-radius: inherit; background: var(--green); transition: width .18s ease; }
    .inspection-viewer { overflow: hidden; border: 1px solid var(--line); border-radius: 17px; background: var(--surface); }
    .inspection-main-photo { position: relative; width: 100%; aspect-ratio: 16 / 10.5; overflow: hidden; border: 0; background: #e8edf0; cursor: zoom-in; }
    .photo-overlay { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 27px 12px 10px; color: #fff; background: linear-gradient(transparent, rgba(16,25,33,.78)); text-align: left; }

    .zoom-mark { position: absolute; top: 9px; right: 9px; min-height: 25px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 8px; color: #fff; background: rgba(16,25,33,.72); font-size: 8px; font-weight: 850; }
    .zoom-mark svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .review-current { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; }
    .review-current-copy { min-width: 0; }
    .review-current-copy strong { display: block; font-size: 11px; }
    .review-current-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 8.5px; }
    .review-check { min-height: 34px; flex: 0 0 auto; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 9px; font-weight: 850; cursor: pointer; }
    .review-check.done { color: #fff; border-color: var(--green); background: var(--green); }
    .photo-thumb-rail { display: grid; grid-auto-flow: column; grid-auto-columns: 76px; gap: 7px; margin: 10px -14px 0; padding: 0 14px 3px; overflow-x: auto; overscroll-behavior-x: contain; }
    .photo-thumb { position: relative; height: 74px; overflow: hidden; padding: 0; border: 1px solid var(--line); border-radius: 11px; background: #e8edf0; cursor: pointer; }
    .photo-thumb.selected { border: 2px solid var(--brand); }
    .photo-thumb.reviewed::after { content: "✓"; position: absolute; top: 5px; right: 5px; display: grid; place-items: center; width: 18px; height: 18px; border: 2px solid #fff; border-radius: 50%; color: #fff; background: var(--green); font-size: 10px; font-weight: 900; }
    .photo-thumb span { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; padding: 12px 5px 5px; color: #fff; background: linear-gradient(transparent, rgba(16,25,33,.76)); font-size: 7.5px; font-weight: 850; white-space: nowrap; text-overflow: ellipsis; }
    .photo-zoom { height: min(48dvh, 390px); overflow: hidden; border-radius: 15px; background: #e8edf0; }
    .photo-sheet { padding-bottom: calc(14px + var(--safe-bottom)); }

    .reviewed-note svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
    .reason-preview { margin-top: 10px; padding: 11px; border: 1px solid #efc9cb; border-radius: 12px; color: #81383d; background: var(--red-soft); font-size: 9px; line-height: 1.5; }

    .textarea { min-height: 86px; padding: 11px 12px; resize: vertical; font-size: 13px; line-height: 1.5; }

    .money-summary { padding: 18px; border-radius: 18px; color: #fff; background: var(--brand); }

    .settlement-row { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 10px; padding: 11px 0; }
    .settlement-row + .settlement-row { border-top: 1px solid #edf0f2; }
    .settlement-date { text-align: center; }
    .settlement-date strong { display: block; font-size: 14px; }

    .menu-row svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }


    .staff-list { display: grid; gap: 9px; }

    .staff-avatar { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto; border-radius: 14px; color: #fff; background: var(--brand); font-size: 13px; font-weight: 950; }

    .staff-avatar.retired { color: #87673a; background: #f3ead9; }
    .staff-main { min-width: 0; flex: 1; }
    .staff-main strong { display: block; font-size: 13px; }
    .staff-main span { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); font-size: 9px; white-space: nowrap; text-overflow: ellipsis; }
    .staff-status { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0 8px; border-radius: 999px; color: var(--green); background: var(--green-soft); font-size: 8.5px; font-weight: 850; }
    .staff-status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .staff-metric label { display: block; color: var(--muted); font-size: 8px; }
    .staff-metric strong { display: block; margin-top: 4px; overflow: hidden; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .staff-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #edf0f2; }
    .staff-actions span { color: var(--muted); font-size: 8.5px; }
    .week-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 12px; padding: 4px; border-radius: 13px; background: var(--surface-3); }
    .week-tab { min-height: 36px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 9.5px; font-weight: 850; cursor: pointer; }
    .week-tab.active { color: var(--ink); background: var(--surface); box-shadow: 0 2px 8px rgba(20,30,38,.08); }
    .pay-card { padding: 13px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
    .pay-card + .pay-card { margin-top: 8px; }
    .pay-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .pay-name strong { display: block; font-size: 13px; }
    .pay-name span { display: block; margin-top: 3px; color: var(--muted); font-size: 8.5px; }
    .pay-total { text-align: right; }
    .pay-total strong { display: block; color: var(--brand); font-size: 17px; }
    .pay-total span { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
    .pay-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
    .pay-grid > div { padding: 8px; border-radius: 10px; background: var(--surface-2); }
    .pay-grid label { display: block; color: var(--muted); font-size: 8px; }
    .pay-grid strong { display: block; margin-top: 4px; font-size: 10px; }
    .danger-zone { margin-top: 15px; padding: 12px; border: 1px solid #efc9cb; border-radius: 14px; background: var(--red-soft); }
    .danger-zone strong { display: block; color: #84363b; font-size: 11px; }
    .danger-zone p { margin: 5px 0 10px; color: #94545a; font-size: 9px; line-height: 1.5; }
    .archive-zone { margin-top: 15px; padding: 12px; border: 1px solid #e1d1b4; border-radius: 14px; background: var(--gold-soft); }
    .archive-zone strong { display: block; color: #76592e; font-size: 11px; }
    .archive-zone p { margin: 5px 0 10px; color: #876f4d; font-size: 9px; line-height: 1.5; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sheet .field { margin-top: 9px; }
    .sheet-scroll { max-height: min(64dvh, 520px); overflow-y: auto; padding-bottom: 2px; }

    .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); }
    .empty-state strong { display: block; color: var(--ink); font-size: 13px; }
    .empty-state span { display: block; margin-top: 6px; font-size: 9.5px; line-height: 1.5; }

    .sheet-backdrop { position: absolute; z-index: 80; inset: 0; background: rgba(17,24,32,.42); opacity: 0; pointer-events: none; transition: opacity .18s ease; }
    .sheet { position: absolute; z-index: 81; left: 0; right: 0; bottom: 0; padding: 10px 15px calc(17px + var(--safe-bottom)); border-radius: 23px 23px 0 0; background: var(--surface); transform: translateY(103%); transition: transform .2s ease; box-shadow: 0 -18px 40px rgba(17,24,32,.16); }
    .sheet.open { transform: translateY(0); }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .sheet-handle { width: 38px; height: 4px; margin: 0 auto 14px; border-radius: 999px; background: #ccd2d7; }
    .sheet h3 { margin: 0; font-size: 17px; letter-spacing: -.03em; }
    .sheet p { margin: 7px 0 14px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .password-input-row { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 7px; }
    .password-input { text-align: center; font-weight: 950; letter-spacing: .22em; font-variant-numeric: tabular-nums; }

    .toast { position: absolute; z-index: 100; left: 50%; bottom: calc(84px + var(--safe-bottom)); max-width: calc(100% - 34px); padding: 10px 14px; border-radius: 11px; color: #fff; background: #17212a; font-size: 10px; font-weight: 800; text-align: center; transform: translate(-50%, 15px); opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; box-shadow: 0 10px 26px rgba(17,24,32,.25); }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .sticky-action { position: sticky; bottom: 0; margin: 16px -14px -14px; padding: 10px 14px calc(10px + var(--safe-bottom)); border-top: 1px solid var(--line); background: rgba(246,247,248,.97); backdrop-filter: blur(10px); }

    @media (max-width: 760px) {

      .phone { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }

      .topbar { min-height: calc(58px + env(safe-area-inset-top)); padding-top: max(12px, env(safe-area-inset-top)); }

    }

    @media (max-height: 720px) and (min-width: 761px) {
      .workspace { padding: 10px; }
      .phone { height: calc(100dvh - 20px); min-height: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <aside class="prototype-notes" aria-label="프로토타입 빠른 탐색">
      <div class="prototype-brand">CASTLE THE ART</div>

      <p>전체 객실 상태·비밀번호부터 인증사진 검수, 일감 선택, 메이드 퇴사 이력과 주급까지 연결한 구조입니다.</p>

          <button class="preview-btn" data-demo-view="admin-open">일감 오픈</button>
          <button class="preview-btn" data-demo-view="admin-inspection">사진 검수</button>
          <button class="preview-btn" data-demo-view="admin-maids">메이드 관리</button>
          <button class="preview-btn" data-demo-view="admin-settlement">주급 정산</button>
          <button class="preview-btn" data-demo-view="maid-market">메이드 선택</button>
          <button class="preview-btn" data-demo-view="password">비밀번호</button>
        </div>
      </div>

        <span class="control-label">객실 청소 상태 색상</span>

          <div class="legend-row"><span class="legend-dot orange"></span><span>청소 가능·진행·검수</span></div>
          <div class="legend-row"><span class="legend-dot green"></span><span>입실 준비 완료</span></div>
          <div class="legend-row"><span class="legend-dot gray"></span><span>투숙 중·작업 없음·입실 대기</span></div>
          <div class="legend-row"><span class="legend-dot blue"></span><span>연박 청소</span></div>
        </div>
      </div>

      <div class="control-group">
        <span class="control-label">핵심 상호작용</span>
        <div style="color:#59636b;font-size:11px;line-height:1.65;">객실표 비밀번호 수정 → 일감 오픈/선택 → 메이드 인증사진 제출 → 관리자가 사진별 확인·확대 후 승인/재청소 → 메이드 계정은 퇴사 처리해도 작업·주급 이력 보존.</div>
      </div>

      <button class="preview-btn" data-action="reset-demo" style="margin-top:14px;">시안 초기화</button>

        ['수건·비품','기준 수량에 맞게 보충'],
        ...(room.candleCount > 0 ? [[`촛불 ${room.candleCount}개 소화·회수`,`위치: ${room.candleLocations || '객실 내 위치 확인'}`]] : []),
        ['문 잠금','퇴실 전 도어락 확인']
      ];
      const photoItems = requiredPhotoItems(room);
      const done = checks.length === checkItems.length && photos.length === photoItems.length;
      const started = !!state.taskStarted[room.id];
      return `${topbar(`${room.id}호 청소`, `${room.task} · ${room.cleaningFee.toLocaleString()}원`, true)}
        <section class="screen no-nav">
          <div class="detail-hero"><div class="detail-head"><div><div class="detail-room">${room.id}호</div><div class="detail-type">${room.type} · ${room.deadline} 완료 마감</div></div><div class="detail-price">${room.cleaningFee.toLocaleString()}원<span>이번 주 반영 예정</span></div></div><div class="detail-statuses">${cleaningChip(room)}${room.candleCount ? `<span class="candle-badge">${icon('candle')} 촛불 ${room.candleCount}개</span>` : ''}</div></div>

          ${room.candleCount > 0 ? `<div class="callout gold" style="margin-bottom:11px;"><strong>촛불 ${room.candleCount}개 있음</strong><br>${room.candleLocations}. 입실 즉시 위치를 확인하고, 완료 전 모두 소화·회수해 주세요.</div>` : ''}

          <div class="panel"><div class="panel-header"><div><div class="panel-title">입실 정보</div><div class="panel-subtitle">내 담당 객실에만 비밀번호 표시</div></div></div><div class="panel-body">
            ${room.canEnter ? `<div class="password-box"><div class="password-display"><small>객실 비밀번호</small><strong class="${state.passwordVisible ? '' : 'masked'}">${state.passwordVisible ? room.password : '••••'}</strong></div><button class="icon-btn" data-action="toggle-password" aria-label="비밀번호 보기">${icon('eye')}</button></div>` : `<div class="callout orange">${room.available}부터 객실 비밀번호를 확인할 수 있습니다.</div>`}
            <div class="info-row"><span class="info-label">청소 가능</span><span class="info-value">${room.available}</span></div>
            <div class="info-row"><span class="info-label">완료 마감</span><span class="info-value">${room.deadline}</span></div>
            <div class="info-row"><span class="info-label">특이사항</span><span class="info-value">${room.notes}</span></div>
          </div></div>

          ${!started ? `<button class="btn primary full" data-action="start-task" data-id="${room.id}" ${room.canEnter ? '' : 'disabled'}>청소 시작</button>` : `
            <div class="section-title-row"><h2 class="section-title">청소 체크리스트</h2><span class="section-meta">${checks.length}/${checkItems.length}</span></div>
            <div class="checklist">${checkItems.map((item, i) => `<button class="check-item ${checks.includes(i) ? 'checked':''}" data-action="toggle-check" data-id="${room.id}" data-index="${i}"><span class="check-box">${checks.includes(i) ? '✓':''}</span><span><strong>${item[0]}</strong><span>${item[1]}</span></span></button>`).join('')}</div>
            <div class="section-title-row"><h2 class="section-title">필수 사진</h2><span class="section-meta">${photos.length}/${photoItems.length}</span></div>
            <div class="photo-grid">${photoItems.map((item, i) => `<button class="photo-slot ${photos.includes(i) ? 'done':''}" data-action="toggle-photo" data-id="${room.id}" data-index="${i}">${icon('camera')}<strong>${photos.includes(i) ? '등록 완료' : item.label}</strong><span>${photos.includes(i) ? `${item.label} · 다시 촬영` : '눌러서 촬영'}</span></button>`).join('')}</div>
            <div class="section-title-row"><h2 class="section-title">특이사항</h2><span class="section-meta">선택 입력</span></div>
            <textarea id="taskNote" data-room-id="${room.id}" class="textarea" placeholder="객실 상태나 추가 확인이 필요한 내용을 적어 주세요.">${state.taskNotes[room.id] || ''}</textarea>
            <div class="sticky-action"><button class="btn green full" data-action="complete-task" data-id="${room.id}" ${done ? '' : 'disabled'}>청소 완료·검수 요청 ${done ? '' : `(${checks.length + photos.length}/${checkItems.length + photoItems.length})`}</button></div>
          `}
        </section>`;
    }

    function inspectionPhotosFor(room) {
      if (!state.inspectionPhotos[room.id]) state.inspectionPhotos[room.id] = buildInspectionPhotos(room);
      return state.inspectionPhotos[room.id];
    }

    function renderAdminInspection() {
      const rooms = state.rooms.filter(r => r.inspection || r.cleaningStatus === '검수 대기' || r.cleaningStatus === '재청소 필요');
      return `${topbar('청소 검수', `${rooms.length}개 객실 · 인증사진 확인`)}<section class="screen">
        <div class="notice"><span class="notice-mark">${icon('camera')}</span><span>객실을 열면 메이드가 제출한 인증사진을 항목별로 크게 보고, 사진마다 확인 표시를 한 뒤 승인하거나 특정 사진에 재청소 사유를 연결할 수 있습니다.</span></div>
        <div class="filter-rail"><button class="chip active">전체 ${rooms.length}</button><button class="chip">검수 대기</button><button class="chip">재청소</button></div>
        <div class="section-title-row"><h2 class="section-title">확인할 객실</h2><span class="section-meta">제출 오래된 순</span></div>
        <div>${rooms.map(room => {
          const photos = inspectionPhotosFor(room);
          const reviewed = state.photoReviews[room.id] || [];
          const waitingReclean = room.cleaningStatus === '재청소 필요';
          return `<article class="inspection-card"><div class="job-head"><div><div class="job-room">${room.id}호</div><div class="job-type">${room.assignee || '미정'} · ${room.task} · ${room.submittedAt || '방금'} 제출</div></div>${cleaningChip(room)}</div><div class="inspection-cover-strip">${photos.slice(0,2).map(photo => `<div class="inspection-cover">${photoSceneSvg(photo.scene)}</div>`).join('')}<div class="inspection-cover more">+${Math.max(0, photos.length - 2)}장</div></div><div class="inspection-meta-line"><span>인증사진 <strong>${photos.length}장 업로드 완료</strong></span><span>${waitingReclean ? `반려: ${room.rejectedPhotoLabel || '사진 확인'}` : `확인 ${reviewed.length}/${photos.length}`}</span></div>${waitingReclean && room.rejectionReason ? `<div class="reason-preview"><strong>재청소 요청</strong><br>${room.rejectionReason}</div>` : ''}<button class="btn ${waitingReclean ? 'soft' : 'primary'} full" style="margin-top:10px;" data-action="go-inspection-detail" data-id="${room.id}">${waitingReclean ? '반려 사진·사유 보기' : '인증사진 검수 시작'}</button></article>`;
        }).join('')}</div>
      </section>${bottomNav('admin')}`;
    }

    function renderAdminInspectionDetail() {
      const room = state.rooms.find(r => r.id === state.selectedRoomId) || state.rooms.find(r => r.inspection) || state.rooms[0];
      const photos = inspectionPhotosFor(room);
      const selected = Math.min(state.selectedInspectionPhoto[room.id] || 0, Math.max(0, photos.length - 1));
      const current = photos[selected] || photos[0];
      const reviewed = state.photoReviews[room.id] || [];
      const currentReviewed = reviewed.includes(selected);
      const allReviewed = photos.length > 0 && reviewed.length === photos.length;
      const waitingReclean = room.cleaningStatus === '재청소 필요';
      const progress = photos.length ? Math.round(reviewed.length / photos.length * 100) : 0;
      return `${topbar(`${room.id}호 사진 검수`, `${room.assignee || '담당자 미정'} · ${room.submittedAt || '방금'} 제출`, true)}<section class="screen no-nav">
        <div class="detail-hero"><div class="detail-head"><div><div class="detail-room">${room.id}호</div><div class="detail-type">${room.type} · ${room.task}</div></div><div class="detail-price">${room.cleaningFee.toLocaleString()}원<span>승인 후 주급 확정</span></div></div><div class="detail-statuses">${cleaningChip(room)}<span class="status-chip tone-blue">사진 ${photos.length}장</span>${room.candleCount ? `<span class="candle-badge">${icon('candle')} 촛불 ${room.candleCount}개</span>` : ''}</div></div>
        ${waitingReclean ? `<div class="callout" style="margin-bottom:11px;"><strong>재청소 요청 후 대기 중</strong><br>${room.rejectedPhotoLabel || '선택 사진'} · ${room.rejectionReason || '등록된 사유 없음'}<br>메이드가 다시 제출하기 전까지 기존 사진은 이력으로 보존됩니다.</div>` : ''}
        <div class="panel"><div class="panel-body"><div class="info-row"><span class="info-label">메이드</span><span class="info-value">${room.assignee || '미정'}</span></div><div class="info-row"><span class="info-label">작업 시간</span><span class="info-value">${room.workStartedAt || '11:40'}–${room.workFinishedAt || room.submittedAt || '12:30'}</span></div><div class="info-row"><span class="info-label">사진 업로드</span><span class="info-value">${photos.length}/${photos.length}장 완료</span></div><div class="info-row"><span class="info-label">촛불</span><span class="info-value">${room.candleCount ? `${room.candleCount}개 소화·회수 사진 포함` : '없음'}</span></div></div></div>
        <div class="review-progress"><div class="review-progress-head"><div><strong>사진 확인 진행률</strong><span> ${reviewed.length}/${photos.length}</span></div>${!waitingReclean && !allReviewed ? `<button class="text-action" data-action="review-all-photos" data-id="${room.id}">모두 확인</button>` : allReviewed ? `<span class="reviewed-note">${icon('check')} 전체 확인 완료</span>` : ''}</div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div></div>
        <div class="inspection-viewer"><button class="inspection-main-photo" data-action="zoom-inspection-photo" data-id="${room.id}" data-index="${selected}" aria-label="${current?.label || '인증사진'} 확대">${photoSceneSvg(current?.scene)}<span class="zoom-mark">${icon('expand')} 확대</span><span class="photo-overlay"><span><strong>${current?.label || '인증사진'}</strong><span>${current?.capturedAt || '-'} 촬영 · 업로드 완료</span></span><span>${selected + 1}/${photos.length}</span></span></button><div class="review-current"><div class="review-current-copy"><strong>${current?.label || '인증사진'}</strong><span>${currentReviewed ? '관리자가 사진을 확인했습니다.' : '확대해서 상태를 확인해 주세요.'}</span></div>${waitingReclean ? `<span class="staff-status retired">이력 사진</span>` : `<button class="review-check ${currentReviewed ? 'done' : ''}" data-action="toggle-photo-reviewed" data-id="${room.id}" data-index="${selected}">${currentReviewed ? '✓ 확인 완료' : '이 사진 확인'}</button>`}</div></div>
        <div class="photo-thumb-rail">${photos.map((photo, index) => `<button class="photo-thumb ${selected === index ? 'selected' : ''} ${reviewed.includes(index) ? 'reviewed' : ''}" data-action="select-inspection-photo" data-id="${room.id}" data-index="${index}" aria-label="${photo.label}">${photoSceneSvg(photo.scene)}<span>${photo.label}</span></button>`).join('')}</div>
        <div class="section-title-row"><h2 class="section-title">메이드 작업 메모</h2><span class="section-meta">검수 참고</span></div><div class="callout orange">${room.cleanerNote || room.notes || '특이사항 없음.'}</div>
        ${!waitingReclean ? `<div class="sticky-action"><div class="button-row"><button class="btn red" data-action="confirm-reject-inspection" data-id="${room.id}">선택 사진 재청소</button><button class="btn green" data-action="approve-inspection" data-id="${room.id}" ${allReviewed ? '' : 'disabled'}>${allReviewed ? '검수 승인' : `사진 ${photos.length - reviewed.length}장 더 확인`}</button></div></div>` : `<div class="sticky-action"><button class="btn full" disabled>메이드 재제출 대기 중</button></div>`}
      </section>`;
    }

    function renderAdminSettlement() {
      const activeMaids = state.maids.filter(m => m.status === 'active' || m.weeklyExpected > 0 || m.weeklyConfirmed > 0 || m.weeklyPaid > 0);
      const confirmed = activeMaids.reduce((sum, m) => sum + m.weeklyConfirmed, 0);
      const expected = activeMaids.reduce((sum, m) => sum + m.weeklyExpected, 0);
      const paid = activeMaids.reduce((sum, m) => sum + m.weeklyPaid, 0);
      return `${topbar('주급 정산', '이번 주 · 8월 10일–16일')}<section class="screen">
        <div class="money-summary"><small>이번 주 지급 확정</small><strong>${confirmed.toLocaleString()}원</strong><div class="money-split"><div><span>검수 전 예상 포함</span><b>${expected.toLocaleString()}원</b></div><div><span>지급 완료</span><b>${paid.toLocaleString()}원</b></div></div></div>
        <div class="notice"><span class="notice-mark">₩</span><span>주급은 해당 주의 검수 승인 작업만 확정됩니다. 검수 대기·재청소 작업은 예상액으로 남습니다.</span></div>
        <div class="week-tabs"><button class="week-tab">지난주</button><button class="week-tab active">이번 주</button><button class="week-tab">다음 주</button></div>
        <div class="section-title-row"><h2 class="section-title">메이드별 주급</h2><button class="text-action" data-action="export-weekly">엑셀 내보내기</button></div>
        <div>${activeMaids.map(maid => {
          const assigned = state.rooms.filter(r => r.assignee === maid.name && !['입실 준비 완료','작업 없음'].includes(r.cleaningStatus)).length;
          const paidDone = maid.weeklyPaid >= maid.weeklyConfirmed && maid.weeklyConfirmed > 0;
          return `<article class="pay-card"><div class="pay-head"><div class="pay-name"><strong>${maid.name}</strong><span>완료 ${maid.completed}건 · 현재 담당 ${assigned}객실</span></div><div class="pay-total"><strong>${maid.weeklyConfirmed.toLocaleString()}원</strong><span>${paidDone ? '지급 완료' : '지급 확정액'}</span></div></div><div class="pay-grid"><div><label>예상 포함</label><strong>${maid.weeklyExpected.toLocaleString()}원</strong></div><div><label>검수 대기</label><strong>${Math.max(0, maid.weeklyExpected - maid.weeklyConfirmed).toLocaleString()}원</strong></div><div><label>지급액</label><strong>${maid.weeklyPaid.toLocaleString()}원</strong></div></div><div class="staff-actions"><span>정산 주기: 매주</span><button class="btn small ${paidDone ? 'soft' : 'green'}" data-action="pay-weekly" data-id="${maid.id}" ${paidDone ? 'disabled' : ''}>${paidDone ? '지급 완료' : '주급 지급 처리'}</button></div></article>`;
        }).join('')}</div>
        <div class="section-title-row"><h2 class="section-title">이전 주급</h2><span class="section-meta">최근 2주</span></div>
        <div class="panel"><div class="panel-body">${[['8.3–8.9','4명','472,000원','지급 완료'],['7.27–8.2','4명','451,500원','지급 완료']].map(r => `<div class="settlement-row"><div class="settlement-date"><strong>${r[0].split('–')[0]}</strong><span>주차</span></div><div class="settlement-main"><strong>${r[0]}</strong><span>${r[1]}</span></div><div class="settlement-amount"><strong>${r[2]}</strong><span>${r[3]}</span></div></div>`).join('')}</div></div>
      </section>${bottomNav('admin')}`;
    }

    function renderAdminMaids() {
      const active = state.maids.filter(m => m.status === 'active').length;
      const inactive = state.maids.filter(m => m.status === 'inactive').length;
      const retired = state.maids.filter(m => m.status === 'retired').length;
      const visible = state.maids.filter(m => state.maidFilter === 'all' || m.status === state.maidFilter);
      const filters = [['all','전체 이력'],['active','활동 중'],['inactive','비활성'],['retired','퇴사자']];
      return `${topbar('메이드 관리', `${active}명 근무 · ${retired}명 퇴사 이력`)}<section class="screen">
        <div class="summary-strip"><div class="summary-cell blue"><strong>${state.maids.length}</strong><span>전체 이력</span></div><div class="summary-cell green"><strong>${active}</strong><span>활동 중</span></div><div class="summary-cell"><strong>${inactive}</strong><span>비활성</span></div><div class="summary-cell orange"><strong>${retired}</strong><span>퇴사 처리</span></div></div>
        <div class="notice"><span class="notice-mark">${icon('archive')}</span><span>메이드는 영구 삭제하지 않습니다. 퇴사 처리하면 로그인과 신규 일감 선택만 차단하고, 과거 작업·인증사진·주급·컴플레인 이력은 그대로 보존합니다.</span></div>
        <button class="btn primary full" data-action="add-maid" style="margin-top:12px;">${icon('plus')} 메이드 추가</button>
        <div class="filter-rail">${filters.map(([key,label]) => `<button class="chip ${state.maidFilter === key ? 'active' : ''}" data-maid-filter="${key}">${label} ${key === 'all' ? state.maids.length : state.maids.filter(m => m.status === key).length}</button>`).join('')}</div>
        <div class="section-title-row"><h2 class="section-title">근무자·퇴사 이력</h2><span class="section-meta">영구 삭제 없음</span></div>
        <div class="staff-list">${visible.map(maid => {
          const assigned = state.rooms.filter(r => r.assignee === maid.name && reclaimableAssignment(r)).length;
          const statusClass = maidStatusClass(maid.status);
          return `<article class="staff-card"><div class="staff-head"><div class="staff-avatar ${statusClass}">${staffInitial(maid.name)}</div><div class="staff-main"><strong>${maid.name}</strong><span>${maid.loginId} · ${maid.phone}</span></div><span class="staff-status ${statusClass}">${maidStatusLabel(maid.status)}</span></div><div class="staff-metrics"><div class="staff-metric"><label>${maid.status === 'retired' ? '퇴사일' : '현재 담당'}</label><strong>${maid.status === 'retired' ? maid.retiredAt : `${assigned}객실`}</strong></div><div class="staff-metric"><label>이번 주 확정</label><strong>${maid.weeklyConfirmed.toLocaleString()}원</strong></div><div class="staff-metric"><label>누적 완료</label><strong>${maid.completed}건</strong></div></div><div class="staff-actions"><span>${maid.status === 'retired' ? `사유: ${maid.retiredReason || '미등록'}` : maid.note}</span><button class="btn small soft" data-action="go-maid-detail" data-id="${maid.id}">${maid.status === 'retired' ? '이력 보기' : '관리'}</button></div></article>`;
        }).join('')}</div>
      </section>${bottomNav('admin')}`;
    }

    function renderAdminMaidDetail() {
      const maid = state.maids.find(m => m.id === state.selectedMaidId) || state.maids[0];
      const retired = maid.status === 'retired';
      const statusClass = maidStatusClass(maid.status);
      const assignedRooms = state.rooms.filter(r => r.assignee === maid.name && reclaimableAssignment(r));
      const subtitle = maid.status === 'active' ? '현재 로그인과 일감 선택 가능' : maid.status === 'inactive' ? '로그인과 신규 일감 선택 차단' : '계정은 보존되고 로그인만 영구 차단';

    document.addEventListener('click', (event) => {
      const demo = event.target.closest('[data-demo-view]');
      if (demo) {
        const view = demo.dataset.demoView;
        if (view === 'login') { state = defaultState(); render(); closeSheet(); }
        if (view === 'admin-rooms') { state.role = 'admin'; navigate('admin-rooms','admin'); }
        if (view === 'admin-open') { state.role = 'admin'; navigate('admin-open','admin'); }
        if (view === 'admin-inspection') { state.role = 'admin'; navigate('admin-inspection','admin'); }
        if (view === 'admin-maids') { state.role = 'admin'; navigate('admin-maids','admin'); }
        if (view === 'admin-settlement') { state.role = 'admin'; navigate('admin-settlement','admin'); }
        if (view === 'maid-market') { state.role = 'maid'; navigate('maid-market','maid'); }
        if (view === 'password') { state.role = 'admin'; state.selectedRoomId = '1502'; navigate('admin-room-detail','admin'); setTimeout(() => openPasswordSheet('1502'), 50); }
        return;
      }

      const roleTab = event.target.closest('[data-login-role]');
      if (roleTab) { state.loginRole = roleTab.dataset.loginRole; render(); return; }

      const nav = event.target.closest('[data-screen]');
      if (nav) { navigate(nav.dataset.screen, nav.dataset.screen.startsWith('admin') ? 'admin' : 'maid'); return; }

      const filter = event.target.closest('[data-room-filter]');
      if (filter) { state.roomFilter = filter.dataset.roomFilter; render(); return; }

      const maidFilter = event.target.closest('[data-maid-filter]');
      if (maidFilter) { state.maidFilter = maidFilter.dataset.maidFilter; render(); return; }

      const actionEl = event.target.closest('[data-action]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const id = actionEl.dataset.id;

      if (action === 'login') {
        state.role = state.loginRole;
        navigate(state.role === 'admin' ? 'admin-rooms' : 'maid-market', state.role);
        showToast(`${state.role === 'admin' ? '관리자' : '메이드'} 화면으로 로그인했습니다.`);
      }
      if (action === 'logout') { state = defaultState(); closeSheet(); render(); showToast('로그아웃했습니다.'); }
      if (action === 'reset-demo') { state = defaultState(); closeSheet(); render(); showToast('시안을 초기 상태로 되돌렸습니다.'); }
      if (action === 'back') {
        const target = state.previousScreen || (state.role === 'admin' ? 'admin-rooms' : 'maid-tasks');
        state.screen = target;
        state.previousScreen = null;
        state.passwordVisible = false;
        render();
      }
      if (action === 'open-alerts') { showToast('알림 화면 위치입니다.'); }
      if (action === 'go-admin-maids') { navigate('admin-maids','admin'); }
      if (action === 'go-inspection-detail') { state.selectedRoomId = id; navigate('admin-inspection-detail','admin'); }
      if (action === 'go-maid-detail') { state.selectedMaidId = id; navigate('admin-maid-detail','admin'); }
      if (action === 'add-maid') { openMaidSheet(); }
      if (action === 'edit-maid') { openMaidSheet(id); }
      if (action === 'save-maid') {
        const name = (document.getElementById('maidName')?.value || '').trim();
        const loginId = (document.getElementById('maidLoginId')?.value || '').trim();
        const phone = (document.getElementById('maidPhone')?.value || '').trim();
        const note = (document.getElementById('maidNote')?.value || '').trim();
        if (!name || !loginId) { showToast('이름과 로그인 아이디를 입력해 주세요.'); return; }
        const duplicate = state.maids.some(m => m.loginId === loginId && m.id !== id);
        if (duplicate) { showToast('이미 사용 중인 로그인 아이디입니다.'); return; }
        if (id) {
          const maid = state.maids.find(m => m.id === id);
          if (maid) {
            const oldName = maid.name;
            Object.assign(maid, { name, loginId, phone: phone || '미등록', note: note || '메모 없음' });
            state.rooms.forEach(room => { if (room.assignee === oldName) room.assignee = name; });
          }
          closeSheet(); render(); showToast(`${name}님의 정보를 수정했습니다.`);
        } else {
          const numbers = state.maids.map(m => Number(m.id.replace(/\D/g,''))).filter(Number.isFinite);
          const nextNumber = numbers.length ? Math.max(...numbers) + 1 : 1;
          const newId = `maid${String(nextNumber).padStart(2,'0')}`;
          state.maids.push({ id:newId, name, phone:phone || '미등록', loginId, status:'active', joined:'2026.08.14', weeklyConfirmed:0, weeklyExpected:0, weeklyPaid:0, completed:0, approval:'-', note:note || '메모 없음' });
          closeSheet(); render(); showToast(`${name} 메이드 계정을 추가했습니다.`);
        }
      }
      if (action === 'toggle-maid-status') {
        const maid = state.maids.find(m => m.id === id);
        if (!maid || maid.status === 'retired') return;
        maid.status = maid.status === 'active' ? 'inactive' : 'active';
        render(); showToast(`${maid.name} 계정을 ${maid.status === 'active' ? '활성화' : '비활성화'}했습니다.`);
      }
      if (action === 'confirm-retire-maid') { openRetireMaidSheet(id); }
      if (action === 'retire-maid') {
        const maid = state.maids.find(m => m.id === id);
        if (!maid) return;
        const retireDate = document.getElementById('retireDate')?.value || '2026-08-14';
        const reason = document.getElementById('retireReason')?.value || '근무 종료';
        const memo = (document.getElementById('retireMemo')?.value || '').trim();
        state.rooms.forEach(room => {
          if (room.assignee === maid.name && reclaimableAssignment(room)) {
            room.assignee = '';
            room.openForClaim = false;
          }
        });
        maid.status = 'retired';
        maid.retiredAt = retireDate.replaceAll('-', '.');
        maid.retiredReason = reason;
        maid.note = memo || `${reason} · 작업과 주급 이력 보존`;
        closeSheet();
        state.maidFilter = 'retired';
        navigate('admin-maids','admin');
        showToast(`${maid.name}님을 퇴사 처리했습니다. 기존 이력은 보존됩니다.`);
      }
      if (action === 'restore-maid') {
        const maid = state.maids.find(m => m.id === id);
        if (!maid || maid.status !== 'retired') return;
        maid.status = 'inactive';
        maid.note = `퇴사 취소 ${maid.retiredAt || ''} · 재활성화 전 정보 확인 필요`;
        maid.retiredAt = '';
        maid.retiredReason = '';
        render();
        showToast(`${maid.name} 계정을 비활성 상태로 복구했습니다.`);
      }
      if (action === 'pay-weekly') {
        const maid = state.maids.find(m => m.id === id);
        if (!maid) return;
        maid.weeklyPaid = maid.weeklyConfirmed;
        render(); showToast(`${maid.name}님의 이번 주 주급을 지급 완료 처리했습니다.`);
      }
      if (action === 'export-weekly') { showToast('이번 주 주급 내역을 엑셀로 내보냅니다.'); }
      if (action === 'go-admin-room') { state.selectedRoomId = id; navigate('admin-room-detail','admin'); }
      if (action === 'edit-password') { openPasswordSheet(id || state.selectedRoomId); }
      if (action === 'close-sheet') { closeSheet(); }
      if (action === 'random-password') {
        const input = document.getElementById('passwordInput');
        if (input) input.value = randomPassword();
      }
      if (action === 'save-password') {
        const input = document.getElementById('passwordInput');
        const value = (input?.value || '').replace(/\D/g,'');
        if (value.length !== 4) { showToast('비밀번호는 숫자 4자리로 입력해 주세요.'); return; }
        const room = state.rooms.find(r => r.id === state.selectedRoomId);
        if (room) room.password = value;
        closeSheet();
        render();
        showToast(`${state.selectedRoomId}호 비밀번호를 ${value}로 저장했습니다.`);
      }
      if (action === 'toggle-open') {
        const room = state.rooms.find(r => r.id === id);
        if (!room || !claimEligible(room) || room.assignee) return;
        room.openForClaim = !room.openForClaim;
        render();
        showToast(`${id}호 일감을 ${room.openForClaim ? '오픈' : '클로즈'}했습니다.`);
      }
      if (action === 'open-all') {
        state.rooms.forEach(room => { if (claimEligible(room) && !room.assignee) room.openForClaim = true; });
        render(); showToast('선택 가능한 미배정 일감을 모두 오픈했습니다.');
      }
      if (action === 'close-all') {
        state.rooms.forEach(room => { if (!room.assignee) room.openForClaim = false; });
        render(); showToast('미배정 일감을 모두 클로즈했습니다.');
      }
      if (action === 'claim-job') {
        const room = state.rooms.find(r => r.id === id);
        if (!room || !room.openForClaim || room.assignee) { showToast('이미 다른 메이드가 선택했거나 클로즈된 객실입니다.'); return; }
        room.assignee = '김하나';
        room.openForClaim = false;
        render();
        showToast(`${id}호를 내 담당 객실로 선택했습니다.`);
      }
      if (action === 'candle-plus' || action === 'candle-minus') {
        const room = state.rooms.find(r => r.id === id);
        if (!room) return;
        room.candleCount = Math.max(0, Math.min(9, room.candleCount + (action === 'candle-plus' ? 1 : -1)));
        if (room.candleCount === 0) room.candleLocations = '';
        render();
        showToast(`${id}호 촛불 수량을 ${room.candleCount}개로 변경했습니다.`);
      }
      if (action === 'select-inspection-photo') {
        state.selectedInspectionPhoto[id] = Number(actionEl.dataset.index);
        render();
      }
      if (action === 'toggle-photo-reviewed') {
        const index = Number(actionEl.dataset.index);
        const current = state.photoReviews[id] || [];
        state.photoReviews[id] = current.includes(index) ? current.filter(x => x !== index) : [...current, index].sort((a,b) => a-b);
        render();
      }
      if (action === 'review-all-photos') {
        const room = state.rooms.find(r => r.id === id);
        if (!room) return;
        state.photoReviews[id] = inspectionPhotosFor(room).map((_, index) => index);
        render(); showToast(`${id}호 인증사진을 모두 확인 처리했습니다.`);
      }
      if (action === 'zoom-inspection-photo') { openInspectionPhotoSheet(id, Number(actionEl.dataset.index)); }
      if (action === 'confirm-reject-inspection') { openRejectInspectionSheet(id); }
      if (action === 'submit-reject-inspection') {
        const room = state.rooms.find(r => r.id === id);
        if (!room) return;
        const photos = inspectionPhotosFor(room);
        const index = Number(actionEl.dataset.index);
        const reason = document.getElementById('rejectReason')?.value || '청소 미흡';
        const detail = (document.getElementById('rejectDetail')?.value || '').trim();
        room.cleaningStatus = '재청소 필요';
        room.color = 'red';
        room.inspection = true;
        room.rejectedPhotoLabel = photos[index]?.label || '인증사진';
        room.rejectionReason = detail ? `${reason} · ${detail}` : reason;
        room.rejectedAt = '13:15';
        closeSheet();
        state.screen = 'admin-inspection';
        state.previousScreen = null;
        render(); showToast(`${id}호에 ${room.rejectedPhotoLabel} 기준 재청소를 요청했습니다.`);
      }
      if (action === 'switch-to-maid') { navigate('maid-market','maid'); showToast('메이드 화면으로 전환했습니다.'); }
      if (action === 'switch-to-admin') { navigate('admin-rooms','admin'); showToast('관리자 화면으로 전환했습니다.'); }
      if (action === 'go-maid-task') { state.selectedRoomId = id; navigate('maid-task','maid'); }
      if (action === 'toggle-password') { state.passwordVisible = !state.passwordVisible; render(); }
      if (action === 'start-task') {
        const room = state.rooms.find(r => r.id === id);
        if (!room) return;
        state.taskStarted[id] = true;
        room.cleaningStatus = '청소 중';
        room.color = 'orange';
        render();
        showToast(`${id}호 청소를 시작했습니다.`);
      }
      if (action === 'toggle-check') {
        const index = Number(actionEl.dataset.index);
        const current = state.taskChecks[id] || [];
        state.taskChecks[id] = current.includes(index) ? current.filter(x => x !== index) : [...current, index];
        render();
      }
      if (action === 'toggle-photo') {
        const index = Number(actionEl.dataset.index);
        const current = state.taskPhotos[id] || [];
        state.taskPhotos[id] = current.includes(index) ? current.filter(x => x !== index) : [...current, index];
        render();
      }
      if (action === 'complete-task') {
        const room = state.rooms.find(r => r.id === id);
        if (!room) return;
        room.cleaningStatus = '검수 대기';
        room.color = 'orange';
        room.inspection = true;
        room.workStartedAt = room.workStartedAt || '12:20';
        room.workFinishedAt = '13:12';
        room.submittedAt = '13:18';
        room.cleanerNote = state.taskNotes[id] || '특이사항 없음.';
        state.inspectionPhotos[id] = buildInspectionPhotos(room, 13, 4);
        state.photoReviews[id] = [];
        state.selectedInspectionPhoto[id] = 0;
        if (!state.completedTasks.includes(id)) state.completedTasks.unshift(id);
        navigate('maid-completed','maid');
        showToast(`${id}호를 검수 요청했습니다.`);
      }
      if (action === 'approve-inspection') {
        const room = state.rooms.find(r => r.id === id);
        if (!room) return;
        const photos = inspectionPhotosFor(room);
        const reviewed = state.photoReviews[id] || [];
        if (reviewed.length !== photos.length) { showToast(`인증사진 ${photos.length - reviewed.length}장을 더 확인해 주세요.`); return; }
        room.cleaningStatus = '입실 준비 완료';
        room.color = 'green';
        room.inspection = false;
        room.approvedAt = '13:22';
        if (!room.settlementConfirmed) {
          const maid = state.maids.find(m => m.name === room.assignee);
          if (maid) maid.weeklyConfirmed += room.cleaningFee;
          room.settlementConfirmed = true;
        }
        state.screen = 'admin-inspection';
        state.previousScreen = null;
        render(); showToast(`${id}호 사진 검수를 승인하고 주급을 확정했습니다.`);
      }
    });

    document.addEventListener('input', (event) => {
      if (event.target.id === 'passwordInput') event.target.value = event.target.value.replace(/\D/g,'').slice(0,4);
      if (event.target.id === 'taskNote') state.taskNotes[event.target.dataset.roomId] = event.target.value;
      if (event.target.id === 'roomSearch') {
        state.roomSearch = event.target.value;
        const cursor = event.target.selectionStart;
        render();
        const input = document.getElementById('roomSearch');
        if (input) { input.focus(); input.setSelectionRange(cursor, cursor); }
      }
    });

    initializeFromQuery();
    render();
  </script>
</body>
</html>
