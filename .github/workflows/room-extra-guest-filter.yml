name: Apply room extra-guest filter

on:
  push:
    branches:
      - codex/room-extra-guest-filter
    paths:
      - ".github/workflows/room-extra-guest-filter.yml"
      - "scripts/apply-room-extra-guest-filter.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply focused source and policy patch
        run: python3 scripts/apply-room-extra-guest-filter.py

      - name: Start local wireframe
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 > /tmp/castle-serve.log 2>&1 &
          echo $! > /tmp/castle-serve.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/castle-serve.log
          exit 1

      - name: Verify over-base badge and extra-guest filter
        env:
          APP_URL: "http://127.0.0.1:4173/index.html#scenario=0&role=admin&view=rooms&date=2026-08-15&filter=all&type=all&q="
          CDP_PORT: "9222"
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port="$CDP_PORT" \
            --user-data-dir=/tmp/castle-chrome about:blank > /tmp/castle-chrome.log 2>&1 &
          echo $! > /tmp/castle-chrome.pid
          cat > /tmp/room-extra-guest-filter-qa.mjs <<'JS'
          import { writeFileSync } from 'node:fs';

          const cdpPort = Number(process.env.CDP_PORT || 9222);
          const appUrl = process.env.APP_URL;
          if (!appUrl) throw new Error('APP_URL is required');

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const deadline = Date.now() + 20000;
          let target;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`http://127.0.0.1:${cdpPort}/json/list`);
              const tabs = await response.json();
              target = tabs.find((tab) => tab.type === 'page' && tab.webSocketDebuggerUrl);
              if (target) break;
            } catch {}
            await sleep(250);
          }
          if (!target) throw new Error('Chrome DevTools target was not available');

          const ws = new WebSocket(target.webSocketDebuggerUrl);
          const pending = new Map();
          const runtimeErrors = [];
          let sequence = 0;

          await new Promise((resolve, reject) => {
            const timer = setTimeout(() => reject(new Error('CDP WebSocket open timeout')), 10000);
            ws.addEventListener('open', () => { clearTimeout(timer); resolve(); }, { once: true });
            ws.addEventListener('error', (event) => { clearTimeout(timer); reject(event.error || new Error('CDP WebSocket error')); }, { once: true });
          });

          ws.addEventListener('message', (event) => {
            const message = JSON.parse(String(event.data));
            if (message.id) {
              const handler = pending.get(message.id);
              if (!handler) return;
              pending.delete(message.id);
              if (message.error) handler.reject(new Error(`${handler.method}: ${message.error.message}`));
              else handler.resolve(message.result);
              return;
            }
            if (message.method === 'Runtime.exceptionThrown') {
              runtimeErrors.push(message.params?.exceptionDetails?.text || 'Runtime exception');
            }
            if (message.method === 'Log.entryAdded' && ['error', 'warning'].includes(message.params?.entry?.level)) {
              runtimeErrors.push(`${message.params.entry.level}: ${message.params.entry.text}`);
            }
          });

          function send(method, params = {}) {
            const id = ++sequence;
            return new Promise((resolve, reject) => {
              pending.set(id, { resolve, reject, method });
              ws.send(JSON.stringify({ id, method, params }));
            });
          }

          async function evaluate(expression) {
            const result = await send('Runtime.evaluate', { expression, returnByValue: true, awaitPromise: true });
            if (result.exceptionDetails) throw new Error(result.exceptionDetails.text || `Evaluation failed: ${expression}`);
            return result.result?.value;
          }

          async function waitFor(expression, label, timeout = 10000) {
            const end = Date.now() + timeout;
            while (Date.now() < end) {
              if (await evaluate(`Boolean(${expression})`)) return;
              await sleep(100);
            }
            throw new Error(`Timed out waiting for ${label}`);
          }

          async function setViewport(width, height) {
            await send('Emulation.setDeviceMetricsOverride', {
              width,
              height,
              deviceScaleFactor: 1,
              mobile: width <= 768,
              screenWidth: width,
              screenHeight: height,
            });
            await sleep(150);
            const metrics = await evaluate(`(() => ({
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body.scrollWidth,
              hasHorizontalOverflow: document.documentElement.scrollWidth > window.innerWidth + 1 || document.body.scrollWidth > window.innerWidth + 1
            }))()`);
            if (metrics.hasHorizontalOverflow) throw new Error(`Horizontal overflow at ${width}px: ${JSON.stringify(metrics)}`);
            return metrics;
          }

          async function screenshot(path) {
            const result = await send('Page.captureScreenshot', { format: 'png', fromSurface: true, captureBeyondViewport: false });
            writeFileSync(path, Buffer.from(result.data, 'base64'));
          }

          await send('Page.enable');
          await send('Runtime.enable');
          await send('Log.enable');
          await setViewport(390, 1100);
          await send('Page.navigate', { url: appUrl });
          await waitFor(`document.readyState === 'complete' && document.querySelector('[data-room="142"]')`, 'room list and 142 card');

          const identity = await evaluate(`({ title: document.title, url: location.href, cards: document.querySelectorAll('.room-card-v2[data-room]').length })`);
          if (!identity.title.includes('CASTLE THE ART') || !identity.url.includes('view=rooms') || identity.cards < 100) {
            throw new Error(`Unexpected page identity: ${JSON.stringify(identity)}`);
          }
          const overlay = await evaluate(`Boolean(document.querySelector('vite-error-overlay, nextjs-portal, [data-nextjs-dialog-overlay], .webpack-dev-server-client-overlay'))`);
          if (overlay) throw new Error('Framework error overlay is visible');

          const initialState = await evaluate(`(() => {
            const filter = document.querySelector('.concept-filter-row [data-control="room-filter"]');
            return {
              room142Badge: document.querySelector('[data-room="142"] .schedule-priority-badge.guests')?.textContent.trim() || null,
              room117Badge: document.querySelector('[data-room="117"] .schedule-priority-badge.guests')?.textContent.trim() || null,
              filterLabel: [...filter.options].find((option) => option.value === 'extra-guests')?.textContent.trim() || null,
            };
          })()`);
          if (initialState.room142Badge !== null || initialState.room117Badge !== null || initialState.filterLabel !== '인원 추가') {
            throw new Error(`Initial threshold/filter mismatch: ${JSON.stringify(initialState)}`);
          }

          await evaluate(`document.querySelector('[data-room="142"] [data-action="quick-reservation-edit"]').click()`);
          await waitFor(`document.querySelector('#res-guests-value')`, '142 reservation guest stepper');
          const modalInitial = await evaluate(`document.querySelector('#res-guests-value').textContent.trim()`);
          if (modalInitial !== '4명') throw new Error(`142 base guest count mismatch: ${modalInitial}`);
          await evaluate(`document.querySelector('[data-action="reservation-guest-change"][data-delta="1"]').click()`);
          await waitFor(`document.querySelector('#res-guests-value')?.textContent.trim() === '5명'`, '142 guest count increase');
          await evaluate(`document.querySelector('[data-action="save-reservation-v2"]').click()`);
          await waitFor(`!document.querySelector('#res-guests-value') && document.querySelector('[data-room="142"] .schedule-priority-badge.guests')?.textContent.trim() === '5명'`, 'over-base badge update');

          const overBaseBadge = await evaluate(`(() => {
            const badge = document.querySelector('[data-room="142"] .schedule-priority-badge.guests');
            return badge ? { text: badge.textContent.trim(), label: badge.getAttribute('aria-label') } : null;
          })()`);
          if (!overBaseBadge || overBaseBadge.text !== '5명' || overBaseBadge.label !== '숙박 인원 5명') {
            throw new Error(`Over-base badge mismatch: ${JSON.stringify(overBaseBadge)}`);
          }

          await evaluate(`(() => {
            const filter = document.querySelector('.concept-filter-row [data-control="room-filter"]');
            filter.value = 'extra-guests';
            filter.dispatchEvent(new Event('change', { bubbles: true }));
          })()`);
          await waitFor(`document.querySelector('.concept-filter-row [data-control="room-filter"]')?.value === 'extra-guests' && document.querySelectorAll('.room-card-v2[data-room]').length === 1`, 'extra-guest filter result');

          const filteredState = await evaluate(`(() => ({
            filterValue: document.querySelector('.concept-filter-row [data-control="room-filter"]').value,
            rooms: [...document.querySelectorAll('.room-card-v2[data-room]')].map((card) => card.dataset.room),
            badge: document.querySelector('[data-room="142"] .schedule-priority-badge.guests')?.textContent.trim() || null,
          }))()`);
          if (filteredState.filterValue !== 'extra-guests' || JSON.stringify(filteredState.rooms) !== JSON.stringify(['142']) || filteredState.badge !== '5명') {
            throw new Error(`Extra-guest filter mismatch: ${JSON.stringify(filteredState)}`);
          }

          const viewports = [[360, 1000], [390, 1100], [768, 1000], [1440, 1000]];
          const viewportResults = [];
          for (const [width, height] of viewports) {
            viewportResults.push({ width, ...(await setViewport(width, height)) });
            if (width === 390) await screenshot('WIREFRAME/QA/screenshots/admin-room-extra-guests-filter-390.png');
            if (width === 1440) await screenshot('WIREFRAME/QA/screenshots/admin-room-extra-guests-filter-1440.png');
          }

          await setViewport(390, 1100);
          await evaluate(`document.querySelector('[data-room="142"] [data-action="quick-reservation-edit"]').click()`);
          await waitFor(`document.querySelector('#res-guests-value')?.textContent.trim() === '5명'`, '142 edited guest count');
          await evaluate(`document.querySelector('[data-action="reservation-guest-change"][data-delta="-1"]').click()`);
          await waitFor(`document.querySelector('#res-guests-value')?.textContent.trim() === '4명'`, '142 return to base count');
          await evaluate(`document.querySelector('[data-action="save-reservation-v2"]').click()`);
          await waitFor(`!document.querySelector('.room-card-v2[data-room]') && document.querySelector('.inline-empty')`, 'filter empties when room returns to base count');

          await evaluate(`(() => {
            const filter = document.querySelector('.concept-filter-row [data-control="room-filter"]');
            filter.value = 'all';
            filter.dispatchEvent(new Event('change', { bubbles: true }));
          })()`);
          await waitFor(`document.querySelector('[data-room="142"]') && !document.querySelector('[data-room="142"] .schedule-priority-badge.guests')`, 'base-count card returns without badge');

          await sleep(200);
          if (runtimeErrors.length) throw new Error(`Browser console/runtime errors:\n${runtimeErrors.join('\n')}`);
          console.log(JSON.stringify({ identity, initialState, overBaseBadge, filteredState, viewportResults }, null, 2));
          ws.close();
          JS
          node --experimental-websocket /tmp/room-extra-guest-filter-qa.mjs

      - name: Run repository static checks
        run: node scripts/check-workspace.mjs

      - name: Confirm screenshots are PNG files
        run: |
          file WIREFRAME/QA/screenshots/admin-room-extra-guests-filter-390.png
          file WIREFRAME/QA/screenshots/admin-room-extra-guests-filter-1440.png
          test "$(head -c 8 WIREFRAME/QA/screenshots/admin-room-extra-guests-filter-390.png | od -An -t x1 | tr -d ' \n')" = "89504e470d0a1a0a"
          test "$(head -c 8 WIREFRAME/QA/screenshots/admin-room-extra-guests-filter-1440.png | od -An -t x1 | tr -d ' \n')" = "89504e470d0a1a0a"

      - name: Remove one-off automation and commit verified change
        run: |
          rm -f scripts/apply-room-extra-guest-filter.py .github/workflows/room-extra-guest-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "기능: 기준인원 초과 객실을 표시한다"
          git push origin HEAD:${GITHUB_REF_NAME}
