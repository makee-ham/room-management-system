name: Restore maid pay after notification center

on:
  push:
    branches:
      - codex/issue-98-event-notification-center

permissions:
  contents: write

jobs:
  restore-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-98-event-notification-center
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the adjacent maid-pay renderer
        shell: bash
        run: python3 .github/automation/restore-maid-pay-ledger.py

      - name: Run permanent static workspace checks
        shell: bash
        run: node scripts/check-workspace.mjs

      - name: Install Chromium test runtime
        shell: bash
        run: |
          mkdir -p /tmp/castle-playwright
          cd /tmp/castle-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/castle-playwright/node_modules node_modules

      - name: Run notification and maid-pay regression QA
        shell: bash
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 >/tmp/castle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node .github/automation/qa-notification-maid-pay-regression.mjs

      - name: Commit only verified product changes
        shell: bash
        run: |
          rm -f node_modules
          rm -f .github/automation/restore-maid-pay-ledger.py
          rm -f .github/automation/qa-notification-maid-pay-regression.mjs
          rm -f .github/workflows/restore-maid-pay-after-notification.yml
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "수정: 알림 교체 후 메이드 주급 원장을 복원한다"
          git push origin HEAD:codex/issue-98-event-notification-center
