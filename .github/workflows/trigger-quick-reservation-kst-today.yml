name: Trigger KST-today quick reservation fix

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'codex/quick-reservation-kst-today-window'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: codex/quick-reservation-kst-today-window
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start from current main
        shell: bash
        run: |
          git fetch origin main codex/quick-reservation-kst-today-window
          git reset --hard origin/main

      - name: Apply the targeted KST-today window fix
        shell: bash
        run: python3 .github/automation/apply-quick-reservation-kst-today.py

      - name: Run permanent static workspace checks
        shell: bash
        run: node scripts/check-workspace.mjs

      - name: Install Chromium test runtime
        shell: bash
        run: |
          mkdir -p /tmp/castle-playwright
          cd /tmp/castle-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/castle-playwright/node_modules node_modules

      - name: Run rendered date-window interaction QA
        shell: bash
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 >/tmp/castle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node .github/automation/qa-quick-reservation-kst-today.mjs

      - name: Commit verified product changes to the feature branch
        shell: bash
        run: |
          rm -f node_modules
          rm -f .github/workflows/trigger-quick-reservation-kst-today.yml
          rm -f .github/automation/apply-quick-reservation-kst-today.py
          rm -f .github/automation/qa-quick-reservation-kst-today.mjs
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "수정: 간편 예약을 한국 시간 오늘 기준 29일로 계산한다"
          git push --force-with-lease origin HEAD:codex/quick-reservation-kst-today-window
