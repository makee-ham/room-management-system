name: Inspect demo date and maid availability

on:
  push:
    branches:
      - codex/issue-112-demo-date-all-maid-availability

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-112-demo-date-all-maid-availability
      - name: Print exact source blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('WIREFRAME/index.html').read_text(encoding='utf-8')

          def print_function(marker: str, next_markers: list[str] | None = None, max_chars: int = 18000):
              start = text.find(marker)
              print(f'\n===== {marker} at {start} =====')
              if start < 0:
                  return
              candidates = []
              for next_marker in next_markers or ['\n      function ']:
                  pos = text.find(next_marker, start + len(marker))
                  if pos >= 0:
                      candidates.append(pos)
              end = min(candidates) if candidates else min(len(text), start + max_chars)
              print(text[start:min(end, start + max_chars)].replace('\n', '\\n'))

          for marker in [
              'function kstTodayIso',
              'function quickAnchorDate',
              'function quickWindowDates',
              'function refreshQuickReservationActualToday',
              'function renderQuickReservation',
              'function eligibleAssignmentMaids',
              'function availabilityFor(',
              'function availabilityForWorkDate',
              'function renderWorkforce',
              'function renderMaidWorkforce',
          ]:
              print_function(marker)

          for term in [
              "quickReservationAnchorDate:null",
              "quickReservationFollowsToday:true",
              "state.quickReservationAnchorDate=kstTodayIso()",
              "notification-seed-admin-availability",
              "weeklyAvailability:{",
              "availabilityHistory:[",
          ]:
              print(f'\n===== {term} / {text.count(term)} occurrence(s) =====')
              start = 0
              for _ in range(5):
                  idx = text.find(term, start)
                  if idx < 0:
                      break
                  line = text.count('\n', 0, idx) + 1
                  print(f'\n--- line {line} ---')
                  print(text[max(0, idx-900):min(len(text), idx+6000)].replace('\n', '\\n'))
                  start = idx + len(term)
          PY