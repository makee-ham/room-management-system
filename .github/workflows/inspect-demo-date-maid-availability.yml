name: Inspect demo date and maid availability

on:
  push:
    branches:
      - codex/issue-112-demo-date-all-maid-availability

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-112-demo-date-all-maid-availability
      - name: Print assignment eligibility source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('WIREFRAME/index.html').read_text(encoding='utf-8')

          def block(marker: str, chars: int = 16000):
              idx = text.find(marker)
              print(f'\n===== {marker} at {idx} =====')
              if idx >= 0:
                  print(text[idx:idx+chars].replace('\n', '\\n'))

          for marker in [
              'const MAIDS',
              'function maidStatusFor',
              'function maidCanReceiveNewAssignment',
              'function eligibleAssignmentMaids',
              'function performRandomAssignments',
              "if(a==='random-assignments')",
              'function renderRandomAssignmentCard',
              'function randomAssignmentCandidates',
              'function assignmentOptions',
          ]:
              block(marker)

          for term in [
              'maidStatuses:',
              'maidAccountStatuses:',
              'deactivatedMaids:',
              'activeMaids:',
              "assignmentDate:'2026-08-17'",
          ]:
              print(f'\n===== {term} / {text.count(term)} occurrence(s) =====')
              start=0
              for _ in range(8):
                  idx=text.find(term,start)
                  if idx<0: break
                  print(text[max(0,idx-1000):min(len(text),idx+8000)].replace('\n','\\n'))
                  start=idx+len(term)
          PY