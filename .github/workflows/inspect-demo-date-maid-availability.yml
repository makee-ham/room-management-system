name: Inspect demo date and maid availability

on:
  push:
    branches:
      - codex/issue-112-demo-date-all-maid-availability

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-112-demo-date-all-maid-availability
      - name: Print routing and view selectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('WIREFRAME/index.html').read_text(encoding='utf-8')

          for marker in [
              'function render() {',
              'function renderAdmin',
              'function renderQuickReservation',
              'function renderAdminNav',
              "params.get('view')",
              'adminView:',
              "data-nav=",
              "quick-month-today",
          ]:
              idx=text.find(marker)
              print(f'\n===== {marker} at {idx} =====')
              if idx>=0:
                  print(text[max(0,idx-1500):min(len(text),idx+14000)].replace('\n','\\n'))

          print('\n===== admin view literal candidates =====')
          candidates=sorted(set(re.findall(r"adminView(?:===|=|:)['\"]([^'\"]+)['\"]", text)))
          print(candidates)
          print('\n===== view query literal contexts =====')
          for match in re.finditer(r"view", text):
              context=text[max(0,match.start()-220):min(len(text),match.start()+500)]
              if any(token in context for token in ['URLSearchParams','adminView','params.get','data-nav']):
                  print(context.replace('\n','\\n'))
          PY