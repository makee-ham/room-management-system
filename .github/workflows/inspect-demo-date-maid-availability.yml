name: Inspect demo date and maid availability

on:
  push:
    branches:
      - codex/issue-112-demo-date-all-maid-availability

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-112-demo-date-all-maid-availability
      - name: Print quick-booking mobile layout source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('WIREFRAME/index.html').read_text(encoding='utf-8')
          terms = [
              '.quick-booking-page',
              '.quick-grid-shell',
              '.quick-grid-scroller',
              '#quick-grid-scroller',
              '.quick-grid-mobile-header-scroller',
              '.quick-grid-mobile-header-grid',
              '.quick-grid-main',
              '.quick-grid {',
              '@media (max-width:720px)',
              '@media (max-width: 720px)',
          ]
          for term in terms:
              print(f'\n===== {term} / {text.count(term)} occurrence(s) =====')
              start = 0
              for _ in range(12):
                  idx = text.find(term, start)
                  if idx < 0:
                      break
                  line = text.count('\n', 0, idx) + 1
                  print(f'\n--- line {line} ---')
                  print(text[max(0, idx-900):min(len(text), idx+3000)].replace('\n', '\\n'))
                  start = idx + len(term)

          render_start = text.find('function renderQuickReservation')
          render_end = text.find('\n      function ', render_start + 20)
          print(f'\n===== renderQuickReservation {render_start}:{render_end} =====')
          print(text[render_start:render_end].replace('\n', '\\n'))
          PY