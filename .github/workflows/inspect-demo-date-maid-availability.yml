name: Inspect demo date and maid availability

on:
  push:
    branches:
      - codex/issue-112-demo-date-all-maid-availability

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-112-demo-date-all-maid-availability
      - name: Print workforce week navigation source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('WIREFRAME/index.html').read_text(encoding='utf-8')

          for marker in [
              'function renderWorkforce',
              'function availabilityMatrix',
              'function availabilityCell',
              'function renderAvailability',
              'function workHistory',
              "if(a==='availability-week",
              "if(a==='workforce",
          ]:
              idx = text.find(marker)
              print(f'\n===== {marker} at {idx} =====')
              if idx >= 0:
                  print(text[idx:idx+18000].replace('\n','\\n'))

          for term in [
              'workHistoryWeek',
              'availabilityWeek',
              'workforceWeek',
              'selectedAvailability',
              'weeklyAvailability',
              'availabilityHistory',
              'data-action="availability',
              'data-week=',
          ]:
              print(f'\n===== {term} / {text.count(term)} occurrence(s) =====')
              start=0
              for _ in range(12):
                  idx=text.find(term,start)
                  if idx<0: break
                  line=text.count('\n',0,idx)+1
                  print(f'\n--- line {line} ---')
                  print(text[max(0,idx-1200):min(len(text),idx+4500)].replace('\n','\\n'))
                  start=idx+len(term)
          PY