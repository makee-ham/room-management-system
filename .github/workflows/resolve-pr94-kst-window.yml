name: Resolve PR 94 KST daily quick-window conflicts

on:
  push:
    branches:
      - codex/issue-93-kst-daily-quick-window

permissions:
  contents: write

jobs:
  reapply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the rebased PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-93-kst-daily-quick-window
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm branch is based on current main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD

      - name: Reapply the KST daily 29-day window
        shell: bash
        run: |
          python3 -m py_compile .github/automation/apply-quick-reservation-kst-today.py
          python3 .github/automation/apply-quick-reservation-kst-today.py

      - name: Run permanent static workspace checks
        shell: bash
        run: node scripts/check-workspace.mjs

      - name: Install Chromium test runtime
        shell: bash
        run: |
          mkdir -p /tmp/castle-playwright
          cd /tmp/castle-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/castle-playwright/node_modules node_modules

      - name: Run rendered date-window interaction QA
        shell: bash
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 >/tmp/castle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node .github/automation/qa-quick-reservation-kst-today.mjs

      - name: Commit the verified conflict resolution
        shell: bash
        run: |
          rm -f node_modules
          rm -f .github/workflows/resolve-pr94-kst-window.yml
          rm -f .github/workflows/trigger-quick-reservation-kst-today.yml
          rm -f .github/automation/apply-quick-reservation-kst-today.py
          rm -f .github/automation/qa-quick-reservation-kst-today.mjs
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "수정: PR #94를 최신 main 기준으로 재적용한다"
          git push origin HEAD:codex/issue-93-kst-daily-quick-window
