name: Apply demo date and all-maid availability

on:
  push:
    branches:
      - codex/issue-112-demo-date-all-maid-availability

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-112-demo-date-all-maid-availability
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the mock-date and workforce fixtures
        shell: bash
        run: |
          python3 -m py_compile .github/automation/fix-demo-patcher-runtime.py
          python3 .github/automation/fix-demo-patcher-runtime.py
          python3 -m py_compile .github/automation/apply-demo-date-all-maid-availability.py
          python3 -m py_compile .github/automation/fix-demo-date-doc-contracts.py
          python3 .github/automation/apply-demo-date-all-maid-availability.py
          python3 .github/automation/fix-demo-date-doc-contracts.py
          git diff --check

      - name: Run permanent static workspace checks
        shell: bash
        run: node scripts/check-workspace.mjs

      - name: Install Chromium test runtime
        shell: bash
        run: |
          mkdir -p /tmp/castle-playwright
          cd /tmp/castle-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/castle-playwright/node_modules node_modules

      - name: Run rendered quick-booking, workforce, and random-assignment QA
        shell: bash
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 >/tmp/castle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node .github/automation/qa-demo-date-all-maid-availability.mjs

      - name: Commit only verified product changes
        shell: bash
        run: |
          rm -f node_modules
          rm -rf .github/automation/__pycache__
          rm -f .github/workflows/inspect-demo-date-maid-availability.yml
          rm -f .github/automation/apply-demo-date-all-maid-availability.py
          rm -f .github/automation/fix-demo-patcher-runtime.py
          rm -f .github/automation/fix-demo-date-doc-contracts.py
          rm -f .github/automation/qa-demo-date-all-maid-availability.mjs
          rm -f .github/workflows/apply-demo-date-all-maid-availability.yml
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "수정: 간편 예약 기준일과 전체 메이드 근무표를 맞춘다"
          git push origin HEAD:codex/issue-112-demo-date-all-maid-availability
