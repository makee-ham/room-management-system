name: Finalize issue 119 branch

on:
  push:
    branches:
      - feature/issue-119-role-cleaning-long-stay
    paths:
      - .github/workflows/issue-119-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-119-role-cleaning-long-stay
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove temporary implementation infrastructure
        run: |
          rm -rf .issue119
          rm -f \
            .github/workflows/issue-119-apply.yml \
            .github/workflows/issue-119-inspect.yml \
            .github/workflows/issue-119-sync-main.yml \
            .github/workflows/issue-119-finalize.yml \
            scripts/apply_issue_119.py \
            scripts/apply_issue_119_v2.py \
            scripts/bootstrap_issue_119_apply.py \
            scripts/issue_119_inspect.py \
            scripts/post_issue_119_v2.py \
            scripts/report-workspace-mismatches.mjs

      - name: Verify issue-specific contracts
        run: node scripts/check-issue-119.mjs

      - name: Verify repository workspace
        run: node scripts/check-workspace.mjs

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit clean implementation branch
        shell: bash
        run: |
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove issue 119 implementation scaffolding"
          git push origin HEAD:feature/issue-119-role-cleaning-long-stay
