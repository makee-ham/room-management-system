# GitHub Pages deployment for the static WIREFRAME app
name: Deploy room management app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "WIREFRAME/**"
      - "scripts/check-workspace.mjs"
      - "scripts/check-pwa.mjs"
      - "scripts/check-api-integration.mjs"
      - "scripts/build-pages-artifact.mjs"
      - "manifest.json"
      - "SHA256SUMS.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the actual GitHub Pages origin
        id: pages
        uses: actions/configure-pages@v5

      - name: Verify static workspace and PWA contracts
        run: node scripts/check-workspace.mjs

      - name: Verify production API contract
        env:
          RMS_API_BASE_URL: ${{ vars.RMS_API_BASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RMS_TEST_ORIGIN: ${{ vars.RMS_APP_ORIGIN }}
          RMS_ACTUAL_APP_ORIGIN: ${{ steps.pages.outputs.origin }}
          RMS_REQUIRE_DEDICATED_ORIGIN: "true"
        run: node scripts/check-api-integration.mjs

      - name: Build browser-safe Pages artifact
        env:
          RMS_API_BASE_URL: ${{ vars.RMS_API_BASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          RMS_SESSION_PERSISTENCE: local
        run: node scripts/build-pages-artifact.mjs

      - name: Upload WIREFRAME as Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
