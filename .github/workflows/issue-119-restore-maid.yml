name: Restore issue 119 maid dashboard

on:
  push:
    branches:
      - feature/issue-119-role-cleaning-long-stay
    paths:
      - .github/workflows/issue-119-restore-maid.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-119-restore-maid-dashboard
  cancel-in-progress: false

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-119-role-cleaning-long-stay
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore maid dashboard and tighten long-stay behavior
        run: python3 scripts/fix_issue_119_maid_dashboard.py

      - name: Verify issue 119 contracts and JavaScript syntax
        run: node scripts/check-issue-119.mjs

      - name: Verify repository workspace
        run: node scripts/check-workspace.mjs

      - name: Check patch hygiene
        run: git diff --check

      - name: Serve wireframe and verify restored routes
        shell: bash
        run: |
          python3 scripts/serve.py >/tmp/room-management-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/room-management-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/room-management-index.html
          grep -q 'function renderMaidMy()' /tmp/room-management-index.html
          grep -q 'function myJobCard(no)' /tmp/room-management-index.html
          grep -q "roomHasOpenEndedLongStay(room.no)" /tmp/room-management-index.html
          grep -q '종료일 미정' /tmp/room-management-index.html

      - name: Remove temporary patch tooling
        run: |
          git rm scripts/fix_issue_119_maid_dashboard.py
          git rm .github/workflows/issue-119-restore-maid.yml

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add WIREFRAME/index.html SHA256SUMS.txt manifest.json scripts/check-issue-119.mjs
          git commit -m "fix: restore maid work dashboard after schedule disclosure"
          git push origin HEAD:feature/issue-119-role-cleaning-long-stay
