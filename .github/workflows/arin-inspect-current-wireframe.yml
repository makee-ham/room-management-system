name: Arin inspect current wireframe

on:
  push:
    branches:
      - codex/maid-other-10-and-mobile-today-320
    paths:
      - .github/workflows/arin-inspect-current-wireframe.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect repository source
        shell: bash
        run: |
          mkdir -p /tmp/arin-repo
          rsync -a --exclude=.git ./ /tmp/arin-repo/
      - name: Upload repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: arin-repository-source
          path: /tmp/arin-repo
          retention-days: 1
