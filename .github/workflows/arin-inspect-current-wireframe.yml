name: Apply and verify maid other-photo and mobile today fixes

on:
  push:
    branches:
      - codex/maid-other-10-and-mobile-today-320
    paths:
      - .github/workflows/arin-inspect-current-wireframe.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: codex/maid-other-10-and-mobile-today-320
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore targeted automation scripts
        shell: bash
        run: |
          mkdir -p .github/automation
          cat .github/automation-payload/apply.* | base64 --decode | gzip --decompress > .github/automation/apply-arin-feature.py
          cat .github/automation-payload/verify.* | base64 --decode | gzip --decompress > .github/automation/verify-arin-feature.py

      - name: Apply the product changes
        shell: bash
        run: python3 .github/automation/apply-arin-feature.py

      - name: Install browser QA runtime
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium

      - name: Run rendered interaction and responsive QA
        shell: bash
        run: python3 .github/automation/verify-arin-feature.py

      - name: Run permanent repository checks
        shell: bash
        run: |
          node scripts/check-workspace.mjs
          git diff --check

      - name: Commit the verified product changes
        shell: bash
        run: |
          rm -rf .github/automation .github/automation-payload
          rm -f .github/workflows/arin-inspect-current-wireframe.yml
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "메이드 기타 사진 10장과 모바일 오늘 버튼 개선"
          git push origin HEAD:codex/maid-other-10-and-mobile-today-320
