name: ChatGPT verified feature runner

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'codex/issue-63-quick-booking-29-day' ||
       github.head_ref == 'codex/issue-64-inspection-template-parity' ||
       github.head_ref == 'codex/issue-65-idempotency-guards')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start from current main
        shell: bash
        run: |
          git fetch origin main "${GITHUB_HEAD_REF}"
          git reset --hard origin/main

      - name: Select feature scripts
        id: feature
        shell: bash
        run: |
          case "${GITHUB_HEAD_REF}" in
            codex/issue-63-quick-booking-29-day)
              echo "patch=.github/automation/issue-63-quick-booking-29-day.py" >> "$GITHUB_OUTPUT"
              echo "qa=.github/automation/issue-63-quick-booking-29-day.mjs" >> "$GITHUB_OUTPUT"
              echo "message=기능: 간편 예약을 오늘 기준 29일 보기로 전환한다" >> "$GITHUB_OUTPUT"
              ;;
            codex/issue-64-inspection-template-parity)
              echo "patch=.github/automation/issue-64-inspection-template-parity.py" >> "$GITHUB_OUTPUT"
              echo "qa=.github/automation/issue-64-inspection-template-parity.mjs" >> "$GITHUB_OUTPUT"
              echo "message=개선: 관리자 검수를 메이드 청소 템플릿과 통일한다" >> "$GITHUB_OUTPUT"
              ;;
            codex/issue-65-idempotency-guards)
              echo "patch=.github/automation/issue-65-idempotency-guards.py" >> "$GITHUB_OUTPUT"
              echo "qa=.github/automation/issue-65-idempotency-guards.mjs" >> "$GITHUB_OUTPUT"
              echo "message=안정성: 예약 청소 급여 저장의 중복 반영을 차단한다" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_HEAD_REF}" >&2
              exit 1
              ;;
          esac

      - name: Apply targeted feature changes
        shell: bash
        run: |
          python3 "${{ steps.feature.outputs.patch }}"
          if [ "${GITHUB_HEAD_REF}" = "codex/issue-63-quick-booking-29-day" ]; then
            python3 .github/automation/issue-63-qa-copy-fix.py
          fi
          if [ "${GITHUB_HEAD_REF}" = "codex/issue-65-idempotency-guards" ]; then
            python3 .github/automation/issue-65-render-state-ref.py
          fi

      - name: Run static workspace checks
        shell: bash
        run: node scripts/check-workspace.mjs

      - name: Install Chromium test runtime
        shell: bash
        run: |
          mkdir -p /tmp/castle-playwright
          cd /tmp/castle-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/castle-playwright/node_modules node_modules

      - name: Run rendered interaction QA
        shell: bash
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 >/tmp/castle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node "${{ steps.feature.outputs.qa }}"

      - name: Remove temporary runner after the final feature
        if: github.head_ref == 'codex/issue-65-idempotency-guards'
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-feature-runner.yml
          rm -f .github/automation/issue-63-quick-booking-29-day.py
          rm -f .github/automation/issue-63-quick-booking-29-day.mjs
          rm -f .github/automation/issue-63-qa-copy-fix.py
          rm -f .github/automation/issue-64-inspection-template-parity.py
          rm -f .github/automation/issue-64-inspection-template-parity.mjs
          rm -f .github/automation/issue-65-idempotency-guards.py
          rm -f .github/automation/issue-65-idempotency-guards.mjs
          rm -f .github/automation/issue-65-render-state-ref.py

      - name: Commit verified changes to the feature branch
        shell: bash
        run: |
          rm -f node_modules
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "${{ steps.feature.outputs.message }}"
          git push --force-with-lease origin "HEAD:${GITHUB_HEAD_REF}"
