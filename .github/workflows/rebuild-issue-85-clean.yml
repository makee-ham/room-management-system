name: Rebuild issue 85 clean branch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/issue-85-room-state-conflict-matrix'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out existing feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/issue-85-room-state-conflict-matrix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild from clean main with product files only
        shell: bash
        run: |
          git fetch origin main codex/issue-85-room-state-conflict-matrix
          OLD_HEAD=$(git rev-parse HEAD)
          CLEAN_BASE=f764ca6d3262af481570f5fdcdefd3fcc4eca65b
          git diff "$CLEAN_BASE" "$OLD_HEAD" -- \
            DOCS/20_ROOM_STATE_FACET_POLICY.md \
            SHA256SUMS.txt \
            WIREFRAME/index.html \
            manifest.json \
            scripts/check-workspace.mjs > /tmp/issue-85-product.patch
          test -s /tmp/issue-85-product.patch
          git reset --hard "$CLEAN_BASE"
          git apply --index /tmp/issue-85-product.patch
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git commit -m "보강: 점유·청소·퇴실점검의 비정상 조합을 차단한다"
          git push --force-with-lease origin HEAD:codex/issue-85-room-state-conflict-matrix
