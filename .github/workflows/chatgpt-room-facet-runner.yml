name: ChatGPT room facet runner

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/issue-81-faceted-room-status'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/issue-81-faceted-room-status
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start from current main
        shell: bash
        run: |
          git fetch origin main codex/issue-81-faceted-room-status
          git reset --hard origin/main

      - name: Apply independent room-state facets
        shell: bash
        run: |
          python3 .github/automation/issue-81-room-facets.py
          python3 .github/automation/issue-81-runtime-compat.py
          python3 .github/automation/issue-81-static-compat.py

      - name: Run static workspace checks
        shell: bash
        run: node scripts/check-workspace.mjs

      - name: Install Chromium test runtime
        shell: bash
        run: |
          mkdir -p /tmp/castle-playwright
          cd /tmp/castle-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/castle-playwright/node_modules node_modules

      - name: Run rendered interaction QA
        shell: bash
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 >/tmp/castle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node .github/automation/issue-81-room-facets.mjs

      - name: Remove temporary automation files
        shell: bash
        run: |
          rm -f node_modules
          rm -f .issue-81-trigger
          rm -f .room-state-template-inspection-trigger
          rm -f .github/automation/issue-81-diagnose.py
          rm -f .github/automation/issue-81-room-facets.py
          rm -f .github/automation/issue-81-room-facets.mjs
          rm -f .github/automation/issue-81-runtime-compat.py
          rm -f .github/automation/issue-81-static-compat.py
          rm -f .github/automation/inspect-room-state-and-template.py
          rm -f .github/workflows/inspect-room-state-and-template.yml
          rm -f .github/workflows/chatgpt-room-facet-runner.yml

      - name: Commit verified changes to the feature branch
        shell: bash
        run: |
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "개선: 투숙·청소·점검 상태를 독립 축으로 표시한다"
          git push --force-with-lease origin HEAD:codex/issue-81-faceted-room-status
