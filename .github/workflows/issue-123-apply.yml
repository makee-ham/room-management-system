name: Apply and verify issue 123

on:
  push:
    branches:
      - fix/issue-123-login-reservation-extension
    paths:
      - scripts/patch_issue_123.py
      - scripts/patch_issue_123_workspace.py
      - .github/workflows/issue-123-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-123-login-reservation-extension
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: fix/issue-123-login-reservation-extension
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply login and reservation policy changes
        run: |
          python3 scripts/patch_issue_123.py
          python3 scripts/patch_issue_123_workspace.py

      - name: Verify issue contracts and JavaScript syntax
        run: |
          node scripts/check-issue-123.mjs
          node scripts/check-issue-119.mjs

      - name: Verify repository workspace
        run: node scripts/check-workspace.mjs

      - name: Check patch hygiene
        run: git diff --check

      - name: Serve wireframe and verify response
        shell: bash
        run: |
          python3 scripts/serve.py >/tmp/issue-123-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/tmp/issue-123-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/issue-123-index.html
          grep -q 'function reservationCanEditCurrentStay' /tmp/issue-123-index.html
          grep -q '투숙 중 예약은 수정 가능' /tmp/issue-123-index.html
          if grep -q '아이디에 따라 화면이 분리됩니다' /tmp/issue-123-index.html; then
            echo 'Removed login guide is still visible.' >&2
            exit 1
          fi
          if grep -q '역할 간 직접 전환 없음' /tmp/issue-123-index.html; then
            echo 'Removed role-switch card is still visible.' >&2
            exit 1
          fi

      - name: Remove temporary patch tooling
        run: rm -f scripts/patch_issue_123.py scripts/patch_issue_123_workspace.py .github/workflows/issue-123-apply.yml

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes"
            exit 0
          fi
          git commit -m "fix: simplify login and allow current-stay extensions"
          git push origin HEAD:fix/issue-123-login-reservation-extension
