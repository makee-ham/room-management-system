name: Trigger mobile sticky date header and total-room filter

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'codex/mobile-sticky-date-total-filter'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the working branch
        uses: actions/checkout@v6
        with:
          ref: codex/mobile-sticky-date-total-filter
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve one-time patch and QA scripts
        shell: bash
        run: |
          cp .github/automation/apply-mobile-sticky-date-total-filter.py /tmp/apply-mobile-sticky-date-total-filter.py
          cp .github/automation/qa-mobile-sticky-date-total-filter.mjs /tmp/qa-mobile-sticky-date-total-filter.mjs

      - name: Start from the current main branch
        shell: bash
        run: |
          git fetch origin main codex/mobile-sticky-date-total-filter
          git reset --hard origin/main
          mkdir -p .github/automation
          cp /tmp/apply-mobile-sticky-date-total-filter.py .github/automation/apply-mobile-sticky-date-total-filter.py
          cp /tmp/qa-mobile-sticky-date-total-filter.mjs .github/automation/qa-mobile-sticky-date-total-filter.mjs

      - name: Apply targeted UI changes
        shell: bash
        run: python3 .github/automation/apply-mobile-sticky-date-total-filter.py

      - name: Install Chromium test runtime
        shell: bash
        run: |
          mkdir -p /tmp/castle-playwright
          cd /tmp/castle-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/castle-playwright/node_modules node_modules

      - name: Run rendered interaction QA
        shell: bash
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 >/tmp/castle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node .github/automation/qa-mobile-sticky-date-total-filter.mjs

      - name: Run static workspace checks
        shell: bash
        run: node scripts/check-workspace.mjs

      - name: Commit verified changes to the feature branch
        shell: bash
        run: |
          rm -f node_modules
          rm -f .github/workflows/trigger-mobile-sticky-date-total-filter.yml
          rm -f .github/workflows/apply-mobile-sticky-date-total-filter.yml
          rm -f .github/automation/apply-mobile-sticky-date-total-filter.py
          rm -f .github/automation/qa-mobile-sticky-date-total-filter.mjs
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "개선: 모바일 예약 날짜를 고정하고 전체 객실 필터를 추가한다"
          git push --force-with-lease origin HEAD:codex/mobile-sticky-date-total-filter
