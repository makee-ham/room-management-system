name: Inspect issue 91 cleaning request flow

on:
  push:
    branches:
      - codex/issue-91-room-cleaning-request-flow
    paths:
      - '.github/automation/inspect-issue-91-cleaning-flow.py'
      - '.github/workflows/inspect-issue-91-cleaning-flow.yml'
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'push' || github.head_ref == 'codex/issue-91-room-cleaning-request-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/issue-91-room-cleaning-request-flow
          fetch-depth: 0
      - name: Print relevant source contracts
        run: python3 .github/automation/inspect-issue-91-cleaning-flow.py
      - name: Stop after diagnostic output
        run: exit 1
