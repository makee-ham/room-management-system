name: Inspect room state and template contracts

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/inspect-room-state-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Print relevant contracts
        run: python3 .github/automation/inspect-room-state-and-template.py
      - name: Stop after inspection
        run: exit 1
