name: Inspect issue 114 assignment week and fixtures

on:
  push:
    branches:
      - codex/issue-114-assignment-week-and-varied-fixtures

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-114-assignment-week-and-varied-fixtures

      - name: Inspect assignment week and fixture source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('WIREFRAME/index.html').read_text(encoding='utf-8')

          def function_block(name: str, max_chars: int = 22000):
              marker = f'function {name}'
              start = text.find(marker)
              print(f'\n===== FUNCTION {name} at {start} =====')
              if start < 0:
                  return
              candidates = [p for p in [text.find('\n      function ', start + len(marker)), text.find('\n      const ', start + len(marker))] if p >= 0]
              end = min(candidates) if candidates else min(len(text), start + max_chars)
              print(text[start:min(end, start + max_chars)].replace('\n', '\\n'))

          def around(marker: str, before: int = 1200, after: int = 9000, limit: int = 6):
              print(f'\n===== MARKER {marker!r} count={text.count(marker)} =====')
              pos = 0
              for _ in range(limit):
                  idx = text.find(marker, pos)
                  if idx < 0:
                      break
                  line = text.count('\n', 0, idx) + 1
                  print(f'\n--- line {line}, offset {idx} ---')
                  print(text[max(0, idx-before):min(len(text), idx+after)].replace('\n', '\\n'))
                  pos = idx + len(marker)

          for name in [
              'availabilityFor',
              'availabilityForWorkDate',
              'availabilityCell',
              'renderAvailabilityMatrix',
              'assignmentDayIndex',
              'assignmentCountsForDate',
              'eligibleAssignmentMaids',
              'assignmentTargetsForDate',
              'assignmentTargets',
              'renderAssignmentDashboard',
              'renderRandomAssignmentCard',
              'createRandomAssignment',
              'roomIsOnHold',
              'cleaningTargetCanAdjust',
              'syncAssignmentDateForCleaningTab',
              'applyOperationalDate',
          ]:
              function_block(name)

          for marker in [
              'const INITIAL_MANUAL_ASSIGNMENT_TARGETS',
              'const SCALE_ASSIGNMENT_TARGETS',
              'const WORK_HISTORY_FIXTURES',
              'weeklyAvailability:{',
              'availabilityHistory:[',
              "case 2:",
              "assignmentDate:'2026-08-17'",
              "cleaningTab:'assignment-today'",
              "const ROOMS",
              "const INITIAL_RESERVATIONS",
              "function initialReservationState",
              "function initialReservationDrafts",
              "roomStopped:{",
              "candles:{",
              "jobs:{",
              "assignments:{",
          ]:
              around(marker)

          print('\n===== STATIC CHECKS NEAR ISSUE-112 CONTRACTS =====')
          checks = Path('scripts/check-workspace.mjs').read_text(encoding='utf-8')
          for marker in ['All-maid availability and work-history fixture contracts', 'workforce matrix', '2026-08-17', 'renderAvailabilityMatrix']:
              idx = checks.find(marker)
              print(f'\n--- {marker} at {idx} ---')
              if idx >= 0:
                  print(checks[max(0, idx-2200):min(len(checks), idx+6000)].replace('\n', '\\n'))
          PY