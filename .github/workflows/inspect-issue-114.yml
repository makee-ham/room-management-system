name: Inspect issue 114 assignment week and fixtures

on:
  push:
    branches:
      - codex/issue-114-assignment-week-and-varied-fixtures

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-114-assignment-week-and-varied-fixtures
          fetch-depth: 0

      - name: Extract exact source units
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('WIREFRAME/index.html').read_text(encoding='utf-8')
          target_dir=Path('issue-114-inspection')
          target_dir.mkdir(exist_ok=True)

          def extract_function(name):
            marker=f'function {name}'
            start=text.find(marker)
            if start<0:return f'===== {name}: missing =====\n'
            brace=text.find('{',start);depth=0;quote=None;escape=False
            for i in range(brace,len(text)):
              ch=text[i]
              if quote:
                if escape:escape=False
                elif ch=='\\':escape=True
                elif ch==quote:quote=None
              elif ch in "'\"`":quote=ch
              elif ch=='{':depth+=1
              elif ch=='}':
                depth-=1
                if depth==0:return text[start:i+1]+'\n'
            return text[start:start+24000]+'\n'

          groups={
            'availability.txt':[
              'availabilityFor','availabilityForWorkDate','assignmentDayIndex','availabilityCell',
              'assignmentDateForCleaningTab','syncAssignmentDateForCleaningTab','renderAvailabilityMatrix',
              'assignmentCountsForDate','eligibleAssignmentMaids','assignmentOptions'
            ],
            'targets.txt':[
              'automaticAssignmentTargets','liveAssignmentTargetsForState','liveAssignmentTargets',
              'assignmentTargetsForDate','assignmentTargets','initializeCleaningTargetLedger',
              'cleaningTargetCanAdjust','cleaningTargetAdjustmentBlock','roomIsOnHold','roomDataIssue',
              'assignmentContext','assignmentPricingSnapshot','assignmentTargetElevator'
            ],
            'random.txt':[
              'renderRandomAssignmentCard','randomAssignmentContextSignature','assignmentRandomGenerator',
              'randomAssignmentTrial','createRandomAssignment','randomAssignmentStateMatches',
              'restoreRandomAssignment','discardStaleRandomAssignment','assignmentCanSave'
            ],
            'render.txt':[
              'renderAssignmentDashboard','assignmentScheduleMarkup','assignmentSourceMarkup',
              'assignmentAdjustmentMarkup','renderMaidOrderBoardContent','renderCleaningHub','renderWorkforce'
            ],
            'scenario.txt':['baseState','makeScenario','resetRoomCatalogState']
          }
          for filename,names in groups.items():
            body=[]
            for name in names:
              body.append(f'\n===== {name} =====\n')
              body.append(extract_function(name))
            target_dir.joinpath(filename).write_text(''.join(body),encoding='utf-8')

          def contexts(markers,filename,before=2200,after=12000):
            chunks=[]
            for marker in markers:
              chunks.append(f'\n===== {marker!r} / {text.count(marker)} =====\n')
              pos=0
              for index in range(min(text.count(marker),12)):
                hit=text.find(marker,pos)
                if hit<0:break
                chunks.append(text[max(0,hit-before):min(len(text),hit+after)]+'\n')
                pos=hit+len(marker)
            target_dir.joinpath(filename).write_text(''.join(chunks),encoding='utf-8')

          contexts([
            'SCALE_ASSIGNMENT_TARGETS','weeklyAvailability:','availabilityHistory:',
            'manualAssignmentTargets:','cleaningTargets:','assignmentNoticesByDate:',
            'assignmentDrafts:','assignmentSchedulesByDate:'
          ],'fixtures.txt')
          contexts([
            'const ROOM','ROOM_TYPE','ROOM_NUM','roomDataIssue','dataIssue:',
            "jobs:{",'roomStopped:','candles:','occupancyOverride','plannedCheckoutAt',
            'earlyCheckin','lateCheckout','special','remark'
          ],'room-state.txt',before=1800,after=10000)
          contexts([
            "if(a==='random-assignments')","if(a==='undo-random-assignment')",
            "if(c==='assignment-maid')",'data-action="random-assignments"',
            'data-action="undo-random-assignment"'
          ],'actions.txt',before=1600,after=9000)
          PY

      - name: Commit inspection units
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-114-inspection
          git diff --cached --quiet && exit 0
          git commit -m "chore: inspect issue 114 room catalog"
          git push origin HEAD:codex/issue-114-assignment-week-and-varied-fixtures
