name: Inspect issue 114 assignment week and fixtures

on:
  push:
    branches:
      - codex/issue-114-assignment-week-and-varied-fixtures

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-114-assignment-week-and-varied-fixtures
          fetch-depth: 0

      - name: Build targeted source inspection report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('WIREFRAME/index.html')
          text = source.read_text(encoding='utf-8')
          out = []

          def line_no(offset):
              return text.count('\n', 0, max(0, offset)) + 1

          def function_body(name):
              marker = f'function {name}'
              start = text.find(marker)
              out.append(f'\n===== FUNCTION {name} · line {line_no(start) if start >= 0 else "missing"} =====')
              if start < 0:
                  return
              brace = text.find('{', start)
              depth = 0
              quote = None
              escape = False
              for index in range(brace, len(text)):
                  ch = text[index]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  elif ch in "'\"`":
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          out.append(text[start:index+1])
                          return
              out.append(text[start:start+16000])

          def context(marker, before=1400, after=4200):
              start = text.find(marker)
              out.append(f'\n===== CONTEXT {marker!r} · line {line_no(start) if start >= 0 else "missing"} =====')
              if start >= 0:
                  out.append(text[max(0,start-before):min(len(text),start+after)])

          out.append(f'SOURCE chars={len(text)} lines={text.count(chr(10))+1}')
          for name in [
              'availabilityFor',
              'availabilityForWorkDate',
              'availabilityCell',
              'assignmentDayIndex',
              'assignmentCountsForDate',
              'renderAvailabilityMatrix',
              'eligibleAssignmentMaids',
              'assignmentRandomGenerator',
              'randomAssignmentTrial',
              'createRandomAssignment',
              'renderRandomAssignmentCard',
              'filteredAssignmentTargets',
              'renderAssignmentDashboard',
              'randomAssignmentContextSignature',
              'randomAssignmentStateMatches',
              'cleaningTargetCanAdjust',
          ]:
              function_body(name)

          for marker in [
              'const INITIAL_MANUAL_ASSIGNMENT_TARGETS',
              'const SCALE_ASSIGNMENT_TARGETS',
              "case 2:",
              "selectedDate:'2026-08-15'",
              'weeklyAvailability:{',
              'availabilityHistory:[',
          ]:
              context(marker)

          report = Path('issue-114-source-inspection.txt')
          report.write_text('\n'.join(out), encoding='utf-8')
          print(f'wrote {report} ({report.stat().st_size} bytes)')
          PY

      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-114-source-inspection.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh issue 114 source inspection"
          git push origin HEAD:codex/issue-114-assignment-week-and-varied-fixtures