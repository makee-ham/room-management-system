name: Inspect issue 114 assignment week and fixtures

on:
  push:
    branches:
      - codex/issue-114-assignment-week-and-varied-fixtures

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-114-assignment-week-and-varied-fixtures

      - name: Inspect target construction and block rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('WIREFRAME/index.html').read_text(encoding='utf-8')

          def function_block(name: str, max_chars: int = 26000):
              marker = f'function {name}'
              start = text.find(marker)
              print(f'\n===== FUNCTION {name} at {start} =====')
              if start < 0:
                  return
              candidates = [p for p in [text.find('\n      function ', start + len(marker)), text.find('\n      const ', start + len(marker))] if p >= 0]
              end = min(candidates) if candidates else min(len(text), start + max_chars)
              print(text[start:min(end, start + max_chars)].replace('\n', '\\n'))

          for name in [
              'liveAssignmentTargetsForState',
              'automaticCheckoutAssignmentTargets',
              'checkoutAssignmentTarget',
              'cleaningAssignmentForReservation',
              'manualAssignmentTargetsForDate',
              'stayoverAssignmentTargetsForDate',
              'assignmentFor',
              'targetPlanDate',
              'targetEffectiveDate',
              'cleaningTargetAdjustmentBlock',
              'roomOperationalBlockReason',
              'roomPresentation',
              'reservationTimeStatus',
              'assignmentContext',
              'assignmentOptions',
              'assignmentHasNetChange',
              'orderedAssignmentsForMaid',
              'initializeCleaningTargetLedger',
              'cleaningTargetFromAssignmentSource',
              'assignmentDateForCleaningTab',
          ]:
              function_block(name)

          for marker in [
              'function liveAssignmentTargetsForState',
              "source:'manual'",
              "source:'stayover'",
              'activationBlockedBy',
              'roomStopped',
              'roomStopReasons',
              'candles[',
              'roomIssues',
              'blocksCheckin',
          ]:
              print(f'\n===== MARKER {marker!r} count={text.count(marker)} =====')
              pos = 0
              for _ in range(8):
                  idx = text.find(marker, pos)
                  if idx < 0:
                      break
                  line = text.count('\n', 0, idx) + 1
                  print(f'\n--- line {line}, offset {idx} ---')
                  print(text[max(0, idx-1200):min(len(text), idx+7000)].replace('\n', '\\n'))
                  pos = idx + len(marker)
          PY