name: Inspect issue 114 assignment week and fixtures

on:
  push:
    branches:
      - codex/issue-114-assignment-week-and-varied-fixtures

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-114-assignment-week-and-varied-fixtures
          fetch-depth: 0

      - name: Build browser-QA inspection report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('WIREFRAME/index.html').read_text(encoding='utf-8')
          out=[]
          def line_no(offset): return text.count('\n',0,max(0,offset))+1
          def function_body(name):
            marker=f'function {name}'
            start=text.find(marker)
            out.append(f'\n===== FUNCTION {name} · line {line_no(start) if start>=0 else "missing"} =====')
            if start<0:return
            brace=text.find('{',start);depth=0;quote=None;escape=False
            for i in range(brace,len(text)):
              ch=text[i]
              if quote:
                if escape:escape=False
                elif ch=='\\':escape=True
                elif ch==quote:quote=None
              elif ch in "'\"`":quote=ch
              elif ch=='{':depth+=1
              elif ch=='}':
                depth-=1
                if depth==0:
                  out.append(text[start:i+1]);return
          def context(marker,before=1200,after=6000,limit=4):
            out.append(f'\n===== CONTEXT {marker!r} · count={text.count(marker)} =====')
            pos=0
            for n in range(limit):
              idx=text.find(marker,pos)
              if idx<0:break
              out.append(f'--- {n+1} · line {line_no(idx)} ---')
              out.append(text[max(0,idx-before):min(len(text),idx+after)])
              pos=idx+len(marker)
          for name in ['applyHashParameters','installCastleTestApi','renderAssignmentDashboard','assignmentRow','assignmentRowMarkup','renderAssignmentRows','renderRandomAssignmentCard','createRandomAssignment','restoreRandomAssignment']:
            function_body(name)
          for marker in ['window.', 'Object.defineProperty(window', "data-action=\"random-assignments\"", 'assignment-row', 'assignment-target', '청소대상 객실', '객실별 담당 수정']:
            context(marker)
          Path('issue-114-source-inspection.txt').write_text('\n'.join(out),encoding='utf-8')
          PY

      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-114-source-inspection.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: inspect issue 114 browser QA hooks"
          git push origin HEAD:codex/issue-114-assignment-week-and-varied-fixtures