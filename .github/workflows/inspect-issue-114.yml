name: Inspect issue 114 assignment week and fixtures

on:
  push:
    branches:
      - codex/issue-114-assignment-week-and-varied-fixtures

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-114-assignment-week-and-varied-fixtures
          fetch-depth: 0

      - name: Build compact source inspection report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('WIREFRAME/index.html')
          text = source.read_text(encoding='utf-8')
          out = []

          def add(value=''):
              out.append(str(value))

          def line_no(offset):
              return text.count('\n', 0, max(0, offset)) + 1

          def context(marker, before=700, after=1800, limit=4):
              add(f'\n===== CONTEXT {marker!r} · count={text.count(marker)} =====')
              cursor = 0
              for index in range(limit):
                  pos = text.find(marker, cursor)
                  if pos < 0:
                      break
                  add(f'--- occurrence {index + 1} · line {line_no(pos)} ---')
                  add(text[max(0, pos-before):min(len(text), pos+after)])
                  cursor = pos + len(marker)

          def function_body(name):
              marker = f'function {name}'
              start = text.find(marker)
              add(f'\n===== FUNCTION {name} · line {line_no(start) if start >= 0 else "missing"} =====')
              if start < 0:
                  return
              brace = text.find('{', start)
              if brace < 0:
                  add('opening brace missing')
                  return
              depth = 0
              quote = None
              escape = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in "'\"`":
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              add(text[start:i+1])
                              return
                  i += 1
              add(text[start:start+12000])

          add(f'SOURCE: {source} · chars={len(text)} · lines={text.count(chr(10))+1}')
          names = sorted(set(re.findall(r'function\s+([A-Za-z0-9_$]+)\s*\(', text)))
          matched = [name for name in names if re.search(r'(assign|availab|week|random)', name, re.I)]
          add('\n===== MATCHED FUNCTION NAMES =====')
          add('\n'.join(matched))

          for name in [
              'weekStartIso',
              'availabilityForWorkDate',
              'availabilitySubmissionForWeek',
              'availabilityRecordForWeek',
              'assignmentDateForCleaningTab',
              'syncAssignmentDateForCleaningTab',
              'assignmentTargetsForDate',
              'automaticAssignmentTargets',
              'renderCleaningAssignment',
              'renderAssignmentBoard',
              'renderAssignmentAvailability',
              'renderAvailabilityMatrix',
              'randomAssignmentCandidates',
              'runRandomAssignment',
              'applyRandomAssignment',
              'restoreRandomAssignment',
          ]:
              function_body(name)

          for marker in [
              'weeklyAvailability:',
              'availabilityHistory:',
              'availabilityForWorkDate(',
              '메이드 주간 근무표',
              '근무 가능일 제출',
              'randomAssignmentSnapshot',
              'SCALE_ASSIGNMENT_TARGETS',
              'INITIAL_MANUAL_ASSIGNMENT_TARGETS',
              "case 2:",
              "cleaningTab:'assignment-tomorrow'",
          ]:
              context(marker)

          report = Path('issue-114-source-inspection.txt')
          report.write_text('\n'.join(out), encoding='utf-8')
          print(f'wrote {report} ({report.stat().st_size} bytes)')
          PY

      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-114-source-inspection.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: capture issue 114 source inspection"
          git push origin HEAD:codex/issue-114-assignment-week-and-varied-fixtures