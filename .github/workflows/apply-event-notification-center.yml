name: Apply event notification center

on:
  push:
    branches:
      - codex/issue-98-event-notification-center

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/issue-98-event-notification-center
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the event notification center
        shell: bash
        run: |
          python3 .github/automation/fix-event-notification-patcher.py
          python3 .github/automation/add-notification-qa-bridge.py
          python3 -m py_compile .github/automation/apply-event-notification-center.py
          python3 .github/automation/apply-event-notification-center.py

      - name: Run permanent static workspace checks
        shell: bash
        run: node scripts/check-workspace.mjs

      - name: Install Chromium test runtime
        shell: bash
        run: |
          mkdir -p /tmp/castle-playwright
          cd /tmp/castle-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/castle-playwright/node_modules node_modules

      - name: Run rendered role, interaction, and responsive QA
        shell: bash
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 >/tmp/castle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node .github/automation/qa-event-notification-center.mjs

      - name: Commit only verified product changes
        shell: bash
        run: |
          rm -f node_modules
          rm -f .github/automation/add-notification-qa-bridge.py
          rm -f .github/automation/fix-event-notification-patcher.py
          rm -f .github/automation/apply-event-notification-center.py
          rm -f .github/automation/qa-event-notification-center.mjs
          rm -f .github/workflows/apply-event-notification-center.yml
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "기능: 관리자·메이드 이벤트 알림 센터를 구현한다"
          git push origin HEAD:codex/issue-98-event-notification-center
