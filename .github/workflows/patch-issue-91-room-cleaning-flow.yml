name: Patch issue 91 room cleaning request flow

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/issue-91-room-cleaning-request-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/issue-91-room-cleaning-request-flow
          fetch-depth: 0

      - name: Apply guarded source patch once
        shell: bash
        run: |
          if grep -q "function roomCleaningControl(no)" WIREFRAME/index.html; then
            echo "Product patch already applied"
          else
            python3 .github/automation/patch-issue-91-room-cleaning-flow.py
          fi

      - name: Repair guarded detail wrapper expression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('WIREFRAME/index.html')
          source=path.read_text(encoding='utf-8')
          bad="return mergeRoomBasicsPanel(mergeRoomCleaningPanel(mergeRoomIssuesPanel(mergeRoomOperationPanel(renderRoomDetailStandard(no),no),no),no);"
          good="return mergeRoomBasicsPanel(mergeRoomCleaningPanel(mergeRoomIssuesPanel(mergeRoomOperationPanel(renderRoomDetailStandard(no),no),no),no),no);"
          if bad in source:
              source=source.replace(bad,good,1)
              path.write_text(source,encoding='utf-8')
              print('repaired room detail wrapper expression')
          else:
              print('room detail wrapper expression already valid')
          PY

      - name: Update permanent workspace contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/check-workspace.mjs')
          source=path.read_text(encoding='utf-8')
          old="""const roomPresentationSource = html.slice(html.indexOf('function roomPresentation(no)'), html.indexOf('function renderPinRow', html.indexOf('function roomPresentation(no)')));
          const roomPresentationOrder = [\"if(blockers.length)return\", \"if(cleaning)return\", \"if(room.occupancy==='occupied')return\", \"key:'available'\"]
            .map((marker) => roomPresentationSource.indexOf(marker));
          if (roomPresentationOrder.some((index) => index < 0) || roomPresentationOrder.some((index, position) => position && index <= roomPresentationOrder[position - 1])) {
            throw new Error(`Room card priority must remain blocked > cleaning > occupied > available: ${roomPresentationOrder.join(', ')}`);
          }
          """
          new="""const roomPresentationSource = html.slice(html.indexOf('function roomPresentation(no)'), html.indexOf('function renderPinRow', html.indexOf('function roomPresentation(no)')));
          const roomPresentationOrder = [\"if(blockers.length)return\", \"if(room.occupancy==='occupied')return\", \"if(cleaning)return\", \"key:'available'\"]
            .map((marker) => roomPresentationSource.indexOf(marker));
          if (roomPresentationOrder.some((index) => index < 0) || roomPresentationOrder.some((index, position) => position && index <= roomPresentationOrder[position - 1])) {
            throw new Error(`Room card priority must remain blocked > occupied (with subordinate cleaning) > cleaning > available: ${roomPresentationOrder.join(', ')}`);
          }
          for (const contract of [
            'function roomCleaningControl(no)',
            \"label:'청소 요청'\",
            \"label:'청소 취소'\",
            \"confirmLabel:request?'청소 취소':'청소 대기열에 넣기'\",
            \"if(state.roomFilter==='occupied')return r.occupancy==='occupied'\",
            \"if(state.roomFilter==='cleaning')return roomNeedsCleaningNow(r.no)\",
            'data-room-cleaning-control=\\\"${no}\\\"',
            \"청소 필요 · ${p.cleaningKind||'청소'}\",
          ]) {
            if (!html.includes(contract)) throw new Error(`Room cleaning request contract missing: ${contract}`);
          }
          for (const forbidden of ['ON으로 변경', 'OFF로 변경', '청소 필요 ON', '청소 필요 OFF']) {
            if (html.includes(forbidden)) throw new Error(`Legacy cleaning switch copy remains: ${forbidden}`);
          }
          """
          if old in source:
              source=source.replace(old,new,1)
              path.write_text(source,encoding='utf-8')
              print('updated permanent room cleaning contracts')
          elif 'blocked > occupied (with subordinate cleaning) > cleaning > available' in source:
              print('permanent room cleaning contracts already updated')
          else:
              raise SystemExit('workspace priority contract block not found')
          PY

      - name: Refresh canonical hashes
        shell: bash
        run: |
          audit_hash=$(sha256sum DOCS/FINAL_UX_AUDIT.md | awk '{print $1}')
          index_hash=$(sha256sum WIREFRAME/index.html | awk '{print $1}')
          printf '%s  DOCS/FINAL_UX_AUDIT.md\n%s  WIREFRAME/index.html\n' "$audit_hash" "$index_hash" > SHA256SUMS.txt

      - name: Run workspace contract check
        run: node scripts/check-workspace.mjs

      - name: Commit patched product and permanent checks when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WIREFRAME/index.html scripts/check-workspace.mjs SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "수정: 모든 객실의 청소 요청·취소 흐름을 통일한다"
          git push origin HEAD:codex/issue-91-room-cleaning-request-flow
