name: Patch issue 91 room cleaning request flow

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'codex/issue-91-room-cleaning-request-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/issue-91-room-cleaning-request-flow
          fetch-depth: 0

      - name: Apply guarded source patch once
        shell: bash
        run: |
          if grep -q "function roomCleaningControl(no)" WIREFRAME/index.html; then
            echo "Product patch already applied"
          else
            python3 .github/automation/patch-issue-91-room-cleaning-flow.py
          fi

      - name: Repair guarded detail wrapper expression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('WIREFRAME/index.html')
          source=path.read_text(encoding='utf-8')
          bad="return mergeRoomBasicsPanel(mergeRoomCleaningPanel(mergeRoomIssuesPanel(mergeRoomOperationPanel(renderRoomDetailStandard(no),no),no),no);"
          good="return mergeRoomBasicsPanel(mergeRoomCleaningPanel(mergeRoomIssuesPanel(mergeRoomOperationPanel(renderRoomDetailStandard(no),no),no),no),no);"
          if bad in source:
              source=source.replace(bad,good,1)
              path.write_text(source,encoding='utf-8')
              print('repaired room detail wrapper expression')
          else:
              print('room detail wrapper expression already valid')
          PY

      - name: Refine cleaning request control safety
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('WIREFRAME/index.html')
          source=path.read_text(encoding='utf-8')
          changed=False

          old_cancel="const target=manualCleaningRequestTarget(request),assignment=state.assignments?.[request.targetId],attempt=target?attemptForCleaningTarget(target):activeUnfinishedAttempt(no),publication=state.publications?.[request.targetId];\n        if(attempt||currentSubmission(no))return '이미 청소 수행 회차가 만들어져 청소 상세에서 취소·조정해야 합니다.';"
          new_cancel="const target=manualCleaningRequestTarget(request),assignment=state.assignments?.[request.targetId],attempt=target?attemptForCleaningTarget(target):activeUnfinishedAttempt(no),publication=state.publications?.[request.targetId],submission=currentSubmission(no);\n        if(attempt||submission&&submission.status!=='approved')return '이미 청소 수행 회차가 만들어져 청소 상세에서 취소·조정해야 합니다.';"
          if old_cancel in source:
              source=source.replace(old_cancel,new_cancel,1)
              changed=True
          elif new_cancel not in source:
              raise SystemExit('manual cleaning cancellation safety contract not found')

          old_control="no=String(no);const room=ROOMS.find(item=>item.no===no),request=activeManualCleaningRequest(no),cancelBlock=request?manualCleaningCancelBlockReason(no):'',requestBlock=request?'':manualCleaningRequestBlockReason(no),kind=request?.kind||(room?.occupancy==='occupied'?'연박 청소':'추가 청소');"
          new_control="no=String(no);const room=ROOMS.find(item=>item.no===no),request=activeManualCleaningRequest(no),job=state.jobs[no],submission=currentSubmission(no),activeSubmission=submission&&submission.status!=='approved'?submission:null,attempt=activeUnfinishedAttempt(no),hasWorkflow=roomHasCleaningWorkflow(no),cancelBlock=request?manualCleaningCancelBlockReason(no):'',requestBlock=request?'':manualCleaningRequestBlockReason(no);\n        const kind=request?.kind||attempt?.kind||activeSubmission?.kind||(hasWorkflow?(job==='reclean'?'재청소':job==='stayover-requested'?'연박 청소':job==='extra-requested'?'추가 청소':'퇴실 청소'):(room?.occupancy==='occupied'?'연박 청소':'추가 청소'));"
          if old_control in source:
              source=source.replace(old_control,new_control,1)
              changed=True
          elif new_control not in source:
              raise SystemExit('room cleaning control kind contract not found')

          old_stale="toast('객실 또는 청소 상태가 바뀌어 요청을 해제하지 않았습니다.','error')"
          new_stale="toast('객실 또는 청소 상태가 바뀌어 요청을 취소하지 않았습니다.','error')"
          if old_stale in source:
              source=source.replace(old_stale,new_stale,1)
              changed=True

          if changed:
              path.write_text(source,encoding='utf-8')
              print('refined cleaning request control safety')
          else:
              print('cleaning request control safety already refined')
          PY

      - name: Update permanent workspace contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/check-workspace.mjs')
          source=path.read_text(encoding='utf-8')
          old="""const roomPresentationSource = html.slice(html.indexOf('function roomPresentation(no)'), html.indexOf('function renderPinRow', html.indexOf('function roomPresentation(no)')));
          const roomPresentationOrder = [\"if(blockers.length)return\", \"if(cleaning)return\", \"if(room.occupancy==='occupied')return\", \"key:'available'\"]
            .map((marker) => roomPresentationSource.indexOf(marker));
          if (roomPresentationOrder.some((index) => index < 0) || roomPresentationOrder.some((index, position) => position && index <= roomPresentationOrder[position - 1])) {
            throw new Error(`Room card priority must remain blocked > cleaning > occupied > available: ${roomPresentationOrder.join(', ')}`);
          }
          """
          new="""const roomPresentationSource = html.slice(html.indexOf('function roomPresentation(no)'), html.indexOf('function renderPinRow', html.indexOf('function roomPresentation(no)')));
          const roomPresentationOrder = [\"if(blockers.length)return\", \"if(room.occupancy==='occupied')return\", \"if(cleaning)return\", \"key:'available'\"]
            .map((marker) => roomPresentationSource.indexOf(marker));
          if (roomPresentationOrder.some((index) => index < 0) || roomPresentationOrder.some((index, position) => position && index <= roomPresentationOrder[position - 1])) {
            throw new Error(`Room card priority must remain blocked > occupied (with subordinate cleaning) > cleaning > available: ${roomPresentationOrder.join(', ')}`);
          }
          for (const contract of [
            'function roomCleaningControl(no)',
            \"label:'청소 요청'\",
            \"label:'청소 취소'\",
            \"confirmLabel:request?'청소 취소':'청소 대기열에 넣기'\",
            \"if(state.roomFilter==='occupied')return r.occupancy==='occupied'\",
            \"if(state.roomFilter==='cleaning')return roomNeedsCleaningNow(r.no)\",
            'data-room-cleaning-control=\\\"${no}\\\"',
            \"청소 필요 · ${p.cleaningKind||'청소'}\",
          ]) {
            if (!html.includes(contract)) throw new Error(`Room cleaning request contract missing: ${contract}`);
          }
          for (const forbidden of ['ON으로 변경', 'OFF로 변경', '청소 필요 ON', '청소 필요 OFF']) {
            if (html.includes(forbidden)) throw new Error(`Legacy cleaning switch copy remains: ${forbidden}`);
          }
          """
          if old in source:
              source=source.replace(old,new,1)
              path.write_text(source,encoding='utf-8')
              print('updated permanent room cleaning contracts')
          elif 'blocked > occupied (with subordinate cleaning) > cleaning > available' in source:
              print('permanent room cleaning contracts already updated')
          else:
              raise SystemExit('workspace priority contract block not found')
          PY

      - name: Refresh canonical hashes
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json

          audit_path=Path('DOCS/FINAL_UX_AUDIT.md')
          index_path=Path('WIREFRAME/index.html')
          audit_hash=sha256(audit_path.read_bytes()).hexdigest()
          index_hash=sha256(index_path.read_bytes()).hexdigest()

          Path('SHA256SUMS.txt').write_text(
              f'{audit_hash}  DOCS/FINAL_UX_AUDIT.md\n{index_hash}  WIREFRAME/index.html\n',
              encoding='utf-8',
          )

          manifest_path=Path('manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest.setdefault('sha256',{})['DOCS/FINAL_UX_AUDIT.md']=audit_hash
          manifest['sha256']['WIREFRAME/index.html']=index_hash
          manifest['version']='2026-08-25-room-cleaning-request-flow'
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('refreshed SHA256SUMS.txt and manifest.json')
          PY

      - name: Run workspace contract check
        run: node scripts/check-workspace.mjs

      - name: Commit patched product and permanent checks when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WIREFRAME/index.html scripts/check-workspace.mjs SHA256SUMS.txt manifest.json
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "수정: 기존 완료 제출과 청소 유형 판정을 안전하게 처리한다"
          git push origin HEAD:codex/issue-91-room-cleaning-request-flow
