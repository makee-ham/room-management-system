name: Trigger modal and quick-booking UX fixes

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  trigger:
    if: github.head_ref == 'codex/modal-scroll-quick-booking-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: codex/modal-scroll-quick-booking-ux
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start from current main
        shell: bash
        run: |
          git fetch origin main codex/modal-scroll-quick-booking-ux
          git reset --hard origin/main

      - name: Apply targeted UI fixes
        shell: bash
        run: |
          python3 .github/automation/apply-modal-scroll-quick-booking-ux.py
          python3 .github/automation/apply-modal-scroll-history-manual.py
          python3 .github/automation/apply-modal-history-return-scroll.py
          python3 .github/automation/apply-modal-close-routing.py
          python3 .github/automation/apply-modal-parent-route-sync.py
          python3 .github/automation/apply-modal-delayed-scroll-restore.py

      - name: Run static workspace checks
        shell: bash
        run: node scripts/check-workspace.mjs

      - name: Install Chromium test runtime
        shell: bash
        run: |
          mkdir -p /tmp/castle-playwright
          cd /tmp/castle-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -s /tmp/castle-playwright/node_modules node_modules

      - name: Run rendered interaction QA
        shell: bash
        run: |
          python3 scripts/serve.py --host 127.0.0.1 --port 4173 >/tmp/castle-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break
            sleep 1
          done
          node .github/automation/qa-modal-scroll-quick-booking-ux.mjs

      - name: Commit verified changes to the feature branch
        shell: bash
        run: |
          rm -f node_modules
          rm -f .codex-modal-scroll-quick-booking-trigger
          rm -f .github/workflows/apply-modal-scroll-quick-booking-ux.yml
          rm -f .github/workflows/trigger-modal-scroll-quick-booking-ux.yml
          rm -f .github/automation/apply-modal-scroll-quick-booking-ux.py
          rm -f .github/automation/apply-modal-scroll-history-manual.py
          rm -f .github/automation/apply-modal-history-return-scroll.py
          rm -f .github/automation/apply-modal-close-routing.py
          rm -f .github/automation/apply-modal-parent-route-sync.py
          rm -f .github/automation/apply-modal-delayed-scroll-restore.py
          rm -f .github/automation/qa-modal-scroll-quick-booking-ux.mjs
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add -A
          git commit -m "수정: 예약 화면의 스크롤과 유형 필터를 개선한다"
          git push --force-with-lease origin HEAD:codex/modal-scroll-quick-booking-ux
