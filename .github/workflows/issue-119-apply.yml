name: Final verification for issue 119

on:
  push:
    branches:
      - feature/issue-119-role-cleaning-long-stay
    paths:
      - .github/workflows/issue-119-apply.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-119-final-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-119-role-cleaning-long-stay
          fetch-depth: 0

      - name: Verify issue 119 contracts and JavaScript syntax
        run: node scripts/check-issue-119.mjs

      - name: Verify repository workspace
        run: node scripts/check-workspace.mjs

      - name: Check patch hygiene
        run: git diff --check origin/main...HEAD

      - name: Serve wireframe and verify response
        shell: bash
        run: |
          python3 scripts/serve.py >/tmp/room-management-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/tmp/room-management-index.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/room-management-index.html
          grep -q 'roomManagementAuthSessionV1' /tmp/room-management-index.html
          grep -q '종료일 미정' /tmp/room-management-index.html
          grep -q 'focus-assignment-room' /tmp/room-management-index.html
