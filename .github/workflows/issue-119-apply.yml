name: Apply issue 119 implementation

on:
  push:
    branches:
      - feature/issue-119-role-cleaning-long-stay
    paths:
      - scripts/apply_issue_119.py
      - scripts/patch_issue_119_long_stay_end.py
      - .github/workflows/issue-119-apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-119-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-119-role-cleaning-long-stay
          fetch-depth: 0

      - name: Apply issue 119 changes
        run: |
          python3 scripts/apply_issue_119.py
          if [ -f scripts/patch_issue_119_long_stay_end.py ]; then
            python3 scripts/patch_issue_119_long_stay_end.py
          fi

      - name: Verify source and workspace
        run: |
          node scripts/check-issue-119.mjs
          node scripts/check-workspace.mjs
          git diff --check

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WIREFRAME/index.html WIREFRAME/README.md WIREFRAME/QA.md DOCS/17_ROOM_CATALOG_LONG_STAY_DECISIONS.md SHA256SUMS.txt scripts/check-issue-119.mjs
          git commit -m "feat: implement issue 119 role cleaning and long stay flows"
          git push origin HEAD:feature/issue-119-role-cleaning-long-stay
