name: Apply and verify issue 119

on:
  push:
    branches:
      - feature/issue-119-role-cleaning-long-stay
    paths:
      - .github/workflows/issue-119-apply.yml
      - scripts/apply_issue_119_v2.py
      - scripts/post_issue_119_v2.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-119-apply-v2
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-119-role-cleaning-long-stay
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply issue 119 changes
        run: |
          python3 scripts/apply_issue_119_v2.py
          python3 scripts/post_issue_119_v2.py

      - name: Verify issue 119 contracts
        run: node scripts/check-issue-119.mjs

      - name: Verify repository workspace
        run: node scripts/check-workspace.mjs

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          git add WIREFRAME/index.html WIREFRAME/README.md WIREFRAME/QA.md DOCS/17_ROOM_CATALOG_LONG_STAY_DECISIONS.md SHA256SUMS.txt scripts/check-issue-119.mjs scripts/check-workspace.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes"
            exit 0
          fi
          git commit -m "feat: add role login, assignment UX, and optional long stays"
          git push origin HEAD:feature/issue-119-role-cleaning-long-stay
