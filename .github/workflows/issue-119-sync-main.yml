name: Sync issue 119 with latest main

on:
  push:
    branches:
      - feature/issue-119-role-cleaning-long-stay
    paths:
      - .github/workflows/issue-119-sync-main.yml
      - scripts/apply_issue_119_v2.py
      - scripts/post_issue_119_v2.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-119-sync-main
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-119-role-cleaning-long-stay
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge latest main and restore canonical files from main
        shell: bash
        run: |
          git config user.name "Ham Arin"
          git config user.email "79068658+makee-ham@users.noreply.github.com"
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          echo "merge status: ${merge_status}"
          git checkout origin/main -- \
            WIREFRAME/index.html \
            WIREFRAME/README.md \
            WIREFRAME/QA.md \
            DOCS/17_ROOM_CATALOG_LONG_STAY_DECISIONS.md \
            SHA256SUMS.txt \
            manifest.json \
            scripts/check-workspace.mjs
          git add \
            WIREFRAME/index.html \
            WIREFRAME/README.md \
            WIREFRAME/QA.md \
            DOCS/17_ROOM_CATALOG_LONG_STAY_DECISIONS.md \
            SHA256SUMS.txt \
            manifest.json \
            scripts/check-workspace.mjs
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge files:"
            echo "$unresolved"
            exit 1
          fi

      - name: Reapply issue 119 on top of main
        run: |
          python3 scripts/apply_issue_119_v2.py
          python3 scripts/post_issue_119_v2.py

      - name: Verify issue-specific contracts
        run: node scripts/check-issue-119.mjs

      - name: Verify repository workspace
        run: node scripts/check-workspace.mjs

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit merged implementation
        shell: bash
        run: |
          git add -A
          git commit -m "merge: sync main and reapply issue 119"
          git push origin HEAD:feature/issue-119-role-cleaning-long-stay
